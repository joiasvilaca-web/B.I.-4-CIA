    ${f('cargo','Cargo / papel específico')}
    <div><label>Situação</label><select id="iff-status" ${dis}>${Object.entries(INF_STATUS).map(([k,v])=>`<option value="${k}" ${(p.status||'solto')===k?'selected':''}>${v}</option>`).join('')}</select></div>

    <div style="grid-column:1/-1"><label>Observações</label><textarea id="iff-obs" rows="4" ${dis}>${esc(p.obs||'')}</textarea></div></div>
    ${p.id?`<div style="font-size:11px;color:#888;margin-top:6px">Cadastrado por ${esc(p.criado_por||'?')} em ${esc(fmtData(p.criado_em))} · última alteração por ${esc(p.atualizado_por||'?')} em ${esc(fmtData(p.atualizado_em))}</div>`:''}
    ${ed?`<div style="margin-top:10px;display:flex;gap:8px"><button class="btn" id="iff-salvar">💾 Salvar</button><span id="iff-msg" style="font-size:12px;align-self:center"></span></div>`:'<p style="font-size:12px;color:#888">Somente leitura.</p>'}`;

function infOpcaoPessoa(p){ return `${p.nome}${p.alcunha?' “'+p.alcunha+'”':''} #${p.id}`; }
function infFichaVinc(c,p){
  const ed=INF.podeEditar; const L=INF.cache.adj.get(p.id)||[];
  const linha=v=>{ const outro=INF.cache.byId.get(v.a_id===p.id?v.b_id:v.a_id); const sub=infEhSub(v.tipo)&&!!v.a_superior; let rel=v.tipo;
    if(sub && v.a_superior){ const euSup=(v.a_id===p.id); rel=euSup?`Eu sou SUPERIOR de ${outro.nome}`:`Eu sou SUBORDINADO a ${outro.nome}`; }
    return `<div class="if-ln"><span style="width:10px;height:10px;border-radius:50%;background:${infCorVinculo(v.tipo)};display:inline-block"></span><a href="#" data-p="${outro.id}"><b>${esc(infNomeExib(outro))}</b></a> ${outro.faccao?`<span class="if-b" style="background:${infCorFaccao(outro.faccao)}">${esc(outro.faccao)}</span>`:''}
      <span>— ${esc(sub?v.tipo+': '+rel:v.tipo)}</span><span style="color:#888">força ${v.forca||2}/3</span>${v.obs?`<span style="color:#777">· ${esc(v.obs)}</span>`:''}${ed?`<button class="btn perigo if-sm" data-del="${v.id}" style="margin-left:auto">Remover</button>`:''}</div>`; };
  c.innerHTML=`${L.map(linha).join('')||'<p style="color:#888;font-size:13px">Nenhum vínculo cadastrado.</p>'}
   ${ed?`<div class="if-box" style="margin-top:10px;background:#fbfaf3"><h3>+ Novo vínculo</h3><div class="if-grid">
     <div class="if-g2"><label>Pessoa (digite para buscar; se não existir, cadastre rapidamente)</label><input id="ifv-p" list="ifv-dl" placeholder="nome ou alcunha">${infDl('ifv-dl',INF.pessoas.filter(x=>x.id!==p.id).map(infOpcaoPessoa))}</div>
     <div><label>Tipo de vínculo</label><select id="ifv-t">${INF.cat.vinculos.map(v=>`<option>${esc(v[0])}</option>`).join('')}</select></div>
     <div id="ifv-dirw"><label>Hierarquia</label><select id="ifv-dir"><option value="eu">Eu sou SUPERIOR dessa pessoa</option><option value="ele">Eu sou SUBORDINADO a essa pessoa</option></select></div>
     <div><label>Força do vínculo</label><select id="ifv-f"><option value="1">1 – fraco / eventual</option><option value="2" selected>2 – regular</option><option value="3">3 – forte / constante</option></select></div>
     <div class="if-g2"><label>Observação</label><input id="ifv-o"></div></div>
     <div style="margin-top:8px;display:flex;gap:8px;align-items:center"><button class="btn" id="ifv-ok">Adicionar vínculo</button><span id="ifv-m" style="font-size:12px"></span></div></div>`:''}`;
  c.querySelectorAll('[data-p]').forEach(a=>a.onclick=e=>{ e.preventDefault(); infFicha(+a.dataset.p); });
  c.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(!confirm('Remover este vínculo?')) return; try{ await apiInf('infExcluir',{entidade:'vinculo',id:+b.dataset.del}); await infAposSalvar(p.id,'vinc'); }catch(e){ infToast(e.message,true); } });
  if(!ed) return;
  const atualDir=()=>{ document.getElementById('ifv-dirw').style.display=infEhSub(document.getElementById('ifv-t').value)?'':'none'; }; document.getElementById('ifv-t').onchange=atualDir; atualDir();
  document.getElementById('ifv-ok').onclick=async()=>{
    const m=document.getElementById('ifv-m'); const txt=document.getElementById('ifv-p').value.trim(); if(!txt){ m.textContent='Informe a pessoa.'; return; }
    try{
      let outroId; const mt=txt.match(/#(\d+)$/); if(mt) outroId=+mt[1]; else { const ach=INF.pessoas.filter(x=>x.id!==p.id&&(infNorm(x.nome)===infNorm(txt)||infNorm(x.alcunha)===infNorm(txt))); if(ach.length===1) outroId=ach[0].id; }
      if(!outroId){ if(!confirm(`“${txt}” não está cadastrado(a). Cadastrar agora só com o nome e vincular?`)) return; const r=await apiInf('infSalvar',{entidade:'pessoa',dados:{nome:txt,status:'solto',risco:1}}); outroId=r.registro.id; }
      const tipo=document.getElementById('ifv-t').value; const sub=infEhSub(tipo); const eu=document.getElementById('ifv-dir').value==='eu';
      const dados = sub && !eu ? {a_id:outroId,b_id:p.id,a_superior:true} : {a_id:p.id,b_id:outroId,a_superior:sub&&eu};
      await apiInf('infSalvar',{entidade:'vinculo',dados:{...dados,tipo,forca:document.getElementById('ifv-f').value,obs:document.getElementById('ifv-o').value}});
      await infAposSalvar(p.id,'vinc'); infToast('Vínculo adicionado.');
    }catch(e){ m.innerHTML=`<span style="color:#a4202a">${esc(e.message)}</span>`; }
  };
}

// ---------- teia (rede) ----------
async function infTeia(c){
  const T=INF.T; const {lista,ids,vis:visSet}=infConjunto();
  let edges=INF.vinculos.filter(v=>visSet.has(v.a_id)&&visSet.has(v.b_id)&&INF.cache.byId.has(v.a_id)&&INF.cache.byId.has(v.b_id));
  const comArestas=new Set(); edges.forEach(v=>{ comArestas.add(v.a_id); comArestas.add(v.b_id); });
  let pessoas=INF.pessoas.filter(p=>visSet.has(p.id)); if(!T.isolados) pessoas=pessoas.filter(p=>comArestas.has(p.id));
  const noIds=new Set(pessoas.map(p=>p.id)); edges=edges.filter(v=>noIds.has(v.a_id)&&noIds.has(v.b_id));
  c.innerHTML=`<div class="if-box"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:12px">
    <b>${pessoas.length} pessoas · ${edges.length} vínculos</b>
    <label>Layout <select id="ift-lay" style="width:auto"><option value="fisica" ${T.layout==='fisica'?'selected':''}>Teia (livre)</option><option value="hier" ${T.layout==='hier'?'selected':''}>Hierarquia (por nível)</option></select></label>
    <label>Tamanho <select id="ift-tam" style="width:auto"><option value="score" ${T.tam==='score'?'selected':''}>Prioridade</option><option value="grau" ${T.tam==='grau'?'selected':''}>Nº de vínculos</option><option value="risco" ${T.tam==='risco'?'selected':''}>Risco</option></select></label>
    <label style="display:flex;gap:4px;align-items:center;cursor:pointer"><input type="checkbox" id="ift-iso" style="width:auto" ${T.isolados?'checked':''}> mostrar sem vínculos</label>
    <button class="btn secundario if-sm" id="ift-fit">⤢ Ajustar</button><button class="btn secundario if-sm" id="ift-png">🖼️ PNG</button></div>
    <div style="display:grid;grid-template-columns:1fr 250px;gap:10px"><div id="if-teia"></div><div id="ift-side" style="font-size:12.5px"><div style="color:#888">Clique em uma pessoa para ver o resumo. Duplo clique abre a ficha.</div></div></div>
    <div class="if-leg" id="ift-leg"></div></div>`;
  if(!pessoas.length){ document.getElementById('if-teia').innerHTML='<p style="padding:20px;color:#888">Nenhum vínculo para o conjunto filtrado. Cadastre vínculos na ficha dos infratores (aba “Vínculos”).</p>'; return; }
  if(!(await infLib('vis'))){ document.getElementById('if-teia').outerHTML=INF_AVISO_LIB('rede'); return; }
  document.getElementById('ift-lay').onchange=e=>{ T.layout=e.target.value; infCorpo(); }; document.getElementById('ift-tam').onchange=e=>{ T.tam=e.target.value; infCorpo(); }; document.getElementById('ift-iso').onchange=e=>{ T.isolados=e.target.checked; infCorpo(); };
  const tam=p=>{ const s=infScore(p); const v = T.tam==='grau'?s.grau/6 : T.tam==='risco'?((p.risco||1)/5) : s.total/100; return 12+Math.min(1,v)*26; };
  const nodes=pessoas.map(p=>{ const cor=infCorFaccao(p.faccao); const st=p.status; return {id:p.id,label:infCurto(p),title:`${infNomeExib(p)}\n${p.faccao||'sem facção'}${p.nivel?' · nível '+p.nivel:''}\n${INF_STATUS[st]||''}`,
    shape:(p.nivel&&p.nivel<=2)?'diamond':(p.status==='preso'?'square':'dot'),size:tam(p),level:p.nivel||6,
    color:{background:cor,border:st==='foragido'?'#a4202a':st==='preso'?'#555':st==='morto'?'#000':'#fff',highlight:{background:cor,border:'#000'}},borderWidth:st==='solto'||st==='monitorado'?2:4,borderWidthSelected:5,
    shapeProperties:{borderDashes:st==='preso'?[4,3]:false},font:{size:12,color:'#222',strokeWidth:3,strokeColor:'#fff'},opacity:ids.has(p.id)?1:.5}; });
  const ed=edges.map(v=>{ const sub=infEhSub(v.tipo); const a=v.a_superior; return {id:v.id,from:v.a_id,to:v.b_id,arrows:sub?'to':'',color:{color:infCorVinculo(v.tipo),opacity:.85},width:1+(v.forca||2),dashes:!sub,title:sub?`Subordinação: ${INF.cache.byId.get(v.a_id).nome} → ${INF.cache.byId.get(v.b_id).nome}`:`${v.tipo}`,smooth:{type:'continuous'}}; });
  // para subordinacao, a seta vai do superior (a) para o subordinado (b): ja garantido por a_superior=true; se a_superior=false o tipo de subordinacao nao tem direcao
  ed.forEach((e,i)=>{ const v=edges[i]; if(infEhSub(v.tipo) && !v.a_superior) e.arrows=''; });
  const hier=T.layout==='hier';
  const net=new vis.Network(document.getElementById('if-teia'),{nodes:nodes,edges:ed},{
    layout: hier?{hierarchical:{enabled:true,direction:'UD',sortMethod:'directed',levelSeparation:120,nodeSpacing:110}}:{improvedLayout:pessoas.length<300},
    physics: hier?false:{solver:'barnesHut',barnesHut:{gravitationalConstant:-5000,springLength:110,springConstant:.04},stabilization:{iterations:180}},
    interaction:{hover:true,tooltipDelay:150,navigationButtons:false,keyboard:false},edges:{smooth:{type:'continuous'}}});
  INF.net=net;
  // em modo hierarquico o nivel vem do cadastro; sem nivel fica na base
  const side=document.getElementById('ift-side');
  net.on('click',ev=>{ if(!ev.nodes.length){ return; } const p=INF.cache.byId.get(ev.nodes[0]); const s=infScore(p); const L=INF.cache.adj.get(p.id)||[];
    side.innerHTML=`<b style="font-size:14px">${esc(infNomeExib(p))}</b><br>${p.faccao?`<span class="if-b" style="background:${infCorFaccao(p.faccao)}">${esc(p.faccao)}</span> `:''}${infBadge(p.status)} ${infRiscoHtml(p.risco)}
      <div style="margin:6px 0">${esc(p.cargo||'')}${p.nivel?` · nível ${p.nivel}`:''}<br>${esc(p.bairro||'')}</div>
      <div>Prioridade: <b>${s.total.toLocaleString('pt-BR',{maximumFractionDigits:1})}</b> · ${s.grau} vínculos · ${s.n} crimes</div>
      <div style="margin:6px 0">${Object.keys(infCrimesDe(p)).slice(0,6).map(x=>`<span class="if-chip">${esc(x)}</span>`).join('')}</div>
      <div style="max-height:150px;overflow:auto">${L.map(v=>{ const o=INF.cache.byId.get(v.a_id===p.id?v.b_id:v.a_id); const sub=infEhSub(v.tipo)&&v.a_superior; const rel=sub?((v.a_id===p.id)?'superior de':'subordinado a'):v.tipo; return `<div style="font-size:11.5px">• ${esc(rel)} <a href="#" data-p="${o.id}">${esc(infCurto(o))}</a></div>`; }).join('')}</div>
      <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn if-sm" onclick="infFicha(${p.id})">Abrir ficha</button><button class="btn secundario if-sm" onclick="INF.F.foco='${p.id}';infRender()">🎯 Focar rede</button></div>`;
    side.querySelectorAll('[data-p]').forEach(a=>a.onclick=e=>{ e.preventDefault(); net.selectNodes([+a.dataset.p]); net.focus(+a.dataset.p,{scale:1.1,animation:true}); }); });
  net.on('doubleClick',ev=>{ if(ev.nodes.length) infFicha(ev.nodes[0]); });
  document.getElementById('ift-fit').onclick=()=>net.fit({animation:true});
  document.getElementById('ift-png').onclick=()=>{ const cv=document.querySelector('#if-teia canvas'); if(!cv) return; const a=document.createElement('a'); a.href=cv.toDataURL('image/png'); a.download='teia-infratores.png'; a.click(); };
  const fac=[...new Set(pessoas.map(p=>p.faccao||''))].map(f=>`<span><i style="background:${infCorFaccao(f)}"></i>${esc(f||'Sem facção')}</span>`).join('');
  const tipos=[...new Set(edges.map(v=>v.tipo))].map(t=>`<span><i style="background:${infCorVinculo(t)};border-radius:2px;height:4px;vertical-align:2px"></i>${esc(t)}${infEhSub(t)?' (→ do superior ao subordinado)':''}</span>`).join('');
  document.getElementById('ift-leg').innerHTML=fac+'<span style="width:100%"></span>'+tipos+'<span style="width:100%"></span><span style="color:#666">◆ nível 1–2 · ■ preso · borda vermelha = foragido · tamanho = '+({score:'prioridade',grau:'nº de vínculos',risco:'risco'}[T.tam])+(INF.F.vizinhos?' · esmaecidos = conexões fora do filtro':'')+'</span>';
}

// ---------- Pareto ----------
function infParetoDados(){
  const P=INF.P; const {lista}=infConjunto(); const F=INF.F; const m=new Map(); const add=(k,l,v,id)=>{ if(!v) return; const o=m.get(k)||{k,label:l,v:0,id}; o.v+=v; m.set(k,o); };
  lista.forEach(p=>{ const s=infScore(p); const cr=infCrimesDe(p,F.de,F.ate);
    if(P.dim==='pessoa'){ add('p'+p.id, infNomeExib(p), P.modo==='qual'?s.total : P.med==='conex'?s.grau : P.med==='ddu'?(INF.cache.ddusDe.get(p.id)||[]).length : Object.values(cr).reduce((a,b)=>a+b,0), p.id); }
    else if(P.dim==='crime'){ Object.keys(cr).forEach(c=>add(c,c,P.modo==='qual'?infPesoCrime(c)*cr[c]:cr[c])); }
    else if(P.dim==='bairro_res'){ const b=p.bairro||'(sem bairro)'; add(b,b,P.modo==='qual'?s.total:1); }
    else if(P.dim==='bairro_atu'){ const bs=new Set(); (INF.cache.locs.get(p.id)||[]).forEach(l=>{ if(l.bairro) bs.add(l.bairro); }); (INF.cache.regs.get(p.id)||[]).forEach(r=>{ if(r.bairro) bs.add(r.bairro); }); if(!bs.size) bs.add('(sem local informado)'); bs.forEach(b=>add(b,b,P.modo==='qual'?s.total:1)); }
    else if(P.dim==='bairro_ddu'){ const seen=new Set(); (INF.cache.ddusDe.get(p.id)||[]).forEach(dd=>{ const b=(dd.local_denuncia&&dd.local_denuncia.bairro)||'(sem bairro)'; const k=b+'#'+dd.id; if(P.modo==='qual'){ add(b,b,s.total/Math.max(1,(INF.cache.ddusDe.get(p.id)||[]).length)); } else if(!seen.has(k)){ seen.add(k); add(b,b,1); } }); }
    else if(P.dim==='faccao'){ const f=p.faccao||'(sem facção)'; add(f,f,P.modo==='qual'?s.total:1); }

function infTitulo(s){ const peq=['de','da','do','das','dos','e']; return String(s||'').trim().toLowerCase().split(/\s+/).filter(Boolean).map((w,i)=>(i&&peq.includes(w))?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' '); }

function infFacMap(n){ const t=infNorm(n); for(const [r,s] of INF_FAC_SIN) if(r.test(t)) return s; return String(n||'').trim(); }
const INF_CRIME_SIN=[[/associacao.*trafico/,'Associação ao tráfico'],[/trafico|entorpecente|drogas/,'Tráfico de drogas'],[/organizacao criminosa/,'Organização criminosa'],[/tentativa.*homicidio/,'Tentativa de homicídio'],[/homicidio/,'Homicídio'],[/latrocinio/,'Latrocínio'],[/roubo.*veiculo/,'Roubo a veículo'],[/roubo/,'Roubo'],[/furto/,'Furto'],[/receptacao/,'Receptação'],[/arma/,'Porte/posse ilegal de arma'],[/extorsao/,'Extorsão'],[/ameaca/,'Ameaça'],[/lesao/,'Lesão corporal'],[/violencia domestica/,'Violência doméstica'],[/estelionato/,'Estelionato'],[/estupro/,'Estupro'],[/corrupcao de menores/,'Corrupção de menores']];
function infDduCrimes(d){ const out=[]; [d.natureza_principal,d.natureza_indexador].forEach(n=>{ const t=infNorm(n&&n.descricao); if(!t) return; for(const [r,c] of INF_CRIME_SIN){ if(r.test(t)){ if(INF.cat.crimes.some(x=>x[0]===c)&&!out.includes(c)) out.push(c); break; } } }); return out; }
function infDduFisico(e){ const p=[]; if(e.faixa_etaria) p.push(e.faixa_etaria.toLowerCase()); if(e.estatura) p.push('estatura '+e.estatura.toLowerCase()); if(e.tipo_fisico) p.push(e.tipo_fisico.toLowerCase()); if(e.cor_raca) p.push('cor '+e.cor_raca.toLowerCase()); if(e.olhos) p.push('olhos '+e.olhos.toLowerCase()); const cb=[e.cabelo,e.tipo_cabelo].filter(Boolean).join(' ').toLowerCase(); if(cb) p.push('cabelo '+cb); if(e.tatuagem) p.push('tatuagem: '+e.tatuagem); const t=p.join('; '); return t?t.charAt(0).toUpperCase()+t.slice(1):''; }
function infEndTxt(e){ let t=[e.tipo_log&&infTitulo(e.tipo_log),infTitulo(e.logradouro)].filter(Boolean).join(' '); if(e.numero) t+=', '+e.numero; if(e.complemento) t+=' ('+infTitulo(e.complemento)+')'; return t; }
function infEndChave(e){ e=e||{}; const a=s=>infNorm(s).replace(/[^a-z0-9]/g,''); return a(e.logradouro)+'|'+String(e.numero||'').replace(/\D/g,'')+'|'+a(e.bairro); }
function infJac(a,b){ const t=s=>new Set(infNorm(s).split(/[^a-z0-9]+/).filter(w=>w.length>3)); const A=t(a),B=t(b); if(!A.size||!B.size) return 0; let i=0; A.forEach(x=>{ if(B.has(x)) i++; }); return i/new Set([...A,...B]).size; }

function infDduCands(ev){
  const tk=s=>new Set(infNorm(s).split(/[^a-z0-9]+/).filter(w=>w.length>2));
  const nn=infNorm(ev.nome).trim(), ap=infNorm(ev.apelido).trim(), mae=infNorm(ev.mae).trim(), cpf=String(ev.cpf||'').replace(/\D/g,''), bai=infNorm(ev.endereco&&ev.endereco.bairro);
  const out=[];
  INF.pessoas.forEach(p=>{ let s=0; const why=[]; const pn=infNorm(p.nome).trim(), pa=infNorm(p.alcunha).trim(), pd=String(p.documento||'').replace(/\D/g,'');
    if(cpf.length>=9 && pd===cpf){ s+=100; why.push('CPF igual'); }
    if(nn&&pn){ if(pn===nn){ s+=70; why.push('nome igual'); } else { const a=tk(ev.nome),b=tk(p.nome); let n=0; a.forEach(x=>{ if(b.has(x)) n++; }); const j=n/Math.max(1,new Set([...a,...b]).size); if(n>=2&&j>=.5){ s+=Math.round(60*j); why.push('nome parecido'); } } }
    if(ap&&pa&&pa===ap){ s+=45; why.push('mesma alcunha'); } else if((ap&&pn===ap)||(pa&&pa===nn)){ s+=30; why.push('alcunha = nome'); }
    if(mae&&infNorm(p.mae).trim()===mae){ s+=35; why.push('mesma mãe'); }
    if(s>0&&bai&&infNorm(p.bairro)===bai) s+=8;
    if(s>=40) out.push({p,s,why}); });
  return out.sort((a,b)=>b.s-a.s).slice(0,5);
}

      if(f.endereco&&(!p||!p.lat)&&ev.endereco&&IMP.geo){ nGeo++; const g=await geo([ev.endereco.tipo_log,ev.endereco.logradouro,ev.endereco.numero].filter(Boolean).join(' '),f.bairro); if(g){ pessoa.lat=g.lat; pessoa.lng=g.lng; nGeoOk++; if(!pessoa.bairro&&g.bairro) pessoa.bairro=g.bairro; } }
      const locais=[];
      for(const x of E.itens.filter(x=>x.on)){ const l={tipo:x.tipo,descricao:x.descricao.slice(0,250),bairro:x.bairro,obs:x.obs.slice(0,1000)}; if(x.q&&IMP.geo){ m.textContent=`Localizando ${x.descricao.slice(0,40)}…`; nGeo++; const g=await geo(x.q,x.bairro); if(g){ l.lat=g.lat; l.lng=g.lng; nGeoOk++; if(!l.bairro&&g.bairro) l.bairro=g.bairro; } } locais.push(l); }
      envs.push({pessoa_id:p?p.id:null,pessoa,atualizar:E.up,papel:String(ev.relativo_a||'denunciado').toLowerCase().slice(0,40),obs:ev.observacao||'',dados:{...ev,faccoes_citadas:d.faccoes_citadas},locais});
    }
    m.textContent='Gravando…';
    const ddu={protocolo:d.protocolo,data_criacao:d.data_criacao,prioridade:d.prioridade,procura_se:d.procura_se,status:d.status,origem:d.origem,relato:d.relato,natureza_cod:d.natureza_principal.codigo,natureza_desc:d.natureza_principal.descricao,indexador_cod:d.natureza_indexador.codigo,indexador_desc:d.natureza_indexador.descricao,local_denuncia:d.enderecos[0]||null,encaminhamentos:d.encaminhamentos};
    const r=await apiInf('infDduImportar',{ddu,envolvidos:envs});
    const novos=r.resumo.filter(x=>x.criada).length, vinc=r.resumo.length-novos, nl=r.resumo.reduce((a,x)=>a+x.locais,0), pid=r.resumo[0].pessoa_id;
    infImpFechar(); await infCarregar(); infRender();
    infToast(`DDU ${d.protocolo} cadastrado: ${novos} novo(s), ${vinc} vinculado(s), ${nl} local(is)${nGeo?` · ${nGeoOk}/${nGeo} localizados no mapa`:''}.`);
    infFicha(pid,'ddu');
  }catch(e){ btn.disabled=false; m.innerHTML=`<span style="color:#a4202a">${esc(e.message)}</span>`; }
}

// -- aba DDU da ficha
function infFichaDdu(c,p){
  const ed=INF.podeEditar; const L=INF.cache.ddusDe.get(p.id)||[]; let ant=null;
  const cards=L.map((dd,i)=>{ const end=dd.local_denuncia; const mesmo=ant&&end&&infEndChave(end)!=='||'&&infEndChave(end)===infEndChave(ant.local_denuncia); const sim=ant?Math.round(100*infJac(ant.relato,dd.relato)):0;
    const r=`<div class="if-box" style="border-left:4px solid #a4202a"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="if-b" style="background:#a4202a">${i+1}ª denúncia</span><b style="font-family:monospace">${esc(dd.protocolo)}</b><span>${esc(infDataHora(dd.data_criacao)||'sem data')}</span><span class="if-chip">${esc(dd._link.papel||'denunciado')}</span>${dd.procura_se?'<span class="if-b" style="background:#000">PROCURA-SE</span>':''}
       ${ed?`<button class="btn perigo if-sm" data-un="${dd._link.id}" data-dd="${dd.id}" style="margin-left:auto">Desvincular</button>`:''}</div>
      <div style="font-size:12.5px;margin-top:4px">${esc(dd.natureza_desc||'—')}${dd.indexador_desc?' · '+esc(dd.indexador_desc):''} · ${esc(dd.status||'')} ${dd.origem?'· origem '+esc(dd.origem):''}</div>
      ${end&&(end.logradouro||end.bairro)?`<div style="font-size:12.5px">📍 ${esc(infEndTxt(end))}${end.bairro?' — '+esc(infTitulo(end.bairro)):''}${i>0?(mesmo?' <span class="if-chip">mesmo endereço da anterior</span>':' <span class="if-chip" style="background:#f6d9a8">endereço novo</span>'):''}</div>`:''}
      ${i>0&&sim>=50?`<div style="font-size:12px;color:#8a5a00">⚠️ Relato ${sim}% semelhante ao da denúncia anterior (possível repetição).</div>`:''}
      ${dd.relato?`<details style="margin-top:4px"><summary style="cursor:pointer;font-size:12px">Relato</summary><div style="white-space:pre-wrap;font-size:12.5px;margin-top:4px">${esc(dd.relato)}</div></details>`:''}
      ${dd._link.obs?`<details><summary style="cursor:pointer;font-size:12px">Observação sobre ${esc(p.nome)}</summary><div style="white-space:pre-wrap;font-size:12.5px">${esc(dd._link.obs)}</div></details>`:''}
      ${(dd.encaminhamentos||[]).length?`<div style="font-size:11.5px;color:#777;margin-top:3px">Encaminhamentos: ${esc(dd.encaminhamentos.map(x=>x.unidade+(x.status?' ('+x.status+')':'')).join('; '))}</div>`:''}
      <div style="font-size:11px;color:#999;margin-top:3px">Importado por ${esc(dd.criado_por||'?')}</div></div>`; ant=dd; return r; }).join('');
  const livres=INF.ddus.filter(x=>!L.some(y=>y.id===x.id));
  c.innerHTML=`${ed?`<div style="margin-bottom:10px"><button class="btn" id="ifdd-imp">📎 Importar DDU (PDF) para este indivíduo</button></div>`:''}
    ${L.length?`<p style="font-size:12.5px;margin:0 0 8px"><b>${L.length}</b> denúncia(s) vinculada(s). Os números abaixo seguem a ordem cronológica.</p>`:'<p style="color:#888;font-size:13px">Nenhum DDU vinculado a este indivíduo.</p>'}${cards}
    ${ed?`<div class="if-box" style="background:#fbfaf3"><h3>+ Vincular DDU já cadastrado</h3><div class="if-grid"><div class="if-g2"><label>Protocolo</label><input id="ifdd-p" list="ifdd-dl" placeholder="digite o número do DDU">${infDl('ifdd-dl',livres.map(x=>x.protocolo+' — '+(x.natureza_desc||'')))}</div>
      <div><label>Papel</label><select id="ifdd-papel"><option>denunciado</option><option>suspeito</option><option>citado</option></select></div></div>
      <div style="margin-top:8px"><button class="btn" id="ifdd-vinc">Vincular</button> <span id="ifdd-m" style="font-size:12px"></span></div></div>
     <div class="if-box" style="background:#fbfaf3"><h3>+ Registrar DDU manualmente (sem PDF)</h3><div class="if-grid"><div><label>Protocolo *</label><input id="ifdm-p"></div><div><label>Data</label><input type="date" id="ifdm-d"></div><div class="if-g2"><label>Natureza</label><input id="ifdm-n"></div><div style="grid-column:1/-1"><label>Relato</label><textarea id="ifdm-r" rows="3"></textarea></div></div>
      <div style="margin-top:8px"><button class="btn" id="ifdm-ok">Registrar e vincular</button> <span id="ifdm-m" style="font-size:12px"></span></div></div>`:''}`;
  if(!ed) return;
  document.getElementById('ifdd-imp').onclick=()=>infImportarDdu(p.id);
  c.querySelectorAll('[data-un]').forEach(b=>b.onclick=async()=>{ if(!confirm('Desvincular este DDU do indivíduo? (o DDU em si continua cadastrado)')) return;
    try{ await apiInf('infExcluir',{entidade:'ddu_pessoa',id:+b.dataset.un}); const dd=+b.dataset.dd; const resta=INF.ddupes.filter(l=>l.ddu_id===dd&&l.id!==+b.dataset.un).length;
      if(!resta && confirm('Esse DDU ficou sem nenhum vínculo. Excluir também o DDU? (os locais já cadastrados permanecem)')) await apiInf('infExcluir',{entidade:'ddu',id:dd});
      await infAposSalvar(p.id,'ddu'); }catch(e){ infToast(e.message,true); } });
  document.getElementById('ifdd-vinc').onclick=async()=>{ const m=document.getElementById('ifdd-m'); const t=document.getElementById('ifdd-p').value.split('—')[0].trim().replace(/\s+/g,''); const dd=INF.ddus.find(x=>x.protocolo===t);
    if(!dd){ m.innerHTML='<span style="color:#a4202a">DDU não encontrado. Para um novo, use o formulário abaixo ou importe o PDF.</span>'; return; }
    try{ await apiInf('infSalvar',{entidade:'ddu_pessoa',dados:{ddu_id:dd.id,pessoa_id:p.id,papel:document.getElementById('ifdd-papel').value}}); await infAposSalvar(p.id,'ddu'); infToast('DDU vinculado.'); }catch(e){ m.innerHTML=`<span style="color:#a4202a">${esc(e.message)}</span>`; } };
  document.getElementById('ifdm-ok').onclick=async()=>{ const m=document.getElementById('ifdm-m'); const g=k=>document.getElementById('ifdm-'+k).value;
    try{ const proto=g('p').replace(/\s+/g,''); if(!proto) throw new Error('Informe o número do DDU');
      let dd=INF.ddus.find(x=>x.protocolo===proto); if(!dd){ const r=await apiInf('infSalvar',{entidade:'ddu',dados:{protocolo:proto,data_criacao:g('d'),natureza_desc:g('n'),relato:g('r'),status:'Registro manual'}}); dd=r.registro; }
      await apiInf('infSalvar',{entidade:'ddu_pessoa',dados:{ddu_id:dd.id,pessoa_id:p.id,papel:'denunciado'}}); await infAposSalvar(p.id,'ddu'); infToast('DDU registrado e vinculado.'); }catch(e){ m.innerHTML=`<span style="color:#a4202a">${esc(e.message)}</span>`; } };
}

  catch(e){ box.innerHTML = `<p style="color:red">${esc(e.message)}</p>`; return; }
  const semDados = d.total === 0;
  const meses = Object.keys(d.porMes||{}).sort();
  box.innerHTML = `
    <div class="filtros">
      <div><label>De</label><input type="date" id="fd-inicio" value="${filtros.dataInicio||''}"></div>
      <div><label>Até</label><input type="date" id="fd-fim" value="${filtros.dataFim||''}"></div>

      <div><button class="btn dourado" id="fd-limpar">Limpar</button></div>
    </div>

    <div class="cards-resumo"><div class="card-resumo"><div class="num">${d.total}</div><div class="lbl">Total de lançamentos</div></div>
    ${d.indicadoresNumericos.map(ind=>`<div class="card-resumo"><div class="num">${ind.soma.toLocaleString('pt-BR')}</div><div class="lbl">${esc(ind.label)} (soma) · méd. ${ind.media.toFixed(1)}</div></div>`).join('')}</div>
    <div class="graficos">
      <div class="painel-box"><h3>Lançamentos por mês</h3>${semDados ? '<p style="color:#999;font-size:13px;padding:20px 0">Nenhum lançamento no período — o gráfico aparece assim que houver dados.</p>' : '<canvas id="graf-area-mes" height="140"></canvas>'}</div>
      ${d.indicadoresCategoricos.map(ind=>`<div class="painel-box"><h3>${esc(ind.label)}</h3><canvas id="graf-cat-${ind.id}" height="140"></canvas></div>`).join('')}
    </div>
    ${d.indicadoresNumericos.length ? `<h3 style="margin:22px 0 12px;font-size:15px">Gráfico por indicador (evolução ao longo do tempo)</h3>
    <div class="graficos">
      ${d.indicadoresNumericos.map(ind=>`<div class="painel-box"><h3>${esc(ind.label)}</h3>${ind.serie.length ? `<canvas id="graf-serie-${ind.id}" height="140"></canvas>` : '<p style="color:#999;font-size:13px;padding:10px 0">Sem lançamentos com este campo preenchido ainda.</p>'}</div>`).join('')}
    </div>` : ''}
    ${!semDados && !d.indicadoresCategoricos.length && !d.indicadoresNumericos.length ? '<p style="color:#999;font-size:13px">Dica: cadastre campos do tipo "Número" ou "Seleção" em Administração → Configurar Áreas para ter um gráfico por indicador, além da contagem de lançamentos.</p>' : ''}
  `;
  document.getElementById('fd-aplicar').addEventListener('click', ()=>{
    filtroAreaDash = {dataInicio: document.getElementById('fd-inicio').value || undefined, dataFim: document.getElementById('fd-fim').value || undefined};
    renderAreaDashboard(areaId, cfg, filtroAreaDash);
  });
  document.getElementById('fd-limpar').addEventListener('click', ()=>{ filtroAreaDash = {}; renderAreaDashboard(areaId, cfg, {}); });

  const cores = ['#8f7f45','#33502f','#2c4870','#7d2c2c','#5a2c7d','#b8a76a','#3a7d44'];
  if(!semDados){
    desenharGrafico('graf-area-mes', {
      type:'line',
      data:{ labels: meses, datasets:[{label:'Lançamentos', data: meses.map(m=>d.porMes[m]), borderColor:'#b8a76a', backgroundColor:'rgba(184,167,106,.2)', fill:true, tension:.3}] },
      options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{precision:0}}} }
    });
  }
  d.indicadoresCategoricos.forEach(ind=>{
    const labels = Object.keys(ind.contagem), valores = Object.values(ind.contagem);
    desenharGrafico('graf-cat-'+ind.id, { type:'doughnut', data:{ labels, datasets:[{data:valores, backgroundColor:cores}] }, options:{ plugins:{legend:{position:'bottom', labels:{boxWidth:12,font:{size:11}}}} } });
  });
  d.indicadoresNumericos.forEach((ind, i)=>{
    if(!ind.serie.length) return;
    desenharGrafico('graf-serie-'+ind.id, {
      type:'line',
      data:{ labels: ind.serie.map(p=>fmtData(p.x).split(' ')[0]), datasets:[{label: ind.label, data: ind.serie.map(p=>p.y), borderColor: cores[i%cores.length], backgroundColor: cores[i%cores.length]+'33', fill:true, tension:.3, pointRadius:4}] },
      options:{ plugins:{legend:{display:false}, tooltip:{callbacks:{title:(items)=>ind.serie[items[0].dataIndex].titulo}}}, scales:{y:{beginAtZero:true}} }
    });
  });
}

function campoInputHtml(campo, valor){
  const id = 'cc_'+campo.id;
  const v = valor===undefined||valor===null ? '' : valor;
  if(campo.tipo==='textarea') return `<textarea id="${id}" rows="3">${esc(v)}</textarea>`;
  if(campo.tipo==='numero') return `<input type="number" id="${id}" value="${esc(v)}">`;
  if(campo.tipo==='data') return `<input type="date" id="${id}" value="${esc(v)}">`;
  if(campo.tipo==='selecao') return `<select id="${id}">${(campo.opcoes||[]).map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  return `<input type="text" id="${id}" value="${esc(v)}">`;
}

let _anexoPendente = null; // {tipo, nome_original, base64, content_type} — só usado ao criar novo registro
function abrirFormRegistro(areaId, registro=null){
  _anexoPendente = null;
  const cfg = ST.areasConfig.find(a=>a.area_id===areaId);
  const campos = cfg?.campos || [];
  const dados = registro?.dados || {};
  abrirModal(`
    <button class="fechar" onclick="fecharModal()">×</button>
    <h3>${registro?'Editar':'Novo'} lançamento — ${esc(cfg?.nome||areaId)}</h3>
    ${!registro ? `
      <div class="zona-anexo-ia" id="zona-ia">
        <div id="zona-ia-texto">📎 Anexe foto, PDF ou planilha — foto e PDF a IA já lê e preenche o formulário automaticamente; planilha é só anexada</div>
        <input type="file" id="in-anexo-ia" accept="image/*,.pdf,.xls,.xlsx,.xlsm,.csv" style="margin-top:8px">
      </div>
      <div id="area-avisos-ia"></div>
    ` : ''}
    <label>Título</label><input type="text" id="rg-titulo" value="${esc(registro?.titulo||'')}">
    <label>Descrição</label><textarea id="rg-descricao" rows="3">${esc(registro?.descricao||'')}</textarea>
    ${campos.map(cp=>`<label>${esc(cp.label)}${cp.obrigatorio?' *':''}</label>${campoInputHtml(cp, dados[cp.id])}`).join('')}
    <div style="margin-top:18px;display:flex;gap:8px"><button class="btn" id="rg-salvar">Salvar</button><button class="btn secundario" onclick="fecharModal()">Cancelar</button></div>
    <div class="msg-modal" id="rg-msg"></div>
  `);

  const inAnexoIA = document.getElementById('in-anexo-ia');
  if(inAnexoIA) inAnexoIA.addEventListener('change', async ()=>{
    const f = inAnexoIA.files[0]; if(!f) return;
    const zona = document.getElementById('zona-ia'), txt = document.getElementById('zona-ia-texto');
    const nomeExt = (f.name.split('.').pop()||'').toLowerCase();
    const ehPlanilha = ['xls','xlsx','xlsm','csv'].includes(nomeExt) || f.type.includes('spreadsheet') || f.type.includes('ms-excel') || f.type==='text/csv';
    const tipo = ehPlanilha ? 'planilha' : (f.type.startsWith('image/') ? 'foto' : 'pdf');
    const reader = new FileReader();

    if(tipo === 'planilha'){
      reader.onload = ()=>{
        const base64 = reader.result.split(',')[1];
        _anexoPendente = { tipo, nome_original: f.name, base64, content_type: f.type };
        txt.textContent = '📎 ' + f.name + ' — planilha anexada (sem leitura automática por IA ainda)';
      };
      reader.readAsDataURL(f);
      return;
    }

    zona.classList.add('analisando'); txt.textContent = '🤖 Lendo o documento com IA…';
    reader.onload = async ()=>{
      const base64 = reader.result.split(',')[1];
      _anexoPendente = { tipo, nome_original: f.name, base64, content_type: f.type };
      try{
        const d = await api('analisarArquivo', {area_id: areaId, tipo, base64, content_type: f.type});
        const a = d.analise;
        if(a.titulo_sugerido) document.getElementById('rg-titulo').value = a.titulo_sugerido;
        if(a.resumo) document.getElementById('rg-descricao').value = a.resumo;
        for(const cp of campos){
          const val = a.campos?.[cp.id];
          const el = document.getElementById('cc_'+cp.id);
          if(val && el) el.value = val;
        }
        const avisos = document.getElementById('area-avisos-ia');
        avisos.innerHTML = a.possivel_duplicado
          ? `<div class="badge-dup">⚠️ <span>Possível duplicidade: ${esc(a.motivo_duplicado||'este documento parece semelhante a um lançamento já existente.')} Confira antes de salvar.</span></div>`
          : `<div class="badge-ok-ia">✅ Documento lido — campos preenchidos automaticamente. Confira e ajuste se precisar.</div>`;
        txt.textContent = '📎 ' + f.name + ' — analisado';
      }catch(e){
        txt.textContent = '⚠️ Não foi possível ler o documento agora (' + e.message + '). O arquivo ainda será anexado ao salvar.';
      }
      zona.classList.remove('analisando');
    };
    reader.readAsDataURL(f);
  });

  document.getElementById('rg-salvar').addEventListener('click', async ()=>{
    const titulo = document.getElementById('rg-titulo').value.trim();
    const msg = document.getElementById('rg-msg');
    if(!titulo){ msg.className='msg-modal erro'; msg.textContent='Título obrigatório'; return; }
    const dadosNovos = {};
    for(const cp of campos){
      const el = document.getElementById('cc_'+cp.id);
      const val = el ? el.value : '';
      if(cp.obrigatorio && !val){ msg.className='msg-modal erro'; msg.textContent=`Campo "${cp.label}" é obrigatório`; return; }
      dadosNovos[cp.id] = val;
    }
    try{
      if(registro){
        await api('atualizarRegistro', {id:registro.id, titulo, descricao:document.getElementById('rg-descricao').value, dados:dadosNovos});
      } else {
        const novo = await api('criarRegistro', {area_id:areaId, titulo, descricao:document.getElementById('rg-descricao').value, dados:dadosNovos});
        if(_anexoPendente){
          await api('uploadAnexo', {registro_id: novo.registro.id, ..._anexoPendente, pular_analise:true, dados_extraidos: dadosNovos});
        }
      }
      fecharModal(); renderArea(areaId);
    }catch(e){ msg.className='msg-modal erro'; msg.textContent=e.message; }
  });
}

    ${acesso==='edit' ? `
      <div style="margin-top:12px"><label>Adicionar anexo (foto, PDF ou planilha)</label><input type="file" id="in-anexo" accept="image/*,.pdf,.xls,.xlsx,.xlsm,.csv"></div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn" onclick="abrirFormRegistro('${areaId}', ${JSON.stringify(reg).replace(/"/g,'&quot;')})">Editar</button>
        <button class="btn perigo" onclick="excluirRegistroConfirma(${id}, '${areaId}')">Excluir</button>
      </div>` : ''}
    <div class="msg-modal" id="anexo-msg"></div>
  `);
  const inAnexo = document.getElementById('in-anexo');
  if(inAnexo) inAnexo.addEventListener('change', async ()=>{
    const f = inAnexo.files[0]; if(!f) return;
    const msg = document.getElementById('anexo-msg');
    msg.className='msg-modal'; msg.textContent='Enviando...';
    const tipo = f.type.startsWith('image/') ? 'foto' : (f.type==='application/pdf' ? 'pdf' : 'planilha');
    const reader = new FileReader();
    reader.onload = async ()=>{
      const base64 = reader.result.split(',')[1];
      try{
        await api('uploadAnexo', {registro_id:id, tipo, nome_original:f.name, base64, content_type:f.type});
        msg.className='msg-modal ok'; msg.textContent='Anexo enviado!';
        abrirRegistro(id);
      }catch(e){ msg.className='msg-modal erro'; msg.textContent=e.message; }
    };
    reader.readAsDataURL(f);
  });
}

async function baixarAnexo(anexoId){
  try{ const d = await api('urlAnexo', {anexo_id:anexoId}); window.open(d.url, '_blank'); }
  catch(e){ alert(e.message); }
}
async function excluirAnexo(anexoId, registroId){
  if(!confirm('Excluir este anexo?')) return;
  try{ await api('excluirAnexo', {anexo_id:anexoId}); abrirRegistro(registroId); }catch(e){ alert(e.message); }
}
async function excluirRegistroConfirma(id, areaId){
  if(!confirm('Excluir este registro? Esta ação não pode ser desfeita.')) return;
  try{ await api('excluirRegistro', {id}); fecharModal(); renderArea(areaId); }catch(e){ alert(e.message); }
}

// ---------- ADMINISTRAÇÃO ----------
let abaAdmin = 'usuarios';
async function renderAdmin(){
  const c = document.getElementById('conteudo');
  c.innerHTML = `
    <div class="topo-view"><h2>⚙️ Administração</h2></div>
    <div class="tabs-admin">
      <div class="tab-admin" data-tab="usuarios">Usuários</div>
      <div class="tab-admin" data-tab="niveis">Níveis de Acesso</div>
      <div class="tab-admin" data-tab="areas">Configurar Áreas</div>
    </div>
    <div id="admin-corpo"></div>
  `;
  document.querySelectorAll('.tab-admin').forEach(el=>el.addEventListener('click', ()=>{ abaAdmin=el.dataset.tab; renderAdmin(); }));
  document.querySelector(`.tab-admin[data-tab="${abaAdmin}"]`).classList.add('ativo');
  if(abaAdmin==='usuarios') renderAdminUsuarios();
  if(abaAdmin==='niveis') renderAdminNiveis();
  if(abaAdmin==='areas') renderAdminAreas();
}

function gradeAcessosHtml(acessosAtuais={}){
  return `<div class="grade-acessos">${AREAS.map(a=>`<div><span>${a}</span><select class="ga-${a}">
    <option value="none" ${(!acessosAtuais[a]||acessosAtuais[a]==='none')?'selected':''}>Sem acesso</option>
    <option value="view" ${acessosAtuais[a]==='view'?'selected':''}>Ver</option>
    <option value="edit" ${acessosAtuais[a]==='edit'?'selected':''}>Lançar</option>
  </select></div>`).join('')}</div>`;
}
function lerGradeAcessos(container){
  const acessos = {};
  AREAS.forEach(a=>{ acessos[a] = container.querySelector('.ga-'+a).value; });
  return acessos;
}

async function renderAdminUsuarios(){
  const box = document.getElementById('admin-corpo');
  box.innerHTML = '<div class="carregando">Carregando…</div>';
  const d = await api('listarUsuarios');
  box.innerHTML = `
    <div style="margin-bottom:12px"><button class="btn" id="btn-novo-usuario">+ Novo usuário</button></div>
    <table><thead><tr><th>Nome</th><th>Usuário</th><th>Nível</th><th>Status</th><th></th></tr></thead>
    <tbody>${d.usuarios.map(u=>`<tr>
      <td>${esc(u.nome)}</td><td>${esc(u.usuario)}</td><td>${u.nivel_base}</td>
      <td><span class="badge-status ${u.bloqueado?'bloqueado':(u.ativo?'ativo':'inativo')}">${u.bloqueado?'Bloqueado':(u.ativo?'Ativo':'Inativo')}</span></td>
      <td class="acoes-lista">
        <button onclick='abrirEdicaoUsuario(${JSON.stringify(u)})'>Editar</button>
        <button onclick="resetarSenhaUsuario('${u.id}','${esc(u.nome)}')">Senha</button>
        ${u.bloqueado?`<button onclick="desbloquearUsuario('${u.id}')">Desbloquear</button>`:''}
      </td></tr>`).join('')}</tbody></table>
  `;
  document.getElementById('btn-novo-usuario').addEventListener('click', ()=>abrirEdicaoUsuario(null));
}

function abrirEdicaoUsuario(u){
  abrirModal(`
    <button class="fechar" onclick="fecharModal()">×</button>
    <h3>${u?'Editar':'Novo'} usuário</h3>
    <label>Nome completo</label><input type="text" id="us-nome" value="${u?esc(u.nome):''}">
    <label>Usuário (login)</label><input type="text" id="us-login" value="${u?esc(u.usuario):''}" ${u?'disabled':''}>
    ${!u?`<label>Senha inicial</label><input type="password" id="us-senha" placeholder="mínimo 6 caracteres">`:''}
    <label>Nível base</label>
    <select id="us-nivel">${NIVEIS.map(n=>`<option value="${n}" ${u&&u.nivel_base===n?'selected':''}>${n}</option>`).join('')}</select>
    <label>Acesso detalhado por área</label>
    ${gradeAcessosHtml(u?u.acessos:{})}
    ${u?`<label style="margin-top:14px"><input type="checkbox" id="us-ativo" ${u.ativo?'checked':''} style="width:auto;margin-right:6px">Usuário ativo</label>`:''}
    <div style="margin-top:18px;display:flex;gap:8px"><button class="btn" id="us-salvar">Salvar</button><button class="btn secundario" onclick="fecharModal()">Cancelar</button></div>
    <div class="msg-modal" id="us-msg"></div>
  `);
  document.getElementById('us-nivel').addEventListener('change', async (e)=>{
    // ao trocar nível, sugere os acessos padrão daquele nível
    const d = await api('listarNiveis');
    const nc = d.niveis.find(n=>n.nivel===e.target.value);
    if(nc){
      AREAS.forEach(a=>{ document.querySelector('.ga-'+a).value = (nc.acessos_default||{})[a] || 'none'; });
    }
  });
  document.getElementById('us-salvar').addEventListener('click', async ()=>{
    const msg = document.getElementById('us-msg');
    const nome = document.getElementById('us-nome').value.trim();
    const nivel_base = document.getElementById('us-nivel').value;
    const acessos = lerGradeAcessos(document);
    try{
      if(u){
        await api('atualizarUsuario', {id:u.id, nome, nivel_base, acessos, ativo: document.getElementById('us-ativo').checked});
      } else {
        const login = document.getElementById('us-login').value.trim();
        const senha = document.getElementById('us-senha').value;
        await api('criarUsuario', {nome, usuario:login, senha, nivel_base, acessos});
      }
      fecharModal(); renderAdminUsuarios();
    }catch(e){ msg.className='msg-modal erro'; msg.textContent=e.message; }
  });
}

function resetarSenhaUsuario(id, nome){
  abrirModal(`
    <button class="fechar" onclick="fecharModal()">×</button>
    <h3>Redefinir senha — ${esc(nome)}</h3>
    <label>Nova senha</label><input type="password" id="rs-senha" placeholder="mínimo 6 caracteres">
    <div style="margin-top:18px"><button class="btn" id="rs-salvar">Salvar nova senha</button></div>
    <div class="msg-modal" id="rs-msg"></div>
  `);
  document.getElementById('rs-salvar').addEventListener('click', async ()=>{
    const msg = document.getElementById('rs-msg');
    try{ await api('resetarSenha', {id, novaSenha:document.getElementById('rs-senha').value}); msg.className='msg-modal ok'; msg.textContent='Senha atualizada!'; }
    catch(e){ msg.className='msg-modal erro'; msg.textContent=e.message; }
  });
}
async function desbloquearUsuario(id){
  try{ await api('desbloquearUsuario', {id}); renderAdminUsuarios(); }catch(e){ alert(e.message); }
}

async function renderAdminNiveis(){
  const box = document.getElementById('admin-corpo');
  box.innerHTML = '<div class="carregando">Carregando…</div>';
  const d = await api('listarNiveis');
  box.innerHTML = d.niveis.map(n=>`
    <div class="painel-box" style="margin-bottom:12px">
      <h3>${n.nivel}${n.nivel==='MASTER'?' 🔑':''}</h3>
      <label>Descrição</label><input type="text" class="nv-desc" value="${esc(n.descricao||'')}" ${n.nivel==='MASTER'?'disabled':''}>
      <label>Acesso padrão por área (aplicado a novos usuários deste nível)</label>
      ${gradeAcessosHtml(n.acessos_default||{})}
      <label style="margin-top:10px"><input type="checkbox" class="nv-painel" ${n.ve_painel_geral?'checked':''} style="width:auto;margin-right:6px" ${n.nivel==='MASTER'?'disabled':''}>Vê o Painel Central consolidado (todas as áreas)</label>
      <div style="margin-top:10px"><button class="btn secundario" onclick="salvarNivel(this, '${n.nivel}')">Salvar ${n.nivel}</button></div>
      <div class="msg-modal" id="nv-msg-${n.nivel}"></div>
    </div>
  `).join('');
}
async function salvarNivel(btn, nivel){
  const box = btn.closest('.painel-box');
  const descricao = box.querySelector('.nv-desc').value;
  const acessos_default = lerGradeAcessos(box);
  const ve_painel_geral = box.querySelector('.nv-painel').checked;
  const msg = document.getElementById('nv-msg-'+nivel);
  try{ await api('salvarNivel', {nivel, descricao, acessos_default, ve_admin: nivel==='MASTER', ve_painel_geral}); msg.className='msg-modal ok'; msg.textContent='Salvo!'; }
  catch(e){ msg.className='msg-modal erro'; msg.textContent=e.message; }
}

async function renderAdminAreas(){
  const box = document.getElementById('admin-corpo');
  box.innerHTML = '<div class="carregando">Carregando…</div>';
  const d = await api('areasConfig');
  box.innerHTML = d.areas.map(a=>`
    <div class="painel-box" style="margin-bottom:12px">
      <div class="linha-campos">
        <div><label>Nome de exibição</label><input type="text" class="ar-nome-${a.area_id}" value="${esc(a.nome)}"></div>
        <div><label>Ícone (emoji)</label><input type="text" class="ar-icone-${a.area_id}" value="${esc(a.icone||'📁')}"></div>
      </div>
      <label>Descrição</label><input type="text" class="ar-desc-${a.area_id}" value="${esc(a.descricao||'')}">
      <label style="margin-top:10px">Campos personalizados do formulário de lançamento</label>
      <div id="campos-${a.area_id}">${(a.campos||[]).map((cp,i)=>`
        <div class="campo-custom-linha"><span>${esc(cp.label)} — ${TIPOS_CAMPO.find(t=>t[0]===cp.tipo)?.[1]||cp.tipo}${cp.obrigatorio?' (obrigatório)':''}</span>
        <button onclick="removerCampo('${a.area_id}', ${i})" style="border:none;background:none;color:#a4202a;cursor:pointer">🗑️</button></div>
      `).join('') || '<div style="color:#999;font-size:13px;margin-bottom:8px">Nenhum campo personalizado ainda</div>'}</div>
      <div class="linha-campos" style="margin-top:10px">
        <div><label>Novo campo — nome</label><input type="text" id="novo-lbl-${a.area_id}"></div>
        <div><label>Tipo</label><select id="novo-tipo-${a.area_id}">${TIPOS_CAMPO.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join('')}</select></div>
      </div>
      <label style="margin-top:6px"><input type="checkbox" id="novo-obr-${a.area_id}" style="width:auto;margin-right:6px">Obrigatório</label>
      <div style="margin-top:8px"><button class="btn secundario" onclick="adicionarCampo('${a.area_id}')">+ Adicionar campo</button></div>
      <div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="salvarAreaConfig('${a.area_id}')">Salvar ${a.area_id}</button></div>
      <div class="msg-modal" id="ar-msg-${a.area_id}"></div>
    </div>
  `).join('');
  window._areasEmEdicao = {}; d.areas.forEach(a=> window._areasEmEdicao[a.area_id] = JSON.parse(JSON.stringify(a.campos||[])));
}
function adicionarCampo(areaId){
  const label = document.getElementById('novo-lbl-'+areaId).value.trim();
  if(!label) return;
  const tipo = document.getElementById('novo-tipo-'+areaId).value;
  const obrigatorio = document.getElementById('novo-obr-'+areaId).checked;
  window._areasEmEdicao[areaId].push({id: 'c'+Date.now(), label, tipo, obrigatorio});
  renderAdminAreas();
}
function removerCampo(areaId, idx){
  window._areasEmEdicao[areaId].splice(idx,1);
  renderAdminAreas();
}
async function salvarAreaConfig(areaId){
  const nome = document.querySelector('.ar-nome-'+areaId).value.trim();
  const icone = document.querySelector('.ar-icone-'+areaId).value.trim() || '📁';
  const descricao = document.querySelector('.ar-desc-'+areaId).value;
  const campos = window._areasEmEdicao[areaId];
  const msg = document.getElementById('ar-msg-'+areaId);
  try{
    await api('salvarAreaConfig', {area_id:areaId, nome, descricao, icone, campos});
    const areasCfg = await api('areasConfig'); ST.areasConfig = areasCfg.areas; montarMenu();
    msg.className='msg-modal ok'; msg.textContent='Salvo!';
  }catch(e){ msg.className='msg-modal erro'; msg.textContent=e.message; }
}

// ---------- BOOT ----------
(async ()=>{
  const ok = await tentarSessaoExistente();
  if(!ok){ document.getElementById('tela-login').style.display='flex'; }
})();
</script>
