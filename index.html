<style>
:root{
  --preto:#161513; --khaki:#b8a76a; --khaki-esc:#8f7f45; --bege:#f0ede2;
  --vermelho:#a4202a; --dourado:#e0b84a; --verde:#33502f;
  --ok:#3a7d44; --erro:#a4202a; --texto:#2c2a24;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bege);color:var(--texto)}
img.logo{display:block}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid #ccc4a8;border-radius:6px;width:100%;background:#fff}
label{font-size:12px;font-weight:600;color:#555;display:block;margin:10px 0 4px}
.btn{background:var(--verde);color:#fff;border:none;padding:9px 16px;border-radius:6px;font-weight:600;font-size:14px}
.btn:hover{background:#28401f}
.btn.secundario{background:#8a8368;color:#fff}
.btn.perigo{background:var(--erro);color:#fff}
.btn.dourado{background:var(--dourado);color:#3a2c00}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* LOGIN */
#tela-login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#161513,#2b2820 60%,#3a3222)}
.card-login{background:#fff;border-radius:14px;padding:36px 34px;width:360px;box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center}
.card-login img{width:110px;margin:0 auto 14px}
.card-login h1{font-size:17px;margin:0 0 2px;color:var(--preto)}
.card-login p{font-size:12px;color:#777;margin:0 0 20px}
#erro-login{color:var(--erro);font-size:13px;margin-top:10px;min-height:16px}

/* SHELL */
#app{display:none;min-height:100vh}
#shell{display:flex;min-height:100vh}
#sidebar{width:230px;background:var(--preto);color:var(--bege);flex-shrink:0;display:flex;flex-direction:column}
#sidebar .cab{padding:20px 16px;text-align:center;border-bottom:1px solid #3a382f}
#sidebar .cab img{width:64px;margin:0 auto 8px}
#sidebar .cab div{font-size:11px;line-height:1.3;color:var(--khaki)}
#menu{flex:1;padding:10px 0;overflow-y:auto}
.item-menu{display:flex;align-items:center;gap:10px;padding:11px 18px;color:var(--bege);font-size:14px;cursor:pointer;border-left:3px solid transparent}
.item-menu:hover{background:#232019}
.item-menu.ativo{background:#232019;border-left-color:var(--dourado);color:var(--dourado);font-weight:600}
.grupo-menu{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#7d765f;padding:14px 18px 4px}
#rodape-sidebar{padding:14px 16px;border-top:1px solid #3a382f;font-size:12px}
#rodape-sidebar .nome{color:var(--khaki);font-weight:600;margin-bottom:2px}
#rodape-sidebar .nivel{color:#8a8368;font-size:11px;margin-bottom:8px}
#sair{background:none;border:1px solid #5a5540;color:var(--bege);padding:6px 10px;border-radius:6px;font-size:12px;width:100%}
#sair:hover{background:#2a271f}

#conteudo{flex:1;padding:26px 32px;overflow-y:auto;max-height:100vh}
.topo-view{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.topo-view h2{margin:0;font-size:21px;color:var(--preto)}
.topo-view .sub{font-size:12px;color:#888;margin-top:2px}

/* DASHBOARD */
.cards-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:22px}
.card-resumo{background:#fff;border-radius:10px;padding:16px 18px;border-left:4px solid var(--khaki);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-resumo .num{font-size:26px;font-weight:700;color:var(--preto)}
.card-resumo .lbl{font-size:12px;color:#888;margin-top:2px}
.graficos{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:22px}
@media(max-width:900px){.graficos{grid-template-columns:1fr}}
.painel-box{background:#fff;border-radius:10px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.painel-box h3{margin:0 0 12px;font-size:14px;color:var(--preto)}
.filtros{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:16px;background:#fff;padding:14px 16px;border-radius:10px}
.filtros div{min-width:140px}
.filtros label{margin:0 0 3px}

table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
table th{background:#f4f1e6;text-align:left;padding:10px 12px;font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.3px}
table td{padding:10px 12px;font-size:13px;border-top:1px solid #eee}
table tr:hover td{background:#faf9f4}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.tag.P1{background:#e8e1c8;color:#6b5d1f}
.tag.P2{background:#dbe6d6;color:#33502f}
.tag.P3{background:#dde3ec;color:#2c4870}
.tag.P4{background:#ecdcdc;color:#7d2c2c}
.tag.P5{background:#e6dbec;color:#5a2c7d}

/* AREA */
.acoes-lista{display:flex;gap:8px}
.acoes-lista button{padding:5px 10px;font-size:12px;border-radius:5px;border:1px solid #ccc;background:#fff}
.acoes-lista button:hover{background:#f2f2f2}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(20,18,12,.55);z-index:50;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.overlay.aberto{display:flex}
.modal{background:#fff;border-radius:12px;padding:26px 28px;width:520px;max-width:100%}
.modal h3{margin:0 0 4px}
.modal .fechar{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:#999}
.linha-campos{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.anexos-lista{margin-top:8px}
.anexo-item{display:flex;justify-content:space-between;align-items:center;background:#f6f4ec;padding:7px 10px;border-radius:6px;margin-bottom:6px;font-size:13px}
.msg-modal{font-size:13px;margin-top:10px;min-height:16px}
.msg-modal.ok{color:var(--ok)}
.msg-modal.erro{color:var(--erro)}

/* ADMIN */
.tabs-admin{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid #ddd}
.tab-admin{padding:9px 16px;font-size:13px;cursor:pointer;color:#777;border-bottom:2px solid transparent}
.tab-admin.ativo{color:var(--preto);font-weight:600;border-bottom-color:var(--dourado)}
.select-acesso{padding:5px 8px;font-size:12px;border-radius:5px}
.grade-acessos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.grade-acessos div span{display:block;font-size:11px;font-weight:600;margin-bottom:3px;color:#666}
.campo-custom-linha{display:flex;gap:8px;align-items:center;background:#f6f4ec;padding:8px 10px;border-radius:6px;margin-bottom:6px}
.campo-custom-linha span{flex:1;font-size:13px}
.badge-status{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-status.ativo{background:#dbeedb;color:var(--ok)}
.badge-status.inativo{background:#eee;color:#888}
.badge-status.bloqueado{background:#f7dada;color:var(--erro)}
.carregando{text-align:center;color:#999;padding:30px;font-size:13px}
.tabs-area{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid #ddd}
.tab-area{padding:9px 16px;font-size:13px;cursor:pointer;color:#777;border-bottom:2px solid transparent}
.tab-area.ativo{color:var(--preto);font-weight:600;border-bottom-color:var(--dourado)}
.box-ia{background:linear-gradient(135deg,#2c2a24,#3a3222);color:#f0ede2;border-radius:10px;padding:18px 20px;margin-bottom:18px}
.box-ia h3{margin:0 0 10px;font-size:13px;color:var(--dourado);display:flex;align-items:center;gap:6px}

<script>
const EDGE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co/functions/v1/bi4cia-api";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const NIVEIS = ["MASTER","P1","P2","P3","P4","P5","TROPA","VISITANTE"];
const AREAS = ["P1","P2","P3","P4","P5"];
const TIPOS_CAMPO = [["texto","Texto curto"],["textarea","Texto longo"],["numero","Número"],["data","Data"],["selecao","Seleção (opções)"]];

let ST = { token:null, usuario:null, nivelConfig:null, areasConfig:[], view:null, areaAtual:null, charts:{} };

function salvarSessaoLocal(){ localStorage.setItem('bi4cia_sessao', JSON.stringify({token:ST.token, exp:Date.now()+8*3600*1000})); }
function carregarSessaoLocal(){ try{ const s=JSON.parse(localStorage.getItem('bi4cia_sessao')||'null'); if(s && s.exp>Date.now()) return s.token; }catch(e){} return null; }

async function api(op, params={}){
  const r = await fetch(EDGE_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':ANON_KEY,'Authorization':'Bearer '+ANON_KEY},
    body: JSON.stringify({op, token: ST.token, ...params})
  });
  const d = await r.json();
  if(!d.ok){ throw new Error(d.erro || 'Erro desconhecido'); }
  return d;
}

function esc(s){ return (s===null||s===undefined) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtData(iso){ if(!iso) return ''; const d=new Date(iso); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function desenharGrafico(elId, config){
  const el = document.getElementById(elId);
  if(!el){ return; }
  if(typeof Chart === 'undefined'){
    el.outerHTML = '<p style="color:#a4202a;font-size:12px;padding:12px;background:#f7dada;border-radius:6px">⚠️ A biblioteca de gráficos não carregou (Chart.js). Isso costuma acontecer quando a rede bloqueia o endereço cdnjs.cloudflare.com. Peça ao setor de TI/rede pra liberar esse domínio, ou tente acessar de outra rede/celular pra confirmar.</p>';
    return;
  }
  try{ return new Chart(el, config); }
  catch(e){ el.outerHTML = `<p style="color:#a4202a;font-size:12px;padding:12px;background:#f7dada;border-radius:6px">⚠️ Erro ao desenhar o gráfico: ${esc(e.message)}</p>`; }
}
function fecharModal(){ document.getElementById('overlay').classList.remove('aberto'); document.getElementById('modal-corpo').innerHTML=''; }
function abrirModal(html){ document.getElementById('modal-corpo').innerHTML = html; document.getElementById('overlay').classList.add('aberto'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') fecharModal(); });

// ---------- LOGIN ----------
document.getElementById('form-login').addEventListener('submit', async e=>{
  e.preventDefault();
  const usuario = document.getElementById('li-usuario').value.trim();
  const senha = document.getElementById('li-senha').value;
  const elErro = document.getElementById('erro-login');
  elErro.textContent = '';
  try{
    const d = await api('login', {usuario, senha});
    ST.token = d.token; ST.usuario = d.usuario; ST.nivelConfig = d.nivelConfig;
    salvarSessaoLocal();
    await iniciarApp();
  }catch(err){ elErro.textContent = err.message; }
});

document.getElementById('sair').addEventListener('click', async ()=>{
  try{ await api('logout'); }catch(e){}
  localStorage.removeItem('bi4cia_sessao');
  location.reload();
});

async function tentarSessaoExistente(){
  const t = carregarSessaoLocal();
  if(!t) return false;
  ST.token = t;
  try{
    const d = await api('me');
    ST.usuario = d.usuario; ST.nivelConfig = d.nivelConfig;
    await iniciarApp();
    return true;
  }catch(e){ localStorage.removeItem('bi4cia_sessao'); return false; }
}

// ---------- APP SHELL ----------
async function iniciarApp(){
  document.getElementById('tela-login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('rs-nome').textContent = ST.usuario.nome;
  document.getElementById('rs-nivel').textContent = ST.usuario.nivel_base;
  const areasCfg = await api('areasConfig');
  ST.areasConfig = areasCfg.areas;
  montarMenu();
  const primeiraArea = AREAS.find(a=>acessoDe(a)!=='none');
  const primeiraView = ST.usuario.nivel_base==='MASTER' || ST.nivelConfig?.ve_painel_geral ? 'dashboard' : (primeiraArea ? 'area:'+primeiraArea : null);
  if(primeiraView) irPara(primeiraView); else document.getElementById('conteudo').innerHTML = '<p style="padding:30px;color:#888">Você não tem acesso a nenhuma área ainda. Procure a Administração.</p>';
}

function acessoDe(areaId){
  if(ST.usuario.nivel_base==='MASTER') return 'edit';
  return (ST.usuario.acessos||{})[areaId] || 'none';
}
function podeVerPainelGeral(){ return ST.usuario.nivel_base==='MASTER' || !!ST.nivelConfig?.ve_painel_geral; }
function isMaster(){ return ST.usuario.nivel_base==='MASTER'; }

function montarMenu(){
  let html = '';
  if(podeVerPainelGeral()){
    html += `<div class="item-menu" data-view="dashboard">📊 Painel Central</div>`;
  }
  html += `<div class="grupo-menu">Áreas</div>`;
  AREAS.forEach(a=>{
    if(acessoDe(a)==='none') return;
    const cfg = ST.areasConfig.find(c=>c.area_id===a);
    html += `<div class="item-menu" data-view="area:${a}">${cfg?.icone||'📁'} ${esc(cfg?.nome||a)}</div>`;
  });
  if(isMaster()){
    html += `<div class="grupo-menu">Sistema</div><div class="item-menu" data-view="admin">⚙️ Administração</div>`;
  }
  document.getElementById('menu').innerHTML = html;
  document.querySelectorAll('.item-menu').forEach(el=>el.addEventListener('click', ()=>irPara(el.dataset.view)));
}

function marcarMenuAtivo(view){
  document.querySelectorAll('.item-menu').forEach(el=> el.classList.toggle('ativo', el.dataset.view===view));
}

async function irPara(view){
  ST.view = view; marcarMenuAtivo(view);
  const c = document.getElementById('conteudo');
  c.innerHTML = '<div class="carregando">Carregando…</div>';
  if(view==='dashboard') return renderDashboard();
  if(view.startsWith('area:')) return renderArea(view.split(':')[1]);
  if(view==='admin') return renderAdmin();
}

// ---------- DASHBOARD ----------
async function renderDashboard(filtros={}){
  const c = document.getElementById('conteudo');
  let d;
  try{ d = await api('dashboard', filtros); }
  catch(e){ c.innerHTML = `<p style="color:red">${esc(e.message)}</p>`; return; }

  if(d.semAcesso){ c.innerHTML = '<p style="padding:20px;color:#888">Sem áreas liberadas para visualização.</p>'; return; }

  const nomeArea = id => ST.areasConfig.find(a=>a.area_id===id)?.nome || id;
  const meses = Object.keys(d.porMes).sort();
  const areasOrdenadas = AREAS.filter(a=>d.areasIncluidas.includes(a));
  const semDados = d.total === 0;

  c.innerHTML = `
    <div class="topo-view"><div><h2>Painel Central</h2><div class="sub">Visão consolidada — ${d.areasIncluidas.join(', ')}</div></div></div>
    ${d.insight ? `<div class="box-ia"><h3>🤖 Análise da IA</h3><div class="txt">${esc(d.insight.texto)}</div><div class="quando">Gerado em ${fmtData(d.insight.gerado_em)}</div></div>` : ''}
    <div class="filtros">
      <div><label>Data início</label><input type="date" id="f-inicio"></div>
      <div><label>Data fim</label><input type="date" id="f-fim"></div>
      <div><button class="btn secundario" id="f-aplicar">Filtrar</button></div>
      <div><button class="btn dourado" id="f-limpar">Limpar</button></div>
    </div>
    <div class="cards-resumo">
      <div class="card-resumo"><div class="num">${d.total}</div><div class="lbl">Registros no período</div></div>
      ${areasOrdenadas.map(a=>`<div class="card-resumo"><div class="num">${d.porArea[a]||0}</div><div class="lbl">${esc(nomeArea(a))}</div></div>`).join('')}
    </div>
    <div class="graficos">
      <div class="painel-box"><h3>Lançamentos por mês</h3>${semDados ? '<p style="color:#999;font-size:13px;padding:20px 0">Nenhum lançamento ainda — o gráfico aparece assim que a primeira área lançar dados.</p>' : '<canvas id="graf-mes" height="140"></canvas>'}</div>
      <div class="painel-box"><h3>Distribuição por área</h3>${semDados ? '<p style="color:#999;font-size:13px;padding:20px 0">Sem lançamentos no período selecionado.</p>' : '<canvas id="graf-area" height="140"></canvas>'}</div>
    </div>
    <div class="painel-box">

// dias[i] = {data:'YYYY-MM-DD', blocos:[], texto, editando, editado}; p2['YYYY-MM'] = {horario, dias:{'3':[{nome,patente}]}}
let ESC = { dias:[], p2:{}, pendentes:[], avisos:[], acesso:'view' };

function escHoras(turno){
  const m = String(turno||'').match(/\d{1,2}:\d{2}(?::\d{2})?/g) || [];
  const t = m.map(x=>{ const p=x.split(':').map(Number); return {h:p[0], m:p[1], s:p[2]||0}; });
  if(!t.length) return null;
  const ini = (/^\s*\(/.test(String(turno)) && t.length>=3) ? t[1] : t[0];
  const fim = t[t.length-1];
  return {ini, fim};
}
function escFmt(t, arred){
  let h=t.h, m=t.m;
  if(arred && t.s>=59){ m+=1; if(m>=60){ m=0; h=(h+1)%24; } }
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function escTitulo(escala){
  const m = String(escala||'').match(/\(([^()]*)\)\s*$/);
  let t = m ? m[1] : String(escala||'').split(' - ')[0];
  t = t.replace(/^\s*4\s*[ªa]?\s*CIA PM IND (GER|PE)\s*-\s*/i, '').trim();
  return t.toUpperCase();
}
function escFuncao(f){
  const s = String(f||'').trim();
  if(!s) return '';
  if(/intendente/i.test(s)) return '';
  if(/cmt?e?\s*guarni/i.test(s)) return 'Cmt Guarn.';
  if(/cmt?e?\s*pelot/i.test(s)) return 'Cmt Pelotão';
  if(/condutor/i.test(s)) return 'Condutor';
  if(/patrulheiro/i.test(s)) return 'Patrulheiro';
  return s;
}
function escOrdemFuncao(f){
  const s = String(f||'');
  if(/cmt?e?\s*(pelot|guarni)/i.test(s)) return 0;
  if(/patrulheiro/i.test(s)) return 1;
  if(/condutor/i.test(s)) return 2;
  return 3;
}
function escBase(m){
  const ng = (m.nome_guerra||'').trim();
  if(ng) return ng.toUpperCase();
  const partes = String(m.nome_completo||'').trim().split(/\s+/).filter(Boolean);
  return (partes[partes.length-1]||'').toUpperCase();
}
// Equipes sem viatura que repetem exatamente os mesmos militares de uma equipe COM viatura (horário de apresentação) são descartadas
function escPrepararBlocos(blocos){
  const chave = eq => eq.militares.map(m=>m.matricula).filter(Boolean).sort().join(',');
  const comRec = new Set();
  blocos.forEach(b=>b.equipes.forEach(eq=>{ if(String(eq.recurso||'').trim()) comRec.add(chave(eq)); }));
  const out = [];
  blocos.forEach(b=>{
    const eqs = b.equipes.filter(eq=>{
      if(!eq.militares.length) return false;
      if(String(eq.recurso||'').trim()) return true;
      return !comRec.has(chave(eq));
    });
    if(eqs.length) out.push({...b, equipes:eqs});
  });
  return out;
}
function escP2Do(data){
  const m = String(data||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  const p2 = ESC.p2[m[1]+'-'+m[2]];
  if(!p2) return null;
  return { horario: p2.horario || '14:00 às 00:00', lista: (p2.dias && p2.dias[String(parseInt(m[3],10))]) || [] };
}
// Administração / ADM ROCCA (e variações) nunca entram no resumo
function escEhAdm(txt){
  const t = String(txt||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
  return /\bADM\b|ADMINISTRA/.test(t);
}
function escBlocosUteis(dia){
  return ((dia && dia.blocos) || [])
    .filter(b=>!escEhAdm(escTitulo(b.escala)) && !escEhAdm(String(b.escala||'').split(' - ')[0]))
    .map(b=>({...b, equipes:(b.equipes||[]).filter(eq=>!escEhAdm(eq.equipe) && !escEhAdm(eq.recurso))}))
    .filter(b=>b.equipes.length);
}
function escMin(h){
  if(!h) return null;
  const s = h.ini.h*60 + h.ini.m;
  let e = h.fim.h*60 + h.fim.m + (h.fim.s>=59 ? 1 : 0);
  if(e<=s) e += 1440;
  return {s, e};
}
function escHm(min){
  const m = ((min % 1440) + 1440) % 1440;
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
}
function escMontarTexto(dia){
  const uteis = escBlocosUteis(dia);
  if(!uteis.length) return '';
  const blocos = uteis.map((b,i)=>({...b, idx:i, h:escHoras(b.turno), titulo:escTitulo(b.escala)}));
  blocos.forEach(b=>{ b.r = escMin(b.h); });
  const ehInt = b => /INTEND/.test(b.titulo);
  const chave = eq => eq.militares.map(m=>m.matricula).filter(Boolean).sort().join(',');
  const temRec = eq => !!String(eq.recurso||'').trim();

  // Período SEM viatura (apresentação/preparo) de uma guarnição que depois tem período COM viatura:
  // o horário mostrado é o turno todo (do início do período sem viatura ao fim do período com viatura).
  const semRec = [];
  blocos.forEach(b=>{ if(ehInt(b)) return; b.equipes.forEach(eq=>{
    if(eq.militares.length && !temRec(eq)) semRec.push({eq, key:chave(eq), r:b.r, usado:false});
  }); });
  const faixa = new Map();
  blocos.forEach(b=>{ if(ehInt(b)) return; b.equipes.forEach(eq=>{
    if(!eq.militares.length || !temRec(eq)) return;
    let r = b.r ? {s:b.r.s, e:b.r.e} : null;
    const k = chave(eq);
    if(k) semRec.forEach(x=>{
      if(!x.usado && x.key===k && x.r){
        x.usado = true;
        if(r){ r.s = Math.min(r.s, x.r.s); r.e = Math.max(r.e, x.r.e); } else r = {s:x.r.s, e:x.r.e};
      }
    });
    faixa.set(eq, r);
  }); });
  semRec.forEach(x=>{ if(!x.usado) faixa.set(x.eq, x.r); });

  const entradas = [];
  const intend = blocos.filter(ehInt);
  if(intend.length) entradas.push({tipo:'int', ini: Math.min(...intend.map(x=>x.r ? x.r.s : 0)), idx: intend[0].idx});
  blocos.forEach(b=>{
    if(ehInt(b)) return;
    const itens = b.equipes.filter(eq=>eq.militares.length && faixa.has(eq)).map(eq=>({eq, r:faixa.get(eq)}));
    const grupos = [];
    itens.forEach(it=>{
      const k = it.r ? it.r.s+'-'+it.r.e : 'x';
      let g = grupos.find(x=>x.k===k);
      if(!g){ g = {k, r:it.r, eqs:[]}; grupos.push(g); }
      g.eqs.push(it.eq);
    });
    grupos.forEach(g=>entradas.push({tipo:'blk', b, r:g.r, eqs:g.eqs, ini: g.r ? g.r.s : 0, idx:b.idx}));
  });
  entradas.sort((x,y)=> x.ini-y.ini || x.idx-y.idx);

  // homônimos no mesmo dia: mostra primeiro nome + nome de guerra
  const uniq = {};
  const reg = m => { uniq[m.matricula||m.nome_completo] = m; };
  entradas.forEach(en=>{
    if(en.tipo==='blk') en.eqs.forEach(eq=>eq.militares.forEach(reg));
    else intend.forEach(x=>x.equipes.forEach(eq=>eq.militares.forEach(reg)));
  });
  const porNome = {};
  Object.keys(uniq).forEach(k=>{ const n=escBase(uniq[k]); (porNome[n]=porNome[n]||new Set()).add(k); });
  const dups = new Set();
  Object.keys(uniq).forEach(k=>{ if(porNome[escBase(uniq[k])].size>1) dups.add(k); });
  const nomeExibir = m => {
    const base = escBase(m);
    if(dups.has(m.matricula||m.nome_completo)){
      const pn = String(m.nome_completo||'').trim().split(/\s+/)[0]||'';
      if(pn && !base.startsWith(pn.toUpperCase())) return pn.toUpperCase()+' '+base;
    }
    return base;
  };
  const linhaMil = m => {
    const f = escFuncao(m.funcao);
    return `${m.patente||''} ${nomeExibir(m)}${f ? ' ('+f+')' : ''}`.trim();
  };

  const L = [];
  if(dia.data){
    const [y,mo,d] = dia.data.split('-').map(Number);
    const dt = new Date(y, mo-1, d);
    const dd = String(d).padStart(2,'0')+'/'+String(mo).padStart(2,'0');
    const sem = dt.toLocaleDateString('pt-BR',{weekday:'long'}).toUpperCase();
    L.push('*4ªCIA PM IND GER*', `*ESCALA DIÁRIA ${dd}*`, `*${sem}*`, '');
  } else {
    L.push('*4ªCIA PM IND GER*', '*ESCALA DIÁRIA*', '');
  }

  entradas.forEach(en=>{
    if(en.tipo==='int'){
      const rec = (intend[0].equipes[0]||{}).recurso;
      L.push(`*INTENDÊNCIA${rec ? ' ('+rec+')' : ''}*`);
      L.push(intend.map(x=>{
        if(!x.r) return '';
        const dn = x.h.ini.h < 12 ? 'dia' : 'noite';
        return `${escHm(x.r.s)} às ${escHm(x.r.e)} (${dn})`;
      }).filter(Boolean).join(' / '));
      L.push('');
      intend.forEach(x=>{
        const rot = (x.h && x.h.ini.h >= 12) ? 'NOITE' : 'DIA';
        x.equipes.forEach(eq=>eq.militares.forEach(m=>L.push(`${rot} — ${linhaMil(m)}`)));
      });
      L.push('');
      return;
    }
    L.push(`*${en.b.titulo}*`);
    if(en.r) L.push(`${escHm(en.r.s)} às ${escHm(en.r.e)}`);
    L.push('');
    en.eqs.forEach(eq=>{
      L.push(String(eq.recurso||'').trim() || String(eq.equipe||'').trim());
      eq.militares.slice().sort((a,b)=>escOrdemFuncao(a.funcao)-escOrdemFuncao(b.funcao)).forEach(m=>L.push(linhaMil(m)));
      L.push('');
    });
  });

  // P2 (escala mensal da Seção de Inteligência) entra por último, abaixo da última equipe
  const p2 = escP2Do(dia.data);
  if(p2 && p2.lista.length){
    L.push('*EQUIPE P2*', p2.horario, '');
    p2.lista.forEach(m=>L.push(`${m.patente||'SGT'} ${m.nome}`));
    L.push('');
  }
  while(L.length && L[L.length-1]==='') L.pop();
  return L.join('\n');
}

function escLerArquivoBase64(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(String(r.result).split(',')[1]);
    r.onerror = ()=>reject(new Error('Não foi possível ler o arquivo'));
    r.readAsDataURL(file);
  });
}
function escCopiar(texto){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(texto);
  const ta = document.createElement('textarea'); ta.value = texto; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }finally{ ta.remove(); }
  return Promise.resolve();
}
function escRefazerNaoEditados(){
  ESC.dias.forEach(d=>{ if(!d.editado) d.texto = escMontarTexto(d); });
}
function escDiaTitulo(data){
  const m = String(data||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return 'Escala (sem data)';
  const dt = new Date(+m[1], +m[2]-1, +m[3]);
  return `${m[3]}/${m[2]} — ${dt.toLocaleDateString('pt-BR',{weekday:'long'})}`;
}

async function escGerar(){
  const files = Array.from(document.getElementById('esc-arq').files || []);
  const st = document.getElementById('esc-status');
  if(!files.length){ st.style.color='#a4202a'; st.textContent='Escolha ao menos um PDF primeiro.'; return; }
  const btn = document.getElementById('esc-gerar'); btn.disabled = true;
  const linhas = [];
  const pintar = (extra)=>{ st.style.color='#555'; st.innerHTML = linhas.map(l=>`<div>${l}</div>`).join('') + (extra?`<div>${extra}</div>`:''); };
  for(let i=0;i<files.length;i++){
    const f = files[i];
    pintar(`⏳ Lendo ${i+1} de ${files.length}: ${esc(f.name)}… pode levar alguns segundos.`);
    try{
      const b64 = await escLerArquivoBase64(f);
      const d = await apiEscala('escalaProcessar', {base64:b64, content_type:'application/pdf'});
      if(d.tipo === 'p2_mensal'){
        const key = d.p2.ano+'-'+String(d.p2.mes).padStart(2,'0');
        ESC.p2[key] = d.p2;
        linhas.push(`✅ ${esc(f.name)} — escala mensal da P2 (${String(d.p2.mes).padStart(2,'0')}/${d.p2.ano})${d.p2.salvo ? ' — salva para os próximos dias' : ' — não foi salva (sem permissão de edição no P3)'}`);
        if((d.p2.nao_encontrados||[]).length) linhas.push(`⚠️ P2 sem cadastro no efetivo: ${esc(d.p2.nao_encontrados.join(', '))} (usei “SGT”). Cadastre em 👥 Efetivo.`);
      } else {
        const dia = { data: d.data || '', blocos: d.blocos, texto:'', editando:false, editado:false };
        const ja = ESC.dias.findIndex(x=>x.data===dia.data);
        if(ja>=0) ESC.dias[ja] = dia; else ESC.dias.push(dia);
        (d.pendentes||[]).forEach(p=>{ if(!ESC.pendentes.find(x=>x.matricula===p.matricula)) ESC.pendentes.push(p); });
        linhas.push(`✅ ${esc(f.name)} — escala diária ${esc(escDiaTitulo(dia.data))}`);
      }
    }catch(e){ linhas.push(`❌ ${esc(f.name)} — ${esc(e.message)}`); }
  }
  // meses das escalas diárias que ficaram sem P2 anexada agora: reaproveita a última salva
  const faltam = [...new Set(ESC.dias.map(d=>String(d.data||'').slice(0,7)).filter(m=>/^\d{4}-\d{2}$/.test(m)))].filter(m=>!ESC.p2[m]);
  if(faltam.length){
    try{
      const r = await apiEscala('escalaP2Obter', {meses:faltam});
      Object.keys(r.p2||{}).forEach(k=>{
        ESC.p2[k] = Object.assign({}, r.p2[k], {doBanco:true});
        const quando = r.p2[k].atualizado_em ? new Date(r.p2[k].atualizado_em).toLocaleDateString('pt-BR') : '';
        linhas.push(`ℹ️ P2 de ${k.slice(5)}/${k.slice(0,4)}: usei a escala que já estava salva${quando ? ' (anexada em '+quando+')' : ''}, porque você não anexou a planilha da P2 desta vez.`);
      });
    }catch(e){ linhas.push(`⚠️ Não consegui buscar a escala da P2 salva: ${esc(e.message)}`); }
  }
  ESC.dias.sort((a,b)=>String(a.data).localeCompare(String(b.data)));
  escRefazerNaoEditados();
  ESC.pendentes = ESC.pendentes.filter(p=>ESC.dias.some(d=>escBlocosUteis(d).some(b=>b.equipes.some(eq=>eq.militares.some(m=>m.matricula===p.matricula && !m.nome_guerra)))));
  pintar('');
  btn.disabled = false;
  escRenderSaida();
}

function escRenderSaida(){
  const pend = document.getElementById('esc-pend');
  const saida = document.getElementById('esc-saida');
  if(!pend || !saida) return;
  if(ESC.pendentes.length){
    pend.innerHTML = `<div style="background:#fff6d6;border:1px solid #e6cf72;border-radius:8px;padding:12px;margin:10px 0">
      <b>⚠️ ${ESC.pendentes.length} militar(es) sem nome de guerra cadastrado</b> — usei o último sobrenome no texto. Informe o nome de guerra para gravar e usar nas próximas escalas:
      ${ESC.pendentes.map((p,i)=>`<div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">
        <span style="min-width:260px;font-size:13px">${esc(p.patente)} ${esc(p.nome_completo)}</span>
        <input type="text" id="esc-pg-${i}" value="${esc(escBase({nome_completo:p.nome_completo}))}" style="width:180px">
        <button class="btn secundario" onclick="escSalvarPendente(${i})" ${ESC.acesso==='edit'?'':'disabled title="Sem permissão de edição no P3"'}>Salvar</button>
      </div>`).join('')}
    </div>`;
  } else pend.innerHTML = '';
  if(!ESC.dias.length){ saida.innerHTML = ESC.p2 && Object.keys(ESC.p2).length ? '<p style="color:#666;font-size:13px">Escala da P2 carregada. Anexe também o relatório diário do SISP para gerar o resumo.</p>' : ''; return; }
  saida.innerHTML = ESC.dias.map((dia,i)=>{
    const linhas = dia.texto.split('\n').length;
    const p2 = escP2Do(dia.data);
    const mm = String(dia.data||'').match(/^(\d{4})-(\d{2})/);
    const dica = !p2 ? (mm ? `ℹ️ Para incluir os militares da P2, anexe também a escala mensal da P2 de ${mm[2]}/${mm[1]}.` : '')
      : (!p2.lista.length ? 'ℹ️ A escala mensal da P2 não tem ninguém escalado neste dia.' : '');
    return `<div style="margin:18px 0 28px">
      <h3 style="margin:0 0 6px">📅 ${esc(escDiaTitulo(dia.data))}</h3>
      ${dica ? `<div style="font-size:12px;color:#8a6d00;margin-bottom:6px">${esc(dica)}</div>` : ''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">
        <button class="btn secundario" onclick="escAcao(${i},'editar')">${dia.editando ? '✔️ Concluir edição' : '✏️ Editar'}</button>
        <button class="btn secundario" onclick="escAcao(${i},'refazer')">↻ Refazer texto</button>
        <button class="btn secundario" id="esc-b-copiar-${i}" onclick="escAcao(${i},'copiar')">📋 Copiar</button>
        <button class="btn" style="background:#25a244" onclick="escAcao(${i},'zap')">💬 Enviar por WhatsApp</button>
      </div>
      <textarea id="esc-texto-${i}" ${dia.editando?'':'readonly'} oninput="escDigitou(${i}, this.value)" rows="${Math.min(Math.max(linhas+1,8),40)}"
        style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.45;padding:12px;border:1px solid ${dia.editando?'#2c4870':'#ccc'};border-radius:8px;background:${dia.editando?'#fff':'#fafafa'}">${esc(dia.texto)}</textarea>
    </div>`;
  }).join('') + `<div style="font-size:12px;color:#888">Os trechos entre *asteriscos* ficam em negrito no WhatsApp. O botão verde abre o WhatsApp com o texto pronto — é só escolher a pessoa ou o grupo.</div>`;
}
function escDigitou(i, v){ const d = ESC.dias[i]; if(d){ d.texto = v; d.editado = true; } }
async function escAcao(i, acao){
  const dia = ESC.dias[i]; if(!dia) return;
  if(acao==='editar'){ dia.editando = !dia.editando; escRenderSaida(); if(dia.editando){ const t=document.getElementById('esc-texto-'+i); if(t) t.focus(); } }
  else if(acao==='refazer'){
    if(dia.editado && !confirm('Isso descarta as suas edições manuais deste dia e gera o texto de novo. Continuar?')) return;
    dia.texto = escMontarTexto(dia); dia.editado = false; dia.editando = false; escRenderSaida();
  }
  else if(acao==='copiar'){
    const b = document.getElementById('esc-b-copiar-'+i);
    try{ await escCopiar(dia.texto); if(b) b.textContent='✅ Copiado'; }catch(e){ if(b) b.textContent='Não consegui copiar'; }
    setTimeout(()=>{ const bb=document.getElementById('esc-b-copiar-'+i); if(bb) bb.textContent='📋 Copiar'; }, 1800);
  }
  else if(acao==='zap'){ window.open('https://wa.me/?text='+encodeURIComponent(dia.texto), '_blank'); }
}

function escAtualizarNomeGuerra(matricula, ng){
  ESC.dias.forEach(d=>d.blocos.forEach(b=>b.equipes.forEach(eq=>eq.militares.forEach(m=>{ if(m.matricula===matricula) m.nome_guerra = ng || null; }))));
}
async function escSalvarPendente(i){
  const p = ESC.pendentes[i]; if(!p) return;

  const st = document.getElementById('esc-status');
  if(!ng){ st.style.color='#a4202a'; st.textContent='Digite o nome de guerra.'; return; }
  try{
    await apiEscala('escalaEfetivoSalvar', {matricula:p.matricula, patente:p.patente, nome_completo:p.nome_completo, nome_guerra:ng});

}

const edNorm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

const edFmt = s => s ? s.split('-').reverse().join('/') : '—';
const edDias = s => Math.ceil((new Date(s+'T23:59:59')-Date.now())/864e5);
const edFmtR = v => v==null ? null : v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

// ---------- editais ----------
function edSituacao(e){
  const hoje = edHoje();
  if(e.tipo==='resultado') return 'resultado';
  if(!e.fim) return 'indefinido';
  if(e.fim < hoje) return 'encerrado';
  if(e.inicio && e.inicio > hoje) return 'abrir';
  return 'aberto';
}
function edFiltrar(){
  const q = edNorm(ED.palavra), selN = new Set([...ED.sel].map(edNorm));
  return ED.editais.filter(e=>{
    const s = edSituacao(e);
    if(ED.situacao==='abertos' && s!=='aberto') return false;
    if(ED.situacao==='abrir' && s!=='abrir') return false;
    if(ED.situacao==='abertos_abrir' && !(s==='aberto' || s==='abrir' || s==='indefinido')) return false;
    if(ED.regiao==='zm' && !selN.has(edNorm(e.comarca))) return false;
    if(q && !edNorm((e.titulo||'')+' '+(e.resumo||'')).includes(q)) return false;
    return true;
  });
}
function edPdfDe(e){ const a = e.arquivos||[]; return a.find(x=>/edital/i.test(x.nome) && /fileDownload/.test(x.url)) || a.find(x=>/fileDownload/.test(x.url)); }
function edResumoHtml(e){
  const i = ED.infos[e.id];
  const valor = i && i.valor!=null ? edFmtR(i.valor) : (i ? 'não localizado no PDF' : '<span class="ed-carreg">lendo o edital…</span>');
  let local;
  if(i){ local = (i.local && i.local[0]) || (e.email ? 'e-mail '+e.email : (i.emails && i.emails[0] ? 'e-mail '+i.emails[0] : 'ver edital')); }
  else local = e.email ? 'e-mail '+e.email : null;
  const prazo = e.fim ? `até ${edFmt(e.fim)}` + (e.inicio ? ` (a partir de ${edFmt(e.inicio)})` : '') : ((i && i.prazo && i.prazo[0]) ? i.prazo[0] : 'ver edital');
  return `<div class="ed-resumo"><b>Cidade</b><span>${esc(e.comarca)}/MG</span><b>Valor do edital</b><span>${valor}</span><b>Envio da proposta</b><span>${esc(prazo)}</span><b>Local de entrega</b><span>${local===null ? '<span class="ed-carreg">lendo o edital…</span>' : esc(local)}</span></div>`;
}
const ED_ORDEM = {aberto:0,abrir:1,indefinido:2,encerrado:3,resultado:4};
function edRenderLista(){
  const el = document.getElementById('ed-lista'); if(!el) return;
  const lista = edFiltrar().sort((a,b)=>{ const oa=ED_ORDEM[edSituacao(a)], ob=ED_ORDEM[edSituacao(b)]; if(oa!==ob) return oa-ob; return (a.fim||'9999').localeCompare(b.fim||'9999'); });
  const novos = lista.filter(e=>!ED.vistos.has(e.id)).length;
  const cnt = document.getElementById('ed-contador'); if(cnt) cnt.textContent = ED.pronto ? `${lista.length} edital(is)` + (novos ? ` · ${novos} novo(s)` : '') : 'Carregando…';
  if(!ED.pronto) return;
  if(!lista.length){ el.innerHTML = '<div class="ed-vazio">Nenhum edital com esses filtros. Troque a situação para "Todos" ou a região para "Todo o estado" para conferir.</div>'; return; }
  el.innerHTML = lista.map(e=>{
    const s = edSituacao(e), novo = !ED.vistos.has(e.id);
    const tag = s==='aberto' ? `<span class="ed-tag ed-t-aberto">Inscrições abertas · ${edDias(e.fim)} dia(s) restante(s)</span>`
      : s==='abrir' ? `<span class="ed-tag ed-t-abrir">Abre em ${edFmt(e.inicio)}</span>`
      : s==='encerrado' ? '<span class="ed-tag ed-t-fim">Encerrado</span>'
      : s==='resultado' ? '<span class="ed-tag ed-t-fim">Resultado / decisão</span>' : '<span class="ed-tag ed-t-fim">Prazo não identificado — confira o edital</span>';
    return `<div class="ed-item ${novo?'novo':''}">
      <h3><a href="${esc(e.detalhe||'#')}" target="_blank" rel="noopener">${esc(e.titulo)}</a></h3>
      <div class="ed-meta">${novo?'<span class="ed-tag ed-t-novo">Novo</span>':''}${tag}<span>Inscrições: ${edFmt(e.inicio)} a ${edFmt(e.fim)}</span>${e.email?`<span>Envio: <a href="mailto:${esc(e.email)}">${esc(e.email)}</a></span>`:''}</div>
      ${edResumoHtml(e)}
      <div class="ed-arqs">${(e.arquivos||[]).map(a=>`<a href="${esc(a.url)}" target="_blank" rel="noopener">⬇ ${esc(a.nome)}</a>`).join('')}</div>
      <div class="ed-acoes"><button class="ed-b ed-btnp" data-part="${esc(e.id)}" onclick="edParticipar(this.dataset.part)">Participar do edital</button><span class="ed-status" style="margin:0">Abre o projeto em blocos já preenchido com os dados deste edital</span></div>
    </div>`; }).join('');
  edEnriquecer(lista);
}
async function edEnriquecer(lista){
  if(ED.enriquecendo) return; ED.enriquecendo = true;
  try{
    const pend = lista.filter(e=>!ED.infos[e.id] && edPdfDe(e)).slice(0,8);
    for(const e of pend){
      if(ED.sub!=='tjmg' || !document.getElementById('ed-lista')) break;       // saiu da aba: para de consultar
      try{ const r = await apiEdital('editalInfo', {url:edPdfDe(e).url}); const d = r.info||{}; ED.infos[e.id] = d.erro ? {erro:d.erro} : d; }
      catch(err){ ED.infos[e.id] = {erro:String(err.message||err)}; }
      try{ localStorage.setItem(ED_LS_I, JSON.stringify(ED.infos)); }catch(x){}
      edRenderLista();
    }
  } finally { ED.enriquecendo = false; }
}
async function edAtualizar(){
  ED.carregando = true; ED.erro = ''; ED.status = 'Consultando o portal do TJMG…';
  const bt = document.getElementById('ed-btn-atualizar'); if(bt) bt.disabled = true;
  const st = document.getElementById('ed-status'); if(st) st.textContent = ED.status;
  const ms = document.getElementById('ed-msg'); if(ms) ms.innerHTML = '';
  try{
    const d = await apiEdital('editaisListar');
    ED.editais = d.editais||[]; ED.pronto = true;
    ED.status = `Atualizado ${new Date().toLocaleTimeString('pt-BR')} · ${d.total} publicações em ${d.paginas} página(s) do TJMG`;
    if(ED.primeira){ ED.editais.forEach(e=>ED.vistos.add(e.id)); edSalvarVistos(); ED.primeira = false; }
  }catch(e){
    ED.erro = `Não foi possível ler o portal do TJMG agora (${e.message}). Abra a fonte pelo link à esquerda.`; ED.status = '';
  }
  ED.carregando = false;
  if(ED.sub==='tjmg'){ edRenderTjmg(); }
}
function edParticipar(id){
  const e = ED.editais.find(x=>x.id===id); if(!e) return;
  const d = btoa(unescape(encodeURIComponent(JSON.stringify({edital:e, info:ED.infos[e.id]||null}))));
  ED.projetoUrl = ED_PROJETO + '/?d=' + encodeURIComponent(d);
  edSub('projeto');
}
function edCsv(){
  const l = edFiltrar(); if(!l.length){ alert('Nada para exportar.'); return; }
  const cab = ['Comarca','Título','Situação','Início','Fim','E-mail','Resumo','Página','Edital (PDF)'];
  const linhas = l.map(e=>[e.comarca,e.titulo,edSituacao(e),edFmt(e.inicio),edFmt(e.fim),e.email||'',e.resumo||'',e.detalhe||'',((e.arquivos||[])[0]||{}).url||''].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';'));
  const blob = new Blob(['\ufeff'+[cab.join(';'),...linhas].join('\n')],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'editais-foruns-'+edHoje()+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}

async function apiCarta(op, params={}){
  const r = await fetch(CARTA_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':ANON_KEY,'Authorization':'Bearer '+ANON_KEY},
    body: JSON.stringify({op, token: ST.token, ...params})

  return d;
}

function ctHoje(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function ctVazio(){
  return { coord:[{turno:'Dia',oficial:'',fone:''},{turno:'Noite',oficial:'',fone:''}], superv:[{turno:'Dia',oficial:'',fone:''}],
    eventos:[], setorDia:[], setorNoite:[], opsDia:[], opsNoite:[] };
}
function ctNormalizar(d){
  const v = ctVazio(); const o = Object.assign({}, v, d||{});
  Object.keys(v).forEach(k=>{ if(!Array.isArray(o[k])) o[k] = v[k]; });
  return JSON.parse(JSON.stringify(o));
}
function ctDataBR(iso){ const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; }
function ctDataExtenso(iso){
  const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return '';
  const t = new Date(+m[1], +m[2]-1, +m[3]).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return t.charAt(0).toUpperCase()+t.slice(1);
}
function ctVals(tipo){ return (CT.listas[tipo]||[]).map(r=>r.valor); }
function ctOpts(valores, atual, vazio){
  let h = `<option value="">${esc(vazio===undefined?'—':vazio)}</option>`;
  if(atual && !valores.includes(atual)) h += `<option value="${esc(atual)}" selected>${esc(atual)}</option>`;
  valores.forEach(v=>{ h += `<option value="${esc(v)}" ${v===atual?'selected':''}>${esc(v)}</option>`; });
  return h;
}
function ctOptsNatureza(atual){
  const l = CT.listas.natureza||[]; let h = `<option value="">—</option>`;
  if(atual && !l.some(r=>r.valor===atual)) h += `<option value="${esc(atual)}" selected>${esc(atual)}</option>`;
  l.forEach(r=>{ h += `<option value="${esc(r.valor)}" ${r.valor===atual?'selected':''}>${esc(r.valor)}${r.extra?' — '+esc(r.extra):''}</option>`; });
  return h;
}
function ctOptsSetor(atual){
  const grupos = [['Coordenação',ctVals('setor')],['CIAs',ctVals('cia')],['BPMs',ctVals('bpm')]];
  const todos = [].concat(...grupos.map(g=>g[1]));
  let h = `<option value="">— (sem setor)</option>`;
  if(atual && !todos.includes(atual)) h += `<option value="${esc(atual)}" selected>${esc(atual)}</option>`;
  grupos.forEach(([nome,vals])=>{ if(vals.length) h += `<optgroup label="${nome}">`+vals.map(v=>`<option value="${esc(v)}" ${v===atual?'selected':''}>${esc(v)}</option>`).join('')+`</optgroup>`; });
  return h;
}
function ctAssinaturaAtual(D){
  const d = D || (CT.dados||{});
  if(d.assinatura && d.assinatura.valor) return d.assinatura;
  return (CT.listas.assinatura||[])[0] || {valor:'', extra:''};
}
function ctOptsAssinatura(atual){
  const l = CT.listas.assinatura||[]; let h = '';
  if(atual && atual.valor && !l.some(r=>r.valor===atual.valor && (r.extra||'')===(atual.extra||''))) h += `<option value="" selected>${esc(atual.valor)}${atual.extra?' — '+esc(atual.extra):''}</option>`;
  l.forEach(r=>{ const sel = atual && r.valor===atual.valor && (r.extra||'')===(atual.extra||''); h += `<option value="${r.id}" ${sel?'selected':''}>${esc(r.valor)}${r.extra?' — '+esc(r.extra):''}</option>`; });
  return h || '<option value="">(cadastre em ⚙️ Listas → Assinatura)</option>';
}
function ctSetAssinatura(id){
  const r = (CT.listas.assinatura||[]).find(x=>String(x.id)===String(id)); if(!r) return;
  CT.dados.assinatura = {valor:r.valor, extra:r.extra||''}; CT.salva = false;
  const sj = document.getElementById('ct-sujo'); if(sj) sj.style.display = 'block';
}
function ctNorm(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
function ctOptsBairro(){
  return '<option value="">＋ Bairro…</option>' + (CT.listas.bairro||[]).map(r=>`<option value="${esc(r.valor)}">${esc(r.valor)}</option>`).join('');
}
// escolhe um bairro na lista suspensa e acrescenta ao campo Patrulhamento (separados por "/"), sem repetir
function ctAddBairro(k,i,sel){
  const v = sel.value; sel.value = ''; if(!v) return;
  const r = CT.dados[k] && CT.dados[k][i]; if(!r) return;
  const partes = String(r.patrulhamento||'').split('/').map(t=>t.trim()).filter(Boolean);
  if(!partes.some(t=>ctNorm(t)===ctNorm(v))) partes.push(v);
  r.patrulhamento = partes.join('/');
  const el = document.getElementById(`ct-pat-${k}-${i}`); if(el) el.value = r.patrulhamento;
  CT.salva = false; const sj = document.getElementById('ct-sujo'); if(sj) sj.style.display = 'block';
}
function ctOptsFaixa(atual){
  const vals = ctVals('faixa'); let h = `<option value="">—</option>`;
  vals.forEach(v=>{ h += `<option value="${esc(v)}" ${v===atual?'selected':''}>${esc(v)}</option>`; });
  if(atual && atual!=='__HORA__' && !vals.includes(atual)) h += `<option value="${esc(atual)}" selected>${esc(atual)}</option>`;
  h += `<option value="__HORA__" ${atual==='__HORA__'?'selected':''}>Definir horário…</option>`;
  return h;
}
function ctRecursosTurno(k){
  const rows = CT.dados[k==='opsDia'?'setorDia':'setorNoite']||[];
  const v = [...new Set(rows.map(r=>r.recurso).filter(Boolean))];
  return v.length ? v : ctVals('recurso');
}
function ctFaixaTexto(o){
  if(o.faixa==='__HORA__') return (o.hi && o.hf) ? `${o.hi} às ${o.hf}` : (o.hi||o.hf||'');
  return o.faixa||'';
}

// ---------- lista de cartas (todos os lançamentos) ----------
async function renderAreaCarta(areaId, acesso){
  ctInjetarCss();
  CT = { data:ctHoje(), dados:null, listas:{}, podeEditar:acesso==='edit', datas:[], aviso:'', salva:true, listaAba:'oficial', modo:'lista', lista:[], dataSalva:null, baseOrigem:null };
  const box = document.getElementById('area-corpo');
  box.innerHTML = '<div class="carregando">Carregando…</div>';
  try{
    const l = await apiCarta('cartaListas'); CT.listas = l.listas; CT.podeEditar = !!l.podeEditar;
    await ctCarregarLista();
  }catch(e){ box.innerHTML = `<p style="color:#a4202a">${esc(e.message)}</p>`; }
}
async function ctCarregarLista(){
  const r = await apiCarta('cartaListar');
  CT.lista = r.cartas||[]; CT.datas = CT.lista.map(c=>c.data); CT.modo = 'lista'; CT.salva = true; CT.dataSalva = null; CT.aviso = '';
  ctRenderLista();
}
function ctSemana(iso){ const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString('pt-BR',{weekday:'long'}) : ''; }
function ctRenderLista(){
  const box = document.getElementById('area-corpo'); if(!box) return;
  const pode = CT.podeEditar;
  const linhas = CT.lista.map(c=>{
    const D = ctNormalizar(c.dados);
    const of = t => D.coord.filter(r=>r.turno===t && r.oficial).map(r=>r.oficial).join('; ');
    const quando = c.atualizado_em ? new Date(c.atualizado_em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : '';
    return `<tr><td style="white-space:nowrap"><b>${esc(ctDataBR(c.data))}</b><div style="font-size:11px;color:#777">${esc(ctSemana(c.data))}</div></td>
      <td style="font-size:12px"><div>☀️ ${esc(of('Dia'))||'—'}</div><div>🌙 ${esc(of('Noite'))||'—'}</div></td>
      <td style="font-size:12px;color:#555">Dia: ${D.setorDia.length} recurso(s), ${D.opsDia.length} operação(ões)<br>Noite: ${D.setorNoite.length} recurso(s), ${D.opsNoite.length} operação(ões)${D.eventos.length ? '<br>'+D.eventos.length+' evento(s)' : ''}</td>
      <td style="font-size:11px;color:#777;white-space:nowrap">${esc(quando)}<br>${esc(c.atualizado_por||'')}</td>
      <td style="white-space:nowrap"><button class="btn secundario" style="padding:3px 9px" onclick="ctAbrirCarta('${c.data}')">Abrir / editar</button>
        <button class="btn" style="padding:3px 9px;background:#2c4870" onclick="ctGerarDe('${c.data}')">📄 Gerar</button>
        <button class="btn secundario" style="padding:3px 9px" onclick="ctUsarComoBase('${c.data}')" ${pode?'':'disabled'} title="Novo lançamento a partir desta carta">⧉ Usar como base</button>
        <button class="ct-x" onclick="ctExcluirCarta('${c.data}')" ${pode?'':'disabled'} title="Excluir esta carta">🗑</button></td></tr>`;
  }).join('');
  box.innerHTML = `
    <div class="filtros" style="align-items:flex-end;gap:10px;flex-wrap:wrap">
      <div><button class="btn" onclick="ctNovaCartaModal()" ${pode?'':'disabled title="Seu usuário só visualiza o P3"'}>＋ Nova carta</button></div>
      <div><button class="btn secundario" onclick="ctAbrirListas()">⚙️ Listas</button></div>
    </div>
    <div style="font-size:12px;color:#777;margin:6px 0">${CT.lista.length} carta(s) salva(s). Use <b>⧉ Usar como base</b> para criar um novo lançamento a partir de uma carta pronta.</div>
    <table class="ct-lista"><thead><tr><th>Data</th><th>Coordenação</th><th>Resumo</th><th>Salva em</th><th></th></tr></thead>
      <tbody>${linhas || '<tr><td colspan="5" style="color:#999">Nenhuma carta salva ainda. Clique em ＋ Nova carta.</td></tr>'}</tbody></table>`;
}
function ctNovaCartaModal(){
  abrirModal(`<h3 style="margin-top:0">＋ Nova carta</h3>
    <div class="ct-row"><b style="font-size:13px">Data da carta</b><input type="date" id="ctn-data" value="${ctHoje()}"></div>
    <label style="display:flex;gap:6px;align-items:center;font-size:13px;margin:8px 0;width:auto"><input type="checkbox" id="ctn-base" checked style="width:auto;margin:0"> Começar da última carta salva antes dessa data (recomendado)</label>
    <div style="text-align:right;margin-top:12px"><button class="btn secundario" onclick="fecharModal()">Cancelar</button> <button class="btn" onclick="ctNovaCartaOk()">Criar</button></div>`);
}
async function ctNovaCartaOk(){
  const data = document.getElementById('ctn-data').value, base = document.getElementById('ctn-base').checked;
  if(!data){ alert('Escolha a data.'); return; }
  if(CT.datas.includes(data)){ if(confirm('Já existe uma carta em '+ctDataBR(data)+'. Abrir para editar?')){ fecharModal(); ctAbrirCarta(data); } return; }
  fecharModal();
  try{
    let dados = ctVazio(), aviso = 'Carta nova. Monte pelos botões ＋ Incluir.';
    if(base){ const u = await apiCarta('cartaUltima', {antes:data}); if(u.carta){ dados = u.carta.dados; aviso = `Carta de ${ctDataBR(u.carta.data)} usada como base. Ajuste o que mudou e clique em Salvar.`; } }
    ctAbrirRascunho(dados, data, aviso);
  }catch(e){ alert(e.message); }
}
function ctAbrirRascunho(dados, data, aviso){
  CT.dados = ctNormalizar(dados); CT.data = data; CT.dataSalva = null; CT.salva = false; CT.aviso = aviso||''; CT.modo = 'form'; ctRender();
}
async function ctAbrirCarta(data){
  try{
    const o = await apiCarta('cartaObter', {data});
    if(!o.carta){ alert('Carta não encontrada.'); return; }
    CT.dados = ctNormalizar(o.carta.dados); CT.data = data; CT.dataSalva = data; CT.salva = true; CT.aviso = ''; CT.modo = 'form'; ctRender();
  }catch(e){ alert(e.message); }
}
async function ctGerarDe(data){
  try{
    const o = await apiCarta('cartaObter', {data});
    if(!o.carta){ alert('Carta não encontrada.'); return; }
    CT.dados = ctNormalizar(o.carta.dados); CT.data = data; CT.dataSalva = data; CT.salva = true;
    ctGerar();
  }catch(e){ alert(e.message); }
}
function ctUsarComoBase(origem){
  if(!CT.podeEditar){ alert('Seu usuário só pode visualizar o P3.'); return; }
  CT.baseOrigem = origem;                       // data da carta salva, ou null = a carta aberta na tela
  const ref = origem || CT.data, hoje = ctHoje();
  const prox = s => { const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/); const d=new Date(+m[1],+m[2]-1,+m[3]+1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  const sug = ref >= hoje ? prox(ref) : hoje;
  abrirModal(`<h3 style="margin-top:0">⧉ Novo lançamento a partir da carta de ${esc(ctDataBR(ref))}</h3>
    <div style="font-size:13px;color:#555;margin-bottom:8px">Todos os dados da carta são copiados. Escolha a data do novo lançamento e ajuste o que mudou.</div>
    <div class="ct-row"><b style="font-size:13px">Data do novo lançamento</b><input type="date" id="ctb-data" value="${sug}"></div>
    <div style="text-align:right;margin-top:12px"><button class="btn secundario" onclick="fecharModal()">Cancelar</button> <button class="btn" onclick="ctUsarComoBaseOk()">Criar lançamento</button></div>`);
}
async function ctUsarComoBaseOk(){
  const nova = document.getElementById('ctb-data').value;
  if(!nova){ alert('Escolha a data.'); return; }
  if(CT.datas.includes(nova) && !confirm('Já existe uma carta em '+ctDataBR(nova)+'. Ao salvar, ela será substituída. Continuar?')) return;
  const origem = CT.baseOrigem; fecharModal();
  try{
    let dados, ref;
    if(origem){ const o = await apiCarta('cartaObter', {data:origem}); if(!o.carta){ alert('Carta não encontrada.'); return; } dados = o.carta.dados; ref = origem; }
    else { dados = JSON.parse(JSON.stringify(CT.dados)); ref = CT.data; }
    ctAbrirRascunho(dados, nova, `Novo lançamento criado a partir da carta de ${ctDataBR(ref)}. Ajuste o que mudou e clique em Salvar.`);
  }catch(e){ alert(e.message); }
}
async function ctExcluirCarta(data){
  if(!CT.podeEditar){ alert('Seu usuário só pode visualizar o P3.'); return; }
  if(!confirm('Excluir a carta de '+ctDataBR(data)+'? Isso não pode ser desfeito.')) return;
  try{ await apiCarta('cartaExcluir', {data}); CT.salva = true; await ctCarregarLista(); }catch(e){ alert(e.message); }
}
function ctExcluirAtual(){ if(CT.dataSalva) ctExcluirCarta(CT.dataSalva); }
async function ctVoltar(){
  if(!CT.salva && CT.podeEditar && !confirm('Há alterações não salvas nesta carta. Voltar para a lista mesmo assim?')) return;
  try{ await ctCarregarLista(); }catch(e){ alert(e.message); }
}
function ctSetData(v){
  if(!v) return;
  CT.data = v; CT.salva = false;
  CT.aviso = (CT.datas.includes(v) && v !== CT.dataSalva) ? `Já existe uma carta em ${ctDataBR(v)}. Se você salvar, ela será substituída.` : '';
  ctRender();
}
async function ctSalvar(silencioso){
  if(!CT.podeEditar){ if(!silencioso) alert('Seu usuário só pode visualizar o P3.'); return false; }
  if(!CT.data){ alert('Escolha a data da carta.'); return false; }
  if(CT.datas.includes(CT.data) && CT.data !== CT.dataSalva && !confirm('Já existe uma carta em '+ctDataBR(CT.data)+'. Substituir pela que está na tela?')) return false;
  try{
    await apiCarta('cartaSalvar', {data:CT.data, dados:CT.dados});
    CT.salva = true; CT.aviso = ''; CT.dataSalva = CT.data;
    try{ const r = await apiCarta('cartaListar'); CT.lista = r.cartas||[]; CT.datas = CT.lista.map(c=>c.data); }catch(e){}
    if(CT.modo==='form') ctRender();
    if(!silencioso){ const b=document.getElementById('ct-msg'); if(b){ b.textContent='✅ Carta salva.'; setTimeout(()=>{ if(b) b.textContent=''; }, 2500); } }
    return true;
  }catch(e){ alert(e.message); return false; }
}

  return `<div class="ct-row">
    <select onchange="ctSet('${k}',${i},'turno',this.value)"><option ${r.turno==='Dia'?'selected':''}>Dia</option><option ${r.turno==='Noite'?'selected':''}>Noite</option></select>
    ${ctSelectOficial(k,i,r.oficial)}

// Início/Término do evento: escolhe um horário da lista OU "Definir horário…" para marcar qualquer hora (ex.: 19:30)
function ctCampoHora(i,campo,r,rotulo){
  const hs = ctVals('horario'), v = r[campo]||'';
  const livre = !!r[campo+'Livre'] || (!!v && !hs.includes(v));
  let h = `<select title="${rotulo}" onchange="ctHoraSel(${i},'${campo}',this.value)"><option value="">${rotulo}</option>`;
  hs.forEach(x=>{ h += `<option value="${esc(x)}" ${(!livre && x===v)?'selected':''}>${esc(x)}</option>`; });
  h += `<option value="__HORA__" ${livre?'selected':''}>⏱ Definir horário…</option></select>`;
  if(livre) h += `<input type="time" title="${rotulo}: escolha qualquer horário" value="${esc(v)}" onchange="ctHoraLivre(${i},'${campo}',this.value)">`;
  return h;
}
function ctHoraSel(i,campo,val){
  const r = CT.dados.eventos[i]; if(!r) return;
  if(val==='__HORA__'){ r[campo+'Livre'] = true; if(ctVals('horario').includes(r[campo])) r[campo] = ''; }
  else { r[campo+'Livre'] = false; r[campo] = val; }
  CT.salva = false; ctRender();
}
function ctHoraLivre(i,campo,val){
  const r = CT.dados.eventos[i]; if(!r) return;
  r[campo] = val; CT.salva = false;
  const sj = document.getElementById('ct-sujo'); if(sj) sj.style.display = 'block';
}

    <input type="date" value="${esc(r.data)}" onchange="ctSet('eventos',${i},'data',this.value,true)">
    ${ctCampoHora(i,'ini',r,'Início')}${ctCampoHora(i,'fim',r,'Término')}
    <input type="text" placeholder="Efetivo" value="${esc(r.efetivo)}" style="width:80px" oninput="ctSet('eventos',${i},'efetivo',this.value,true)">

}

function ctSet(k,i,campo,valor,semRender,refazer){
  const r = CT.dados[k] && CT.dados[k][i]; if(!r) return;
  r[campo] = valor;
  if((k==='coord'||k==='superv') && campo==='oficial'){
    const o = (CT.listas.oficial||[]).find(x=>x.valor===valor);
    r.fone = o && o.extra ? o.extra : '';
    const el = document.getElementById(`ct-fone-${k}-${i}`); if(el) el.value = r.fone;
  }
  CT.salva = false;
  if(refazer || ((k==='setorDia'||k==='setorNoite') && campo==='recurso')){ ctRender(); return; }
  const sj = document.getElementById('ct-sujo'); if(sj) sj.style.display = 'block';
}
function ctIncluir(k){
  const arr = CT.dados[k]; const ult = arr[arr.length-1];
  let novo;
  if(k==='coord'||k==='superv') novo = {turno: ult ? ult.turno : 'Dia', oficial:'', fone:''};
  else if(k==='eventos') novo = {local:'',evento:'',data:CT.data,ini:'',fim:'',efetivo:'',os:''};
  else if(k==='setorDia'||k==='setorNoite') novo = {recurso:'',setor:''};
  else novo = ult ? Object.assign({}, ult, {recurso:'', patrulhamento:''}) : {natureza:'',bpm:'',cia:'',extra:'',faixa:(ctVals('faixa')[0]||''),hi:'',hf:'',recurso:'',patrulhamento:''};
  arr.push(novo); CT.salva = false; ctRender();
}
function ctRemover(k,i){ CT.dados[k].splice(i,1); CT.salva = false; ctRender(); }

// ---------- carta pronta ----------
function ctHtmlCarta(D, data){
  const nome = v => (v && String(v).trim()) ? esc(v) : '.';
  const ass = ctAssinaturaAtual(D);
  const linhasPessoa = arr => arr.map(r=>`<tr class="alt1"><td class="b">${esc(r.turno)}</td><td colspan="5">${nome(r.oficial)}</td><td colspan="4">${esc(r.fone)}</td></tr>`).join('');
  const ev = D.eventos.length ? D.eventos : [{}];
  const linhasEv = ev.map(r=>`<tr class="alt3"><td colspan="2">${esc(r.local||'')}</td><td colspan="2">${esc(r.evento||'')}</td><td>${esc(ctDataBR(r.data))}</td><td>${esc(r.ini||'')}</td><td>${esc(r.fim||'')}</td><td>${esc(r.efetivo||'')}</td><td colspan="2">${esc(r.os||'')}</td></tr>`).join('');
  const nd = Math.max(1, D.setorDia.length), nn = Math.max(1, D.setorNoite.length), tot = 1 + nd + nn;
  const colS = Array(tot).fill(`<col style="width:${(100/tot).toFixed(3)}%">`).join('');
  const cel = (arr,n,cls,campo) => { let h=''; for(let i=0;i<n;i++) h += `<td class="${cls}">${esc((arr[i]||{})[campo]||'')}</td>`; return h; };
  const setor = `<table>${`<colgroup>${colS}</colgroup>`}
    <tr><td class="cl" colspan="${tot}">SETOR DE ATUAÇÃO</td></tr>
    <tr class="alt1"><td class="cn" colspan="${nd+1}">TURNO DIA</td><td class="sl" colspan="${nn}">TURNO NOITE</td></tr>
    <tr class="alt2"><td class="cn">Recurso</td>${cel(D.setorDia,nd,'cn','recurso')}${cel(D.setorNoite,nn,'sl','recurso')}</tr>
    <tr class="alt3"><td class="cz">Setor</td>${cel(D.setorDia,nd,'','setor')}${cel(D.setorNoite,nn,'','setor')}</tr></table>`;
  const ops = (arr,titulo,cls) => {
    const l = arr.length ? arr : [{}];
    return `<table><colgroup>${Array(10).fill('<col style="width:10%">').join('')}</colgroup>
      <tr class="alt1"><td class="${cls}" colspan="10">${titulo}</td></tr>
      <tr><td class="cz" rowspan="2">Natureza</td><td class="cz" colspan="3" rowspan="2">Local</td><td class="cz" colspan="2">PERIODO COMPREENDIDO</td><td class="cz" rowspan="2">Recurso</td><td class="cz" colspan="3" rowspan="2">Patrulhamento</td></tr>
      <tr><td class="cz" colspan="2">FAIXA HORARIA</td></tr>
      ${l.map(o=>`<tr class="alt3"><td>${esc(o.natureza||'')}</td><td>${esc(o.bpm||'')}</td><td>${esc(o.cia||'')}</td><td>${esc(o.extra||'')}</td><td colspan="2">${esc(ctFaixaTexto(o))}</td><td>${esc(o.recurso||'')}</td><td colspan="3">${esc(o.patrulhamento||'')}</td></tr>`).join('')}</table>`;
  };
  return `<div class="ct-doc">
    <table style="border:none"><colgroup><col style="width:22%"><col style="width:56%"><col style="width:22%"></colgroup>
      <tr><td style="border:none;text-align:left"><img src="${CT_LOGO_ESQ}" style="height:54px"></td>
      <td style="border:none"><div style="color:#f00;font-weight:bold;font-size:24px;line-height:26px">SIGILOSO</div>
        <div class="b" style="font-size:14px">4ª REGIÃO DA POLÍCIA MILITAR</div><div class="b" style="font-size:14px">4ª COMPANHIA PM IND GER</div>
        <div class="b" style="font-size:14px;margin-top:4px">${esc(ctDataExtenso(CT.data))}</div></td>
      <td style="border:none;text-align:right"><img src="${CT_LOGO_DIR}" style="height:60px"></td></tr></table>
    <table style="margin-top:4px"><colgroup>${Array(10).fill('<col style="width:10%">').join('')}</colgroup>
      <tr class="alt1"><td class="cz" colspan="10">Coordenação e controle</td></tr>
      <tr class="alt1"><td class="cz" colspan="10">Policiamento da Unidade</td></tr>
      <tr class="alt1"><td class="cz">Turno</td><td class="cz" colspan="5">Nome do Oficial/Praça</td><td class="cz" colspan="4">Telefone de Contato</td></tr>
      ${linhasPessoa(D.coord)}
      <tr class="alt1"><td class="cz" colspan="10">Supervisão / Fiscalização</td></tr>
      ${linhasPessoa(D.superv)}
      <tr class="alt1"><td class="vd" colspan="10">Diagnostico Operacional e Atuação da 4ª Cia PM Ind GER</td></tr>
      <tr class="alt1"><td class="cz" colspan="10">Quadro de Eventos</td></tr>
      <tr><td class="cz" colspan="2" rowspan="2">Local</td><td class="cz" colspan="2" rowspan="2">Evento/Operação</td><td class="cz" rowspan="2">Data</td><td class="cz" colspan="2">Hora</td><td class="cz" rowspan="2">Efetivo</td><td class="cz" colspan="2" rowspan="2">Ordem de Serviço/Memorando</td></tr>
      <tr><td class="cz">Inicio</td><td class="cz">Termino</td></tr>
      ${linhasEv}</table>
    ${setor}
    ${ops(D.opsDia,'Quadro de Operações Policiais Dia','cn')}
    ${ops(D.opsNoite,'Quadro de Operações Policiais Noite','sl')}
    <div style="text-align:center;margin-top:14px;font-weight:bold;font-size:14px">${esc(ass.valor)}<br>${esc(ass.extra||'')}</div></div>`;
}
async function ctGerar(){
  if(CT.podeEditar && !CT.salva) await ctSalvar(true);
  ctInjetarCss();
  let ov = document.getElementById('carta-overlay'); if(ov) ov.remove();
  ov = document.createElement('div'); ov.id = 'carta-overlay'; ov.className = 'ov-print';
  ov.innerHTML = `<div class="nao-imprimir" style="position:sticky;top:0;z-index:2;background:#222;padding:10px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap">
      <button class="btn" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
      <label style="color:#ddd;font-size:12px;display:flex;align-items:center;gap:6px;margin:0;width:auto">✍️ Assina:
        <select id="ct-ass-ov" style="padding:5px;border-radius:6px;max-width:340px;width:auto" onchange="ctTrocarAssinaturaOv(this.value)">${ctOptsAssinatura(ctAssinaturaAtual())}</select></label>
      <button class="btn secundario" onclick="ctFecharCarta()">✖ Voltar para editar</button>
      <span style="color:#ccc;font-size:12px">Na janela de impressão, escolha o destino “Salvar como PDF”.</span></div>
    <div id="carta-folha">${ctHtmlCarta(CT.dados, CT.data)}</div>`;
  document.body.appendChild(ov);
  printPagina('size:A4 landscape;margin:6mm');
  ctAjustarZoom();
}
function ctAjustarZoom(){
  const f = document.getElementById('carta-folha'); if(!f) return;
  f.style.setProperty('--ctz', '1');
  const h = f.scrollHeight - 20, limite = 680;           // altura útil de uma página A4 paisagem (~198mm), com folga
  f.style.setProperty('--ctz', h > limite ? (limite/h).toFixed(3) : '1');
}
async function ctTrocarAssinaturaOv(id){
  ctSetAssinatura(id);
  const f = document.getElementById('carta-folha'); if(f){ f.innerHTML = ctHtmlCarta(CT.dados, CT.data); ctAjustarZoom(); }
  if(CT.podeEditar) await ctSalvar(true);               // grava junto com a carta, para valer nas próximas vezes
}
function ctFecharCarta(){ const ov = document.getElementById('carta-overlay'); if(ov) ov.remove(); printPagina(''); }

// ---------- listas (cadastros editáveis) ----------
async function ctAbrirListas(aba){
  if(aba) CT.listaAba = aba;
  const t = CT.listaAba, info = CT_TIPOS[t];
  const itens = CT.listas[t]||[];
  const pode = CT.podeEditar;
  abrirModal(`<h3 style="margin-top:0">⚙️ Listas da carta</h3>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${Object.keys(CT_TIPOS).map(k=>`<button class="btn ${k===t?'':'secundario'}" style="padding:4px 10px;font-size:12px" onclick="ctAbrirListas('${k}')">${CT_TIPOS[k][0]}</button>`).join('')}</div>
    ${itens.length>12 ? `<div class="ct-row"><input type="text" id="cl-filtro" placeholder="🔎 Filtrar esta lista (${itens.length} itens)…" style="width:100%;max-width:100%" oninput="ctFiltrarLista(this.value)"></div>` : ''}
    <div id="ct-listas-corpo" style="max-height:52vh;overflow:auto">
      ${itens.map((r,i)=>`<div class="ct-row" data-f="${esc(ctNorm(r.valor))}"><input type="text" id="cl-v-${i}" value="${esc(r.valor)}" style="width:${info[2]?'300':'360'}px" ${pode?'':'disabled'} placeholder="${esc(info[1])}">
        ${info[2] ? `<input type="text" id="cl-e-${i}" value="${esc(r.extra||'')}" style="width:150px" ${pode?'':'disabled'} placeholder="${esc(info[2])}">` : ''}
        ${pode ? `<button class="btn secundario" style="padding:4px 10px" onclick="ctListaSalvar(${i})">Salvar</button><button class="ct-x" onclick="ctListaExcluir(${i})">🗑</button>` : ''}</div>`).join('') || '<div style="color:#999;font-size:13px">Lista vazia.</div>'}
    </div>
    ${pode ? `<div class="ct-row" style="margin-top:10px;border-top:1px solid #eee;padding-top:10px"><input type="text" id="cl-novo-v" placeholder="Novo: ${esc(info[1])}" style="width:${info[2]?'300':'360'}px">
      ${info[2] ? `<input type="text" id="cl-novo-e" placeholder="${esc(info[2])}" style="width:150px">` : ''}
      <button class="btn" style="padding:4px 12px" onclick="ctListaNovo()">＋ Incluir</button></div>` : '<div style="font-size:12px;color:#888;margin-top:8px">Seu usuário só visualiza as listas.</div>'}
    <div style="text-align:right;margin-top:12px"><button class="btn secundario" onclick="fecharModal(); if(CT.modo==='form') ctRender(); else ctRenderLista();">Fechar</button></div>`);
}
function ctFiltrarLista(q){
  const n = ctNorm(q);
  document.querySelectorAll('#ct-listas-corpo .ct-row').forEach(el=>{ el.style.display = (!n || (el.dataset.f||'').includes(n)) ? '' : 'none'; });
}
async function ctRecarregarListas(){ const l = await apiCarta('cartaListas'); CT.listas = l.listas; }
async function ctListaSalvar(i){
  const r = (CT.listas[CT.listaAba]||[])[i]; if(!r) return;
  try{
    await apiCarta('cartaListaSalvar', {id:r.id, tipo:CT.listaAba, valor:document.getElementById('cl-v-'+i).value, extra:(document.getElementById('cl-e-'+i)||{}).value||''});
    await ctRecarregarListas(); ctAbrirListas();
  }catch(e){ alert(e.message); }
}
async function ctListaExcluir(i){
  const r = (CT.listas[CT.listaAba]||[])[i]; if(!r) return;
  if(!confirm('Excluir “'+r.valor+'” da lista? As cartas já salvas continuam com o texto que já tinham.')) return;
  try{ await apiCarta('cartaListaExcluir', {id:r.id}); await ctRecarregarListas(); ctAbrirListas(); }catch(e){ alert(e.message); }
}
async function ctListaNovo(){
  const v = document.getElementById('cl-novo-v').value; const e = (document.getElementById('cl-novo-e')||{}).value||'';
  try{ await apiCarta('cartaListaSalvar', {tipo:CT.listaAba, valor:v, extra:e}); await ctRecarregarListas(); ctAbrirListas(); }catch(er){ alert(er.message); }
}

  let s = document.getElementById('print-pagina');
  if(!css){ if(s) s.remove(); return; }
  if(!s){ s = document.createElement('style'); s.id = 'print-pagina'; document.head.appendChild(s); }
  s.textContent = '@page{'+css+'}';
}

let OS = { modo:'lista', podeEditar:false, listas:{}, temasUsados:[], lista:[], busca:'', id:null, numero:1, ano:new Date().getFullYear(),
  titulo:'', sigilo:'sem', data_evento:'', temas:[], d:null, salva:true, aviso:'', semana:false, listaAba:'distribuicao', tipo:'', modelos:[], tipos:[], filtroTipo:'', modoModelo:null, importLog:null, chat:null };
const OS_MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const OS_TIPOS = {
  distribuicao:['Distribuição (quem recebe)','Texto',''],
  responsavel:['Responsáveis (Atribuições)','Responsável',''],
  recurso:['Recursos padrão','Item',''],
  frase:['Frases padrão','Frase','Responsável (opcional)'],
  assinatura:['Assinatura','Nome e posto','Cargo']
};
const osP2 = n => String(n).padStart(2,'0');
const osNum = n => '3.'+String(n).padStart(3,'0');
function osDataBR(iso){ const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; }
function osFmtData(iso, semana){
  const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return '';
  let t = `${m[3]} de ${OS_MESES[+m[2]-1]} de ${m[1]}`;
  if(semana) t += ` (${new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString('pt-BR',{weekday:'long'})})`;
  return t;
}
function osFmtHora(hhmm){ const m = String(hhmm||'').match(/^(\d{1,2}):(\d{2})/); return m ? `${osP2(+m[1])}h${m[2]}min` : ''; }
