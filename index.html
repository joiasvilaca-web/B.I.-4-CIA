// ---------- modelo ----------
function osFrasePadrao(resp){ const f=(OS.listas.frase||[]).find(x=>x.extra===resp); return f ? f.valor : ''; }
function osItemT(v){ return {t:'texto', v:v||''}; }
function osNovoDoc(){
  const resp = r => ({resp:r, itens:[osItemT(osFrasePadrao(r))]});
  return { distribuicao:['Chefe da P3','Subcomandante','Sargenteação','Militares'],
    evento:[osItemT('')], objetivo:[osItemT('')],
    atribuicoes:['Chefe da P3','Subcomandante','Sargenteante','Militares'].map(resp),
    usaItinerario:false, itinerarios:[],
    recursos:['Armamentos de porte e munições compatíveis para os militares de serviço','Armamentos e equipamentos (individuais e coletivos)','Rádios transceptores'],
    usaPrescricoes:false, prescricoes:[] };
}
function osNormalizar(d){
  const v = osNovoDoc(); const o = Object.assign({}, v, d||{});
  ['distribuicao','evento','objetivo','atribuicoes','itinerarios','recursos','prescricoes'].forEach(k=>{ if(!Array.isArray(o[k])) o[k] = v[k]; });
  o.atribuicoes.forEach(a=>{ if(!Array.isArray(a.itens)) a.itens=[]; });
  return JSON.parse(JSON.stringify(o));
}
function osArr(path){
  if(path==='evento'||path==='objetivo'||path==='prescricoes') return OS.d[path];
  const m = String(path).match(/^atrib\.(\d+)$/); return m ? (OS.d.atribuicoes[+m[1]]||{}).itens : null;
}
function osSujo(){ OS.salva = false; const s=document.getElementById('os-sujo'); if(s) s.style.display='block'; }

// ---------- abertura ----------
async function renderAreaOS(areaId, acesso){
  osInjetarCss();
  OS = Object.assign(OS, { modo:'lista', podeEditar:acesso==='edit', listas:{}, lista:[], busca:'', id:null, d:null, salva:true, aviso:'', filtroTipo:'', modoModelo:null, tipo:'', importLog:null, chat:null });
  const box = document.getElementById('area-corpo');
  box.innerHTML = '<div class="carregando">Carregando…</div>';
  try{
    const l = await apiOS('osListas'); OS.listas = l.listas; OS.modelos = l.modelos||[]; OS.tipos = l.tipos||[]; OS.temasUsados = l.temasUsados||[]; OS.podeEditar = !!l.podeEditar;
    await osCarregarLista('');
  }catch(e){ box.innerHTML = `<p style="color:#a4202a">${esc(e.message)}</p>`; }
}
async function osCarregarLista(busca){
  OS.busca = busca||''; OS.modo = 'lista';
  const r = await apiOS('osListar', {busca:OS.busca, tipo:OS.filtroTipo}); OS.lista = r.os;
  osRenderLista();
}
function osRenderLista(){
  const box = document.getElementById('area-corpo'); if(!box) return;
  const linhas = OS.lista.map(o=>`<tr>
    <td style="white-space:nowrap"><b>${osNum(o.numero)}/${o.ano}</b></td>
    <td>${esc(o.titulo)}${o.sigilo==='com' ? ' <span style="background:#c00;color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:bold">SIGILOSO</span>' : ''}${o.tipo ? '<div style="font-size:11px;color:#777">'+esc(o.tipo)+'</div>' : ''}</td>
    <td style="white-space:nowrap">${esc(osDataBR(o.data_evento))}</td>
    <td>${(o.temas||[]).map(t=>`<span class="os-tema" style="padding:2px 9px">${esc(t)}</span>`).join('')}</td>
    <td style="white-space:nowrap"><button class="btn secundario" style="padding:3px 10px" onclick="osAbrir(${o.id})">Abrir</button>
      <button class="btn" style="padding:3px 10px;background:#2c4870" onclick="osAbrir(${o.id},true)">Gerar</button></td></tr>`).join('');
  box.innerHTML = `
    <div class="filtros" style="align-items:flex-end;gap:10px;flex-wrap:wrap">
      <div style="min-width:380px;flex:1"><label>Buscar O.S. (número, título, tema ou qualquer texto)</label>
        <input type="text" id="os-busca" value="${esc(OS.busca)}" placeholder="ex.: motociata, explosivo, 3.041, aeroporto…" onkeydown="if(event.key==='Enter') osBuscar()"></div>
      <div><label>Tipo</label><select onchange="osFiltrarTipo(this.value)"><option value="">Todos</option>${(OS.tipos||[]).map(t=>`<option value="${esc(t)}" ${t===OS.filtroTipo?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
      <div><button class="btn secundario" onclick="osBuscar()">🔍 Buscar</button></div>
      <div><button class="btn" onclick="osEscolherModelo()" ${OS.podeEditar?'':'disabled title="Seu usuário só visualiza o P3"'}>＋ Nova O.S.</button></div>
      <div><button class="btn" style="background:#6a3fb5" onclick="osAbrirAssistente('novo')" ${OS.podeEditar?'':'disabled title="Seu usuário só visualiza o P3"'} title="Converse com o assistente: ele lê as O.S. antigas, pergunta o que faltar e monta a O.S.">🤖 Assistente de O.S.</button></div>
      <div><button class="btn secundario" onclick="document.getElementById('os-imp').click()" ${OS.podeEditar?'':'disabled'} title="Envie O.S. em Word (.docx) ou PDF: o app lê e cadastra para você editar">📥 Importar O.S. (Word/PDF)</button>
        <input type="file" id="os-imp" accept=".docx,.pdf" multiple style="display:none" onchange="osImportar(this)"></div>
      <div><button class="btn secundario" onclick="osAbrirModelos()">📋 Tipos (modelos)</button></div>
      <div><button class="btn secundario" onclick="osAbrirListas()">⚙️ Listas</button></div>
    </div>
    <div id="os-imp-status" style="${OS.importLog ? '' : 'display:none;'}background:#f4f7fb;border:1px solid #c9d6ea;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px;line-height:1.7">${osHtmlImportLog()}</div>
    <div style="font-size:12px;color:#777;margin:6px 0">${OS.lista.length} O.S. ${OS.busca ? 'encontrada(s) para “'+esc(OS.busca)+'”' : 'salva(s)'}.</div>
    <table class="os-lista"><thead><tr><th>Nº</th><th>Título / tipo</th><th>Evento</th><th>Temas (só para busca)</th><th></th></tr></thead>
      <tbody>${linhas || '<tr><td colspan="5" style="color:#999">Nenhuma O.S. encontrada.</td></tr>'}</tbody></table>`;
}
function osBuscar(){ osCarregarLista((document.getElementById('os-busca')||{}).value||'').catch(e=>alert(e.message)); }

function osFiltrarTipo(v){ OS.filtroTipo = v; osCarregarLista(OS.busca).catch(e=>alert(e.message)); }
function osEscolherModelo(){
  const cartoes = (OS.modelos||[]).map(m=>`<div class="os-card" style="margin:8px 0;display:flex;gap:10px;align-items:center;justify-content:space-between">
      <div><b>${esc(m.nome)}</b> ${m.sigilo==='com' ? '<span style="background:#c00;color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:bold">SIGILOSO</span>' : ''}<div style="font-size:12px;color:#666">${esc(m.descricao||'')}</div></div>
      <button class="btn" style="padding:4px 14px" onclick="osNovaCom(${m.id})">Usar</button></div>`).join('');
  abrirModal(`<h3 style="margin-top:0">Nova O.S. — escolha o tipo</h3>
    <div style="max-height:56vh;overflow:auto">
      <div class="os-card" style="margin:8px 0;display:flex;gap:10px;align-items:center;justify-content:space-between"><div><b>📄 Em branco</b><div style="font-size:12px;color:#666">Estrutura padrão (Evento, Objetivo, Atribuições, Recursos), sem tipo definido.</div></div><button class="btn secundario" style="padding:4px 14px" onclick="osNovaCom(0)">Usar</button></div>
      ${cartoes || '<div style="color:#999;font-size:13px">Nenhum tipo cadastrado ainda.</div>'}
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:12px"><button class="btn secundario" onclick="osAbrirModelos()">📋 Gerenciar tipos</button><button class="btn secundario" onclick="fecharModal()">Cancelar</button></div>`);
}
async function osNovaCom(id){
  const m = id ? (OS.modelos||[]).find(x=>x.id===id) : null; fecharModal();
  await osNovaDe(m ? {titulo:'', tipo:m.nome, sigilo:m.sigilo, temas:[], d:m.dados, aviso:'Criada a partir do tipo “'+m.nome+'”. Preencha o título, a data e os campos entre [colchetes].'} : {titulo:'', tipo:'', sigilo:'sem', temas:[], d:null});
}
async function osNovaDe(base){
  try{
    const ano = new Date().getFullYear();
    const p = await apiOS('osProximo', {ano});
    OS.id = null; OS.modoModelo = null; OS.ano = ano; OS.numero = p.numero;
    OS.titulo = base.titulo||''; OS.tipo = base.tipo||''; OS.sigilo = base.sigilo||'sem'; OS.data_evento = base.data_evento||'';
    OS.temas = (base.temas||[]).slice(); OS.d = base.d ? osNormalizar(base.d) : osNovoDoc(); OS.aviso = base.aviso||'';
    OS.salva = false; OS.modo = 'form'; osRenderForm();
  }catch(e){ alert(e.message); }
}
async function osAbrir(id, gerar){
  try{
    const r = await apiOS('osObter', {id}); const o = r.os;
    OS.id = o.id; OS.modoModelo = null; OS.numero = o.numero; OS.ano = o.ano; OS.titulo = o.titulo; OS.tipo = o.tipo||''; OS.sigilo = o.sigilo; OS.data_evento = o.data_evento||'';
    OS.temas = Array.isArray(o.temas) ? o.temas.slice() : []; OS.d = osNormalizar(o.dados); OS.salva = true; OS.aviso = ''; OS.modo = 'form';
    osRenderForm();
    if(gerar) osGerar();
  }catch(e){ alert(e.message); }
}
async function osVoltar(){
  if(!OS.salva && OS.podeEditar && !confirm('Há alterações não salvas. Voltar para a lista mesmo assim?')) return;
  OS.modoModelo = null; OS.salva = true;
  try{ await osCarregarLista(OS.busca); }catch(e){ alert(e.message); }
}

// ---------- formulário ----------
function osNumSecao(){ // numeração automática das seções
  let n = 3; const r = {evento:1, objetivo:2, atrib:3};
  r.itin = OS.d.usaItinerario ? ++n : 0; r.recursos = ++n; r.presc = OS.d.usaPrescricoes ? ++n : 0; return r;
}
function osItemHtml(path, i, it){
  if(it.t==='img') return `<div class="os-row" style="align-items:flex-start"><img src="${it.v}" style="max-height:110px;border:1px solid #ccc;border-radius:4px">
    <input type="text" placeholder="Legenda (opcional)" value="${esc(it.legenda||'')}" style="width:260px" oninput="osLegenda('${path}',${i},this.value)">
    <button class="os-x" title="Remover" onclick="osRemItem('${path}',${i})">🗑</button></div>`;
  return `<div style="margin:6px 0"><textarea id="os-ta-${path}-${i}" class="os-ta" ${OS.podeEditar?'':'readonly'} oninput="osTexto('${path}',${i},this.value)">${esc(it.v)}</textarea>
    <div class="os-row" style="font-size:12px;color:#666">📅 <input type="date" title="Escolha a data: entra no texto no formato padrão" onchange="osInsData('${path}',${i},this)">
      <label style="display:inline-flex;align-items:center;gap:3px"><input type="checkbox" ${OS.semana?'checked':''} onchange="OS.semana=this.checked"> com dia da semana</label>
      🕐 <input type="time" title="Escolha a hora: entra no texto no formato padrão" onchange="osInsHora('${path}',${i},this)">
      <button class="os-x" title="Remover" onclick="osRemItem('${path}',${i})">🗑</button></div></div>`;
}
function osCardItens(titulo, path, itens, num, extra){
  return `<div class="os-card"><h4>${num ? num+'. ' : ''}${titulo} <button class="os-add" onclick="osAddItem('${path}')">＋ Incluir</button><button class="os-add" onclick="osAddImg('${path}')">🖼 Imagem</button>${extra||''}</h4>
    ${itens.map((it,i)=>osItemHtml(path,i,it)).join('') || '<div style="font-size:12px;color:#999">Nada incluído.</div>'}</div>`;
}
function osFrasesSelect(path, resp){
  const fr = (OS.listas.frase||[]); const sel = fr.filter(f=>f.extra===resp); const lista = sel.length ? sel : fr;
  if(!lista.length) return '';
  return `<select onchange="osAddFrase('${path}',this)"><option value="">＋ frase padrão…</option>${lista.map(f=>`<option value="${esc(f.valor)}">${esc(f.valor.slice(0,70))}</option>`).join('')}</select>`;
}

      <div><button class="btn" onclick="osSalvarModelo()" ${pode?'':'disabled title="Seu usuário só visualiza o P3"'}>💾 Salvar modelo</button></div>
      <div id="os-msg" style="font-size:13px;color:#2a7a2a"></div></div>

  return `<div class="filtros" style="align-items:flex-end;gap:10px;flex-wrap:wrap">

      <div><button class="btn" style="background:#2c4870" onclick="osGerar()">📄 Gerar O.S.</button></div>
      <div><button class="btn secundario" onclick="osDuplicar()" ${OS.podeEditar?'':'disabled'}>⧉ Duplicar</button></div>
      <div><button class="btn" style="background:#6a3fb5" onclick="osAbrirAssistente('form')" ${OS.podeEditar?'':'disabled'} title="Peça alterações a esta O.S. por conversa">🤖 Assistente</button></div>
      <div><button class="btn secundario" style="color:#a4202a" onclick="osExcluir()" ${OS.podeEditar && OS.id?'':'disabled'}>🗑 Excluir</button></div>
      <div id="os-msg" style="font-size:13px;color:#2a7a2a"></div>
    </div>`;
}
function osHtmlInicio(distChips){
  const d = OS.d, M = OS.modoModelo;
  const tipos = (OS.modelos||[]).map(m=>m.nome); if(OS.tipo && !tipos.includes(OS.tipo)) tipos.push(OS.tipo);
  return `<div class="os-card"><h4>${M ? 'Modelo (tipo de O.S.)' : 'Início'}</h4>
    ${M ? `<div class="os-row"><input type="text" style="width:420px;max-width:100%" placeholder="Nome do tipo (ex.: Operação conjunta)" value="${esc(M.nome)}" oninput="OS.modoModelo.nome=this.value;osSujo()">
        <input type="text" style="width:520px;max-width:100%" placeholder="Descrição curta (opcional)" value="${esc(M.descricao)}" oninput="OS.modoModelo.descricao=this.value;osSujo()"></div>` : ''}

// ---------- edições ----------
function osSetCab(c,v){
  if(c==='numero') OS.numero = parseInt(v,10)||1; else if(c==='ano') OS.ano = parseInt(v,10)||new Date().getFullYear();
  else OS[c] = v;
  osSujo(); if(c==='sigilo') osRenderForm();
}
function osToggleDist(v){ const a=OS.d.distribuicao, i=a.indexOf(v); if(i>=0) a.splice(i,1); else a.push(v); osSujo(); osRenderForm(); }
function osAddDist(){ const v=(prompt('Distribuição — digite o destinatário:')||'').trim(); if(v){ OS.d.distribuicao.push(v); osSujo(); osRenderForm(); } }
function osTexto(path,i,v){ const a=osArr(path); if(a&&a[i]) a[i].v = v; osSujo(); }
function osLegenda(path,i,v){ const a=osArr(path); if(a&&a[i]) a[i].legenda = v; osSujo(); }
function osAddItem(path){ osArr(path).push(osItemT('')); osSujo(); osRenderForm(); }
function osRemItem(path,i){ osArr(path).splice(i,1); osSujo(); osRenderForm(); }
function osAddFrase(path,sel){ const v=sel.value; if(!v) return; osArr(path).push(osItemT(v)); osSujo(); osRenderForm(); }
function osInserirTexto(path,i,txt){
  const ta = document.getElementById(`os-ta-${path}-${i}`), a = osArr(path); if(!ta||!a||!a[i]) return;
  const ini = ta.selectionStart ?? ta.value.length, fim = ta.selectionEnd ?? ta.value.length;
  const antes = ta.value.charAt(ini-1), depois = ta.value.charAt(fim);
  if(antes && !/[\s(\[]/.test(antes)) txt = ' '+txt;          // espaço antes, se colar em cima de uma palavra
  if(depois && /[\p{L}\d]/u.test(depois)) txt = txt+' ';        // espaço depois, se vier palavra em seguida
  ta.value = ta.value.slice(0,ini)+txt+ta.value.slice(fim); a[i].v = ta.value;
  ta.focus(); ta.selectionStart = ta.selectionEnd = ini+txt.length; osSujo();
}
function osInsData(path,i,el){ if(!el.value) return; osInserirTexto(path,i,osFmtData(el.value, OS.semana)); el.value=''; }
function osInsHora(path,i,el){ if(!el.value) return; osInserirTexto(path,i,osFmtHora(el.value)); el.value=''; }
function osRedimensionar(file, max){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>{ const im = new Image();
      im.onload = ()=>{ const k = Math.min(1, (max||1000)/im.width); const c = document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
        const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.8)); };
      im.onerror = ()=>rej(new Error('Imagem inválida')); im.src = fr.result; };
    fr.onerror = ()=>rej(new Error('Não foi possível ler a imagem')); fr.readAsDataURL(file);
  });
}
function osAddImg(path){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange = async ()=>{ if(!inp.files[0]) return;
    try{ const url = await osRedimensionar(inp.files[0], 1000); osArr(path).push({t:'img', v:url, legenda:''}); osSujo(); osRenderForm(); }catch(e){ alert(e.message); } };
  inp.click();
}
function osAddResp(){ OS.d.atribuicoes.push({resp:'', itens:[osItemT('')]}); osSujo(); osRenderForm(); }
function osSetResp(i,v){ OS.d.atribuicoes[i].resp = v; osSujo(); }
function osRemResp(i){ if(!confirm('Remover este responsável e os itens dele?')) return; OS.d.atribuicoes.splice(i,1); osSujo(); osRenderForm(); }
function osTogItin(on){ OS.d.usaItinerario = on; if(on && !OS.d.itinerarios.length) OS.d.itinerarios.push({titulo:'',hi:'',hf:'',rotulo:'Ponto de origem',local:'',passos:['']}); osSujo(); osRenderForm(); }
function osAddItin(){ OS.d.itinerarios.push({titulo:'',hi:'',hf:'',rotulo:'Ponto de origem',local:'',passos:['']}); osSujo(); osRenderForm(); }
function osItin(i,c,v){ OS.d.itinerarios[i][c] = v; osSujo(); }
function osRemItin(i){ OS.d.itinerarios.splice(i,1); osSujo(); osRenderForm(); }
function osPasso(i,j,v){ OS.d.itinerarios[i].passos[j] = v; osSujo(); }
function osAddPasso(i){ OS.d.itinerarios[i].passos.push(''); osSujo(); osRenderForm(); }
function osRemPasso(i,j){ OS.d.itinerarios[i].passos.splice(j,1); osSujo(); osRenderForm(); }
function osRecurso(i,v){ OS.d.recursos[i] = v; osSujo(); }
function osRemRecurso(i){ OS.d.recursos.splice(i,1); osSujo(); osRenderForm(); }
function osAddRecursoLivre(){ OS.d.recursos.push(''); osSujo(); osRenderForm(); }
function osAddRecurso(){
  const sel = document.getElementById('os-rs').value, q = parseInt(document.getElementById('os-rq').value,10);
  if(!sel) return;
  let txt = sel;
  if(q>0){ const nome = (q>1 && /^Viatura\b/.test(sel)) ? sel.replace(/^Viatura/,'Viaturas') : sel; txt = osP2(q)+' '+nome; }
  OS.d.recursos.push(txt); osSujo(); osRenderForm();
}
function osTogPresc(on){ OS.d.usaPrescricoes = on; if(on && !OS.d.prescricoes.length) OS.d.prescricoes.push(osItemT('')); osSujo(); osRenderForm(); }
function osAddTema(){
  const el = document.getElementById('os-tema-in'); const v = (el.value||'').trim(); if(!v) return;
  if(!OS.temas.some(t=>t.toLowerCase()===v.toLowerCase())) OS.temas.push(v);
  osSujo(); osRenderForm(); const n = document.getElementById('os-tema-in'); if(n) n.focus();
}
function osRemTema(i){ OS.temas.splice(i,1); osSujo(); osRenderForm(); }

// ---------- salvar / duplicar / excluir ----------
function osLimpo(){ // remove itens de texto vazios e campos em branco antes de salvar/gerar
  const d = OS.d; const lim = a => a.filter(it=>it.t==='img' ? it.v : (it.v||'').trim());
  d.evento = lim(d.evento); d.objetivo = lim(d.objetivo); d.prescricoes = lim(d.prescricoes);
  d.atribuicoes.forEach(a=>{ a.itens = lim(a.itens); }); d.atribuicoes = d.atribuicoes.filter(a=>(a.resp||'').trim());
  d.recursos = d.recursos.map(r=>r.trim()).filter(Boolean);
  d.itinerarios.forEach(it=>{ it.passos = (it.passos||[]).map(p=>p.trim()).filter(Boolean); });
  d.distribuicao = d.distribuicao.filter(Boolean);
}
async function osSalvar(silencioso){
  if(!OS.podeEditar){ if(!silencioso) alert('Seu usuário só pode visualizar o P3.'); return false; }
  if(!(OS.titulo||'').trim()){ alert('Informe o título da O.S.'); return false; }
  osLimpo();
  try{
    const r = await apiOS('osSalvar', {id:OS.id, numero:OS.numero, ano:OS.ano, titulo:OS.titulo, tipo:OS.tipo, sigilo:OS.sigilo, data_evento:OS.data_evento, temas:OS.temas, dados:Object.assign({}, OS.d, {sigilo:OS.sigilo})});
    OS.id = r.id; OS.salva = true; OS.aviso = '';
    try{ const l = await apiOS('osListas'); OS.temasUsados = l.temasUsados||[]; OS.tipos = l.tipos||OS.tipos; }catch(e){}
    osRenderForm();
    if(!silencioso){ const b=document.getElementById('os-msg'); if(b){ b.textContent='✅ O.S. salva.'; setTimeout(()=>{ if(b) b.textContent=''; }, 2500); } }
    return true;
  }catch(e){ alert(e.message); return false; }
}
async function osDuplicar(){
  if(!confirm('Criar uma nova O.S. com o mesmo conteúdo (novo número)?')) return;
  await osNovaDe({titulo:OS.titulo+' (cópia)', tipo:OS.tipo, sigilo:OS.sigilo, temas:OS.temas, d:OS.d, aviso:'Cópia criada com um novo número. Ajuste e salve.'});
}
async function osExcluir(){
  if(!OS.id) return;
  if(!confirm('Excluir esta O.S. definitivamente?')) return;
  try{ await apiOS('osExcluir', {id:OS.id}); OS.id=null; OS.salva=true; await osCarregarLista(OS.busca); }catch(e){ alert(e.message); }
}

// ---------- documento (blocos → HTML e Word) ----------
function osBlocos(){
  const d = OS.d, B = []; const S = osNumSecao();
  B.push({k:'tit', texto:`Ordem de Serviço nº ${osNum(OS.numero)} / ${OS.ano} – 4ª Cia PM Ind GER`});
  B.push({k:'tit', texto:(OS.titulo||'').toUpperCase()});
  const dist = d.distribuicao.filter(Boolean).join(', ');
  if(dist) B.push({k:'dist', texto:dist+'.'});
  const par = arr => arr.forEach(it=>{ if(it.t==='img'){ if(it.v) B.push({k:'img', src:it.v, legenda:it.legenda||''}); } else if((it.v||'').trim()) B.push({k:'par', texto:it.v.trim()}); });
  B.push({k:'sec', num:S.evento+'.', texto:'EVENTO'}); par(d.evento);
  B.push({k:'sec', num:S.objetivo+'.', texto:'OBJETIVO'}); par(d.objetivo);
  B.push({k:'sec', num:S.atrib+'.', texto:'ATRIBUIÇÕES ESPECÍFICAS'});
  d.atribuicoes.forEach((a,i)=>{
    B.push({k:'sub', num:`${S.atrib}.${i+1}`, texto:a.resp}); let j = 0;
    a.itens.forEach(it=>{ if(it.t==='img'){ if(it.v) B.push({k:'img', src:it.v, legenda:it.legenda||''}); } else if((it.v||'').trim()){ j++; B.push({k:'item', num:`${S.atrib}.${i+1}.${j}`, texto:it.v.trim()}); } });
  });
  if(d.usaItinerario && d.itinerarios.length){
    B.push({k:'sec', num:S.itin+'.', texto:'ITINERÁRIO (Previsão Inicial)'});
    d.itinerarios.forEach((it,i)=>{
      B.push({k:'sub', num:`${S.itin}.${i+1}`, texto:it.titulo||''});
      if(it.hi||it.hf) B.push({k:'rot', rotulo:'Horário:', texto:(it.hi&&it.hf) ? `${osFmtHora(it.hi)} às ${osFmtHora(it.hf)}` : osFmtHora(it.hi||it.hf)});
      if((it.local||'').trim()) B.push({k:'rot', rotulo:((it.rotulo||'Local').trim())+':', texto:it.local.trim()});
      (it.passos||[]).forEach(p=>{ if((p||'').trim()) B.push({k:'bul', texto:p.trim()}); });
    });
  }
  B.push({k:'sec', num:S.recursos+'.', texto:'RECURSOS NECESSÁRIOS'});
  d.recursos.filter(r=>(r||'').trim()).forEach(r=>B.push({k:'bul', texto:r.trim().replace(/[;.]+$/,'')+';'}));
  if(d.usaPrescricoes){
    const pr = d.prescricoes.filter(it=>it.t!=='img' && (it.v||'').trim());
    if(pr.length){ B.push({k:'sec', num:S.presc+'.', texto:'PRESCRIÇÕES DIVERSAS'}); pr.forEach((it,j)=>B.push({k:'item', num:`${S.presc}.${j+1}`, texto:it.v.trim()})); }
  }
  const ass = ((OS.listas.assinatura||[])[0]) || {valor:'', extra:''};
  B.push({k:'fecho', texto:'Juiz de Fora, na data da assinatura digital.'});
  B.push({k:'assin', nome:ass.valor, cargo:ass.extra||''});
  return B;
}
function osHtmlDoc(B){
  const e = esc; let h = '';
  h += `<table class="cab"><tr><td style="width:24mm"><img src="${OS_BRASAO}" style="height:20mm"></td>
    <td style="font-weight:bold;font-size:10pt;line-height:1.25">POLÍCIA MILITAR DE MINAS GERAIS<br>QUARTA REGIÃO DA POLÍCIA MILITAR<br>QUARTA COMPANHIA PM INDEPENDENTE GER</td></tr></table>`;
  B.forEach(b=>{
    if(b.k==='tit') h += `<p class="tit">${e(b.texto)}</p>`;
    else if(b.k==='dist') h += `<p class="dist"><b>Distribuição:</b> ${e(b.texto)}</p>`;
    else if(b.k==='sec') h += `<div class="sec"><span class="n">${e(b.num)}</span><span>${e(b.texto)}</span></div>`;
    else if(b.k==='sub') h += `<div class="sub"><span class="n">${e(b.num)}</span><span><u>${e(b.texto)}</u></span></div>`;
    else if(b.k==='item') h += `<div class="item"><span class="n">${e(b.num)}</span><span>${e(b.texto)}</span></div>`;
    else if(b.k==='par') h += `<p class="par">${e(b.texto)}</p>`;
    else if(b.k==='rot') h += `<p class="rot"><b>${e(b.rotulo)}</b> ${e(b.texto)}</p>`;
    else if(b.k==='bul') h += `<div class="bul"><span class="n">●</span><span>${e(b.texto)}</span></div>`;

// ---------- Word (.docx) sem bibliotecas externas ----------
const OSX = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function osCrc32(buf){
  if(!osCrc32.t){ osCrc32.t = []; for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; osCrc32.t[n]=c>>>0; } }
  let c = 0xFFFFFFFF; for(let i=0;i<buf.length;i++) c = osCrc32.t[(c^buf[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0;
}
function osZip(files){
  const enc = new TextEncoder(); const partes = []; const central = []; let off = 0;
  const u16 = n => [n&255,(n>>8)&255], u32 = n => [n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  files.forEach(f=>{
    const nome = enc.encode(f.name), crc = osCrc32(f.data), len = f.data.length;
    const lh = new Uint8Array([0x50,0x4b,3,4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(len), ...u32(len), ...u16(nome.length), ...u16(0)]);
    partes.push(lh, nome, f.data);
    central.push({nome, crc, len, off});
    off += lh.length + nome.length + len;
  });
  let tamCentral = 0;
  central.forEach(c=>{
    const ch = new Uint8Array([0x50,0x4b,1,2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(c.crc), ...u32(c.len), ...u32(c.len), ...u16(c.nome.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(c.off)]);
    partes.push(ch, c.nome); tamCentral += ch.length + c.nome.length;
  });
  partes.push(new Uint8Array([0x50,0x4b,5,6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(tamCentral), ...u32(off), ...u16(0)]));
  const total = partes.reduce((s,p)=>s+p.length,0), out = new Uint8Array(total); let o = 0; partes.forEach(p=>{ out.set(p,o); o += p.length; }); return out;
}
function osDataUrlBytes(url){ const b = atob(url.split(',')[1]); const a = new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
function osImgDim(url){ return new Promise(res=>{ const im = new Image(); im.onload = ()=>res({w:im.width,h:im.height}); im.onerror = ()=>res({w:4,h:3}); im.src = url; }); }
async function osBuildDocx(B){

  const rpr = (o={}) => `<w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${o.b?'<w:b/>':''}${o.u?'<w:u w:val="single"/>':''}<w:sz w:val="${o.sz||20}"/><w:szCs w:val="${o.sz||20}"/></w:rPr>`;
  const run = (t,o) => `<w:r>${rpr(o)}<w:t xml:space="preserve">${OSX(t)}</w:t></w:r>`;

  const draw = (rid,cx,cy,id,nome) => `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${id}" name="${nome}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${id}" name="${nome}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;

    <w:tc><w:tcPr><w:tcW w:w="1400" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${para(draw(ridBr,630000,720000,2,'brasao'),{jc:'left',after:0})}</w:tc>
    <w:tc><w:tcPr><w:tcW w:w="7842" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${para(run('POLÍCIA MILITAR DE MINAS GERAIS',{b:1}),{jc:'left',after:0})}${para(run('QUARTA REGIÃO DA POLÍCIA MILITAR',{b:1}),{jc:'left',after:0})}${para(run('QUARTA COMPANHIA PM INDEPENDENTE GER',{b:1}),{jc:'left',after:0})}</w:tc></w:tr></w:tbl>`;
  body += para('',{after:120});

    else if(b.k==='sub') body += para(run(b.num,{b:1})+tab+run(b.texto,{b:1,u:1}),{left:567,hang:567,before:160,after:100,keep:1,jc:'left'});

    else if(b.k==='assin') body += para(run(b.nome,{b:1}),{jc:'center',after:0,keep:1})+para(run(b.cargo,{b:1}),{jc:'center',after:0});
  }
  let hdrRef = '', files = [];
  const com = OS.sigilo==='com';
  if(com){
    const ridS = 'rIdSelo1';
    files.push({name:'word/header1.xml', data:new TextEncoder().encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:hdr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">${para(draw(ridS,1414145,420370,1,'selo'),{jc:'center',after:0})}</w:hdr>`)});
    files.push({name:'word/_rels/header1.xml.rels', data:new TextEncoder().encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="${ridS}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/selo.png"/></Relationships>`)});

async function osBaixarWord(){
  try{
    const bytes = await osBuildDocx(osBlocos());

function osLerB64(file){
  return new Promise((res,rej)=>{ const r = new FileReader(); r.onload = ()=>res(String(r.result).split(',')[1]); r.onerror = ()=>rej(new Error('Não foi possível ler o arquivo')); r.readAsDataURL(file); });

async function osImportar(input){
  const files = Array.from(input.files||[]); input.value = '';
  if(!files.length) return;
  if(!OS.podeEditar){ alert('Seu usuário só pode visualizar o P3.'); return; }
  const log = []; OS.importLog = log;
  const painel = ()=>{ const b = document.getElementById('os-imp-status'); if(b){ b.style.display=''; b.innerHTML = osHtmlImportLog(); } };
  for(let i=0;i<files.length;i++){
    const f = files[i]; const idx = log.length;
    log.push(`⏳ Lendo ${i+1} de ${files.length}: ${esc(f.name)}… (pode levar até 30 segundos)`); painel();
    try{
      const r = await apiOSImp({base64: await osLerB64(f)});
      const o = r.os, av = (r.avisos||[]).slice(); let numero = o.numero, id = null;
      if(!(numero>0)){ const p = await apiOS('osProximo', {ano:o.ano}); numero = p.numero; }
      else if(r.existente){
        if(confirm(`Já existe a O.S. ${osNum(numero)}/${o.ano} (${r.existente.titulo||'sem título'}).\n\nOK = SUBSTITUIR pela do arquivo ${f.name}\nCancelar = outras opções`)) id = r.existente.id;
        else if(confirm(`Salvar o arquivo ${f.name} com o próximo número livre?\n\nOK = salvar como nova O.S.\nCancelar = pular este arquivo`)){
          const p = await apiOS('osProximo', {ano:o.ano}); numero = p.numero; av.push('O número original já existia: salva com o próximo número livre.');
        } else { log[idx] = `⏭ ${esc(f.name)} — pulado`; painel(); continue; }
      }
      const s = await apiOS('osSalvar', {id, numero, ano:o.ano, titulo:o.titulo, tipo:o.tipo, sigilo:o.sigilo, data_evento:o.data_evento||'', temas:o.temas, dados:o.dados});
      log[idx] = `✅ ${esc(f.name)} → <b>${osNum(numero)}/${o.ano}</b> ${esc(o.titulo)} <button class="btn secundario" style="padding:1px 8px" onclick="osAbrir(${s.id})">Abrir</button>`
        + (av.length ? `<div style="font-size:12px;color:#8a6d00;margin-left:18px">⚠️ ${av.map(esc).join('<br>⚠️ ')}</div>` : '');
    }catch(e){ log[idx] = `❌ ${esc(f.name)} — ${esc(e.message)}`; }
    painel();
  }
  log.push('<span style="color:#666;font-size:12px">Importação concluída. Clique em “Abrir” para conferir e editar cada O.S.</span>');
  try{
    const l = await apiOS('osListas'); OS.tipos = l.tipos||OS.tipos; OS.temasUsados = l.temasUsados||[];
    const r = await apiOS('osListar', {busca:OS.busca, tipo:OS.filtroTipo}); OS.lista = r.os;
  }catch(e){}
  osRenderLista();
}

function osRascunhoPayload(r){
  const imgs = []; const conv = a => (a||[]).map(it=> it.t==='img' ? (imgs.push(it.v), {img:imgs.length}) : it.v);
  const d = r.d;
  return { imgs, payload:{ titulo:r.titulo||'', tipo:r.tipo||'', sigilo:r.sigilo||'sem', data_evento:r.data_evento||'', temas:r.temas||[],
    distribuicao:d.distribuicao||[], evento:conv(d.evento), objetivo:conv(d.objetivo),
    atribuicoes:(d.atribuicoes||[]).map(a=>({resp:a.resp, itens:conv(a.itens)})),
    itinerarios:d.usaItinerario ? (d.itinerarios||[]) : [], recursos:d.recursos||[], prescricoes:d.usaPrescricoes ? conv(d.prescricoes) : [] } };
}
function osDetokenizar(os, imgs){
  const fix = a => { (a||[]).forEach(it=>{ if(it.t==='img'){ const m = String(it.v).match(/^__IMG(\d+)__$/); if(m) it.v = imgs[+m[1]-1]||''; } }); return (a||[]).filter(it=>it.t!=='img' || it.v); };
  const d = os.d; d.evento = fix(d.evento); d.objetivo = fix(d.objetivo); d.prescricoes = fix(d.prescricoes);
  (d.atribuicoes||[]).forEach(a=>{ a.itens = fix(a.itens); });
}

    let pay = null, imgs = []; if(c.draft){ const x = osRascunhoPayload(c.draft); pay = x.payload; imgs = x.imgs; }

function prodNum(v, f){
  v = Number(v)||0;
  if(f==='r') return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  if(f==='kg') return v.toLocaleString('pt-BR',{maximumFractionDigits:3})+' kg';
  return v.toLocaleString('pt-BR',{maximumFractionDigits:2});
}
function prodVal(r,k){ const m=PROD_MK[k]; return m&&m.d ? m.d(r) : (Number(r[k])||0); }
function prodSoma(rows){
  const s={}; PROD_MET.forEach(m=>{ s[m.k]=0; });
  rows.forEach(r=>PROD_MET.forEach(m=>{ s[m.k]+=prodVal(r,m.k); }));
  return s;
}
function prodDataBR(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
function prodDia(iso){ return new Date(iso+'T12:00:00'); }
function prodIso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function prodSomaDias(iso,n){ const d=prodDia(iso); d.setDate(d.getDate()+n); return prodIso(d); }
function prodSemana(iso){ const d=prodDia(iso); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return prodIso(d); } // segunda-feira
function prodMesNome(ym){ const [y,m]=ym.split('-'); return PROD_MESES[+m-1]+'/'+y.slice(2); }

// aplica filtros; ignoraData=true para calcular o periodo anterior
function prodFiltrar(F, ignoraData){
  const q = F.busca.trim().toLowerCase();
  const minDin = Number(String(F.minDin).replace(',','.'))||0;
  return PROD.linhas.filter(r=>{
    if(!r.data) return false;
    if(!ignoraData){ if(F.de && r.data<F.de) return false; if(F.ate && r.data>F.ate) return false; }
    if(F.mes && r.data.slice(0,7)!==F.mes) return false;
    if(F.ano && r.data.slice(0,4)!==F.ano) return false;
    if(F.pels.length && !F.pels.includes(r.pel||'(sem pelotão)')) return false;
    if(F.tipoPel==='GER' && /CHOQUE/.test(r.pel)) return false;
    if(F.tipoPel==='CHOQUE' && !/CHOQUE/.test(r.pel)) return false;
    if(F.dow.length && !F.dow.includes(prodDia(r.data).getDay())) return false;
    if(F.dup==='ocultar' && r.dup) return false;
    if(F.dup==='so' && !r.dup) return false;
    if(F.alerta==='sem' && r.flags.length) return false;
    if(F.alerta==='so' && !r.flags.length) return false;
    if(minDin && r.din<minDin) return false;
    for(const c of F.cats){
      if(c==='trafico' && !(r.t>0||r.at>0)) return false;
      if(c==='arma' && !(r.ar>0||r.au>0||r.mu>0)) return false;
      if(c==='violento' && !(r.cv>0||r.apv>0)) return false;
      if(c==='veic' && !(r.vap>0||r.vr>0||r.avr>0)) return false;
      if(c==='dinheiro' && !(r.din>0)) return false;
      if(c==='forag' && !(r.fg>0)) return false;
      if(c==='menor' && !(r.mi>0)) return false;
    }
    if(F.droga==='coc' && !(r.cpg+r.cpp+r.cpap+r.cb>0)) return false;
    if(F.droga==='crack' && !(r.crp+r.crb>0)) return false;
    if(F.droga==='mac' && !(r.mb+r.mt+r.mbk>0)) return false;
    if(F.droga==='outras' && !r.outros) return false;
    if(q && !((r.outros||'')+' '+(r.calibres||'')+' '+(r.pel||'')+' '+r.data+' '+prodDataBR(r.data)+' '+r.id).toLowerCase().includes(q)) return false;
    return true;
  });
}
function prodPeriodoPrev(F){
  if(!(F.de && F.ate)) return null;
  const n = Math.round((prodDia(F.ate)-prodDia(F.de))/86400000)+1;
  return {de:prodSomaDias(F.de,-n), ate:prodSomaDias(F.de,-1), n};
}

async function renderAreaProdutividade(areaId, acesso){
  const box = document.getElementById('area-corpo');
  prodInjetarCss();
  if(PROD.timer){ clearInterval(PROD.timer); PROD.timer=null; }
  box.innerHTML = '<div class="carregando">Lendo a planilha de produtividade…</div>';
  try{
    const d = await apiProd();
    try{ await prodCarregarFontes(); }catch(e){ PROD.fontes=[]; }
    prodReceber(d, true);
  }catch(e){ box.innerHTML = `<p style="color:#a4202a">${esc(e.message)}</p><button class="btn" onclick="renderAreaProdutividade('P3','${acesso}')">Tentar de novo</button>`; return; }
  prodMontar();
  PROD.timer = setInterval(prodVerificar, 120000);
  if(!window._prodVis){ window._prodVis=true; document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) prodVerificar(); }); }
}
function prodReceber(d, primeira){
  const antes = PROD.linhas.length;
  PROD.versao = d.versao; PROD.atualizado = d.atualizado;
  if(d.mudou!==false){
    PROD.atualRows = d.linhas||[]; prodRecompor(); PROD.conferencia = d.conferencia; PROD.totalPlanilha = d.totalPlanilha; PROD.link = d.link||PROD.link;
    if(primeira){ // periodo padrao: tudo; ancora no mes mais recente
      PROD.F = Object.assign({}, PROD.F, {de:'',ate:'',pels:[],tipoPel:'',dow:[],mes:'',cats:[],droga:'',busca:'',dup:'incluir',alerta:'todos',minDin:''});
      PROD.pag = 0;
    }
  }
  return PROD.linhas.length - antes;
}
async function prodVerificar(manual){
  if(!document.getElementById('prod-root')){ if(PROD.timer){ clearInterval(PROD.timer); PROD.timer=null; } return; }
  const st = document.getElementById('prod-status');
  if(manual && st) st.textContent = '⏳ Verificando a planilha…';
  try{
    const d = await apiProd({versao: PROD.versao});
    if(d.mudou===false){ PROD.atualizado = d.atualizado; prodStatus(manual ? 'Planilha conferida: sem alterações.' : ''); return; }
    const dif = prodReceber(d, false);
    prodMontar(true);
    prodStatus('🔄 Planilha atualizada'+(dif? ' ('+(dif>0?'+':'')+dif+' registro'+(Math.abs(dif)===1?'':'s')+')':'')+'.', true);
  }catch(e){ prodStatus('⚠️ '+e.message); }
}
function prodStatus(msg, destaque){
  const st = document.getElementById('prod-status'); if(!st) return;
  const h = PROD.atualizado ? new Date(PROD.atualizado).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '';
  st.innerHTML = (msg ? `<b style="${destaque?'color:#33502f':''}">${esc(msg)}</b> ` : '') + `<span style="color:#888">Última verificação ${esc(h)} · automática a cada 2 min</span>`;
}

function prodLigar(){
  const root = document.getElementById('prod-root'); const F = PROD.F;
  const re = ()=>{ PROD.pag=0; prodAtualizar(); };
  const set = (id,fn)=>{ const e=document.getElementById(id); if(e) e.addEventListener('input',()=>{ fn(e.value); re(); }); };
  set('pf-de',v=>{F.de=v;F.mes='';F.ano='';prodSyncMes();}); set('pf-ate',v=>{F.ate=v;F.mes='';F.ano='';prodSyncMes();});
  const ea=document.getElementById('pf-ano'); if(ea) ea.addEventListener('change',()=>{ F.ano=ea.value; F.de='';F.ate='';F.mes=''; PROD.pag=0; prodMontar(true); });
  set('pf-mes',v=>{F.mes=v; if(v){F.de='';F.ate='';document.getElementById('pf-de').value='';document.getElementById('pf-ate').value='';}});
  set('pf-droga',v=>F.droga=v); set('pf-din',v=>F.minDin=v); set('pf-dup',v=>F.dup=v); set('pf-alerta',v=>F.alerta=v);
  let tb; const eb=document.getElementById('pf-busca'); eb.addEventListener('input',()=>{ clearTimeout(tb); tb=setTimeout(()=>{F.busca=eb.value;re();},250); });
  document.getElementById('pf-limpar').onclick=()=>{ PROD.F=Object.assign(PROD.F,{ano:'',de:'',ate:'',pels:[],tipoPel:'',dow:[],mes:'',cats:[],droga:'',busca:'',dup:'incluir',alerta:'todos',minDin:''}); prodMontar(); };
  document.getElementById('pf-salvar').onclick=prodSalvarVisao;
  document.getElementById('pf-fontes').onclick=prodFontesAbrir;
  root.addEventListener('click',ev=>{
    const x=ev.target.closest('[data-visx]'); if(x){ ev.stopPropagation(); prodRemoverVisao(x.dataset.visx); return; }
    const v=ev.target.closest('[data-vis]'); if(v){ prodAplicarVisao(v.dataset.vis); return; }
    const at=ev.target.closest('[data-at]'); if(at){ prodAtalho(at.dataset.at); return; }
    const c=ev.target.closest('.pd-chip[data-g]'); if(!c) return;
    const g=c.dataset.g, val=c.dataset.v;
    if(g==='fonte'){ prodTogFonte(val==='atual'?'atual':+val); return; }
    const tog=(arr,x)=>{ const i=arr.indexOf(x); if(i>=0) arr.splice(i,1); else arr.push(x); };
    if(g==='pel') tog(F.pels,val); else if(g==='dow') tog(F.dow,+val); else if(g==='cat') tog(F.cats,val);
    else if(g==='tipoPel') F.tipoPel = F.tipoPel===val ? '' : val;
    if(g==='tipoPel'){ root.querySelectorAll('.pd-chip[data-g="tipoPel"]').forEach(e=>e.classList.toggle('on',F.tipoPel===e.dataset.v)); }
    else c.classList.toggle('on');
    re();
  });
}

function prodAtalho(a){
  const F=PROD.F; const datas=PROD.linhas.filter(r=>r.data).map(r=>r.data).sort(); const fim=datas[datas.length-1]||prodIso(new Date());
  const hoje=prodIso(new Date()); const ref = fim>hoje?hoje:fim;
  F.mes='';F.ano='';
  if(a==='tudo'){ F.de='';F.ate=''; }
  else if(a==='7d'){ F.ate=ref; F.de=prodSomaDias(ref,-6); }
  else if(a==='30d'){ F.ate=ref; F.de=prodSomaDias(ref,-29); }
  else if(a==='mes'){ F.de=ref.slice(0,8)+'01'; F.ate=ref; }
  else if(a==='mant'){ const d=prodDia(ref.slice(0,8)+'01'); d.setDate(0); F.ate=prodIso(d); F.de=F.ate.slice(0,8)+'01'; }
  else if(a==='ano'){ F.de=ref.slice(0,4)+'-01-01'; F.ate=ref; }
  prodMontar(true);
}

function prodDescFiltros(semPer){
  const F=PROD.F; const p=[];
  p.push('Fontes: '+prodNomesFontes().join(' + '));
  if(!semPer)
  if(F.ano) p.push('Ano: '+F.ano+(F.mes?' · Mês: '+prodMesNome(F.mes):'')); else if(F.mes) p.push('Mês: '+prodMesNome(F.mes)); else if(F.de||F.ate) p.push('Período: '+(F.de?prodDataBR(F.de):'início')+' a '+(F.ate?prodDataBR(F.ate):'hoje')); else p.push('Período: todo o histórico');
  if(F.pels.length) p.push('Pelotão: '+F.pels.join(', ')); if(F.tipoPel) p.push(F.tipoPel==='GER'?'Só GER':'Só CHOQUE/MGER');
  if(F.dow.length) p.push('Dias: '+F.dow.map(i=>PROD_DOW[i].slice(0,3)).join('/'));
  if(F.cats.length) p.push('Com: '+F.cats.join(', ')); if(F.droga) p.push('Droga: '+F.droga);
  if(F.minDin) p.push('Dinheiro ≥ R$ '+F.minDin); if(F.busca) p.push('Busca: "'+F.busca+'"');
  if(F.dup!=='incluir') p.push('Duplicados: '+F.dup); if(F.alerta!=='todos') p.push('Alertas: '+F.alerta);
  return p.join(' · ');
}

function prodCalc(){
  const F=PROD.F; const rows=prodFiltrar(F);
  const s=prodSoma(rows);
  let prevP=prodPeriodoPrev(F);
  let prev=null, prevRows=null;
  if(prevP){ const F2=Object.assign({},F,{de:prevP.de,ate:prevP.ate,mes:''}); prevRows=prodFiltrar(F2); prev=prodSoma(prevRows); }
  else if(F.ano && !F.mes){ const y=+F.ano; prevP={de:(y-1)+'-01-01',ate:(y-1)+'-12-31'}; prevRows=prodFiltrar(Object.assign({},F,{ano:String(y-1)})); prev=prodSoma(prevRows); }
  return {rows, s, prev, prevP};
}

  const nAlert = rows.filter(r=>r.flags.length).length;

     <div><label>Agrupar por</label><select id="pg-gran"><option value="dia" ${F.gran==='dia'?'selected':''}>Dia</option><option value="semana" ${F.gran==='semana'?'selected':''}>Semana</option><option value="mes" ${F.gran==='mes'?'selected':''}>Mês</option></select></div>

function prodAvisoQual(rows){
  const dup=rows.filter(r=>r.dup).length, al=rows.filter(r=>r.flags.length).length;
  if(!al) return '';
  return `<div class="pd-warn">⚠️ ${al} registro${al>1?'s':''} com alerta de qualidade (${dup} ${dup===1?'possível duplicidade':'possíveis duplicidades'}). Veja a seção “Qualidade dos dados” no final — os números continuam batendo com a planilha; use o filtro “Duplicados” para excluí-los das contas.</div>`;
}

function prodChaveTempo(d,g){ return g==='mes' ? d.slice(0,7) : g==='semana' ? prodSemana(d) : d; }
function prodRotuloTempo(k,g){ return g==='mes' ? prodMesNome(k) : prodDataBR(k).slice(0,5)+(g==='semana'?' (sem.)':''); }
function prodSerieTempo(rows,k,g,sep){
  const chaves=new Set(); rows.forEach(r=>chaves.add(prodChaveTempo(r.data,g)));
  let ks=[...chaves].sort();
  // preenche lacunas
  if(ks.length>1){ const cheio=[]; let c=ks[0]; const fim=ks[ks.length-1]; let guard=0;
    while(c<=fim && guard++<800){ cheio.push(c); if(g==='mes'){ const [y,m]=c.split('-').map(Number); c = m===12 ? (y+1)+'-01' : y+'-'+String(m+1).padStart(2,'0'); } else c=prodSomaDias(c, g==='semana'?7:1); }
    if(cheio.length<=800) ks=cheio; }
  const grupos = sep ? [...new Set(rows.map(r=>r.pel||'(sem pelotão)'))].sort() : ['Total'];
  const ds = grupos.map(gp=>{ const mp={}; rows.forEach(r=>{ if(sep && (r.pel||'(sem pelotão)')!==gp) return; const c=prodChaveTempo(r.data,g); mp[c]=(mp[c]||0)+prodVal(r,k); }); return {nome:gp, v:ks.map(c=>Math.round((mp[c]||0)*1000)/1000)}; });
  return {ks, ds};
}

  // drogas

  PROD.charts.dro=desenharGrafico('c-dro',{type:'bar',data:{labels:dl.map(x=>x[0]),datasets:[{data:dl.map(x=>x[1]),backgroundColor:['#8f7f45','#b8a76a','#d8cd9b','#c77d2b','#33502f','#5a8f6a']}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true}}}});
  // comparativo
  const ind=[['t','Ocorr. tráfico'],['at','Autores tráfico'],['ar','Armas'],['cv','Crimes violentos'],['vap','Veíc. apreend.'],['fg','Foragidos']];
  PROD.charts.cmp=desenharGrafico('c-cmp',{type:'bar',data:{labels:ind.map(x=>x[1]),datasets:pels.map((p,i)=>({label:p,backgroundColor:PROD_CORES[i%PROD_CORES.length],data:ind.map(([kk])=>rows.filter(r=>(r.pel||'(sem pelotão)')===p).reduce((a,r)=>a+(r[kk]||0),0))}))},options:{plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true}}}});

  // acumulado
  document.getElementById('t-acu').textContent=m.l+' – acumulado';
  const sd=prodSerieTempo(rows,k,F.gran==='mes'?'mes':'dia',false); let ac=0;

}
function prodStats(C){
  const F=PROD.F,k=F.metrica,m=PROD_MK[k],rows=C.rows; const el=document.getElementById('pd-stat'); if(!el) return;
  if(!rows.length){ el.innerHTML='<div>Sem dados.</div>'; return; }
  const f=v=>prodNum(v,m.f); const tot=C.s[k];
  const vals=rows.map(r=>prodVal(r,k)).sort((a,b)=>a-b);
  const med=vals.length%2?vals[(vals.length-1)/2]:(vals[vals.length/2-1]+vals[vals.length/2])/2;
  const porDia={}; rows.forEach(r=>{porDia[r.data]=(porDia[r.data]||0)+prodVal(r,k);});
  const dias=Object.keys(porDia).sort(); const iniD=F.de||dias[0], fimD=F.ate||dias[dias.length-1];
  const nCal=Math.round((prodDia(fimD)-prodDia(iniD))/86400000)+1;
  const melhor=dias.reduce((a,d)=>porDia[d]>porDia[a]?d:a,dias[0]);
  const porPel={}; rows.forEach(r=>{const p=r.pel||'(sem pelotão)';porPel[p]=(porPel[p]||0)+prodVal(r,k);});
  const lider=Object.keys(porPel).sort((a,b)=>porPel[b]-porPel[a])[0];
  const mean=tot/rows.length; const sd=Math.sqrt(vals.reduce((a,v)=>a+(v-mean)**2,0)/vals.length);
  const porDow=[0,0,0,0,0,0,0]; rows.forEach(r=>{porDow[prodDia(r.data).getDay()]+=prodVal(r,k);});
  const dw=porDow.indexOf(Math.max(...porDow));
  const mx=rows.reduce((a,r)=>prodVal(r,k)>prodVal(a,k)?r:a,rows[0]);
  const t=[
    ['Total no filtro',f(tot)],['Registros considerados',rows.length],
    ['Média por registro',f(mean)],['Mediana por registro',f(med)],['Desvio-padrão',f(sd)],
    ['Média por dia (calendário)',f(tot/Math.max(1,nCal))],['Dias com registro / no período',dias.length+' / '+nCal],
    ['Melhor dia',prodDataBR(melhor)+' ('+f(porDia[melhor])+')'],['Maior registro único',f(prodVal(mx,k))+' ('+prodDataBR(mx.data)+', '+(mx.pel||'—')+')'],
    ['Pelotão que mais contribui',lider+' ('+(tot?Math.round(porPel[lider]/tot*100):0)+'%)'],['Dia da semana mais forte',PROD_DOW[dw]+' ('+(tot?Math.round(porDow[dw]/tot*100):0)+'%)'],
  ];
  if(C.prev){ const a=tot,b=C.prev[k]; t.push(['Período anterior',f(b)]); t.push(['Variação',b? (a-b>=0?'+':'')+((a-b)/b*100).toFixed(1).replace('.',',')+'%' : 'n/d']); }
  const s=C.s; if(s.t>0) t.push(['Autores presos por ocorrência de tráfico',(s.at/s.t).toLocaleString('pt-BR',{maximumFractionDigits:2})]);
  if(s.din>0){ const cd=rows.filter(r=>r.din>0).length; t.push(['Valor médio por apreensão de dinheiro',prodNum(s.din/cd,'r')+' ('+cd+' reg.)']); }
  if(s.ar>0) t.push(['Munições por arma',(s.mu/s.ar).toLocaleString('pt-BR',{maximumFractionDigits:1})]);
  el.innerHTML=t.map(([a,b])=>`<div><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('');
}

    return t.length?`<table><thead><tr><th>Data</th><th>Pelotão</th><th class="n">${col}</th><th>Linha</th></tr></thead><tbody>${t.map(r=>`<tr><td>${prodDataBR(r.data)}</td><td>${esc(r.pel)}</td><td class="n"><b>${fmt(fn(r))}</b></td><td>${r.id}</td></tr>`).join('')}</tbody></table>`:'<p style="color:#888">Sem registros.</p>'; };

const PROD_DET=[['data','Data fato'],['pel','Pelotão'],['t','Tráfico'],['at','Autores'],['mi','Menores'],['dro','Porções'],['kgt','kg'],['din','Dinheiro'],['ar','Armas'],['mu','Munições'],['fg','Forag.'],['cv','C.viol.'],['vap','Veíc.apr.'],['vr','Veíc.rec.'],['id','Linha']];
function prodDetalhe(){

  if(PROD.dupX) h += `<div class="pd-warn">ℹ️ ${PROD.dupX} registro${PROD.dupX>1?'s':''} de planilha${PROD.dupX>1?'s':''} histórica${PROD.dupX>1?'s':''} já constava${PROD.dupX>1?'m':''} em outra fonte selecionada e ${PROD.dupX>1?'foram desconsiderados':'foi desconsiderado'} para não contar duas vezes.</div>`;

  if(al.length) h += `<div class="pd-tb" style="max-height:260px"><table><thead><tr><th>Linha</th><th>Data fato</th><th>Pelotão</th><th>Alerta</th></tr></thead><tbody>${al.map(r=>`<tr><td>${r.id}</td><td>${prodDataBR(r.data)}</td><td>${esc(r.pel||'—')}</td><td>${esc(r.flags.join('; '))}</td></tr>`).join('')}</tbody></table></div>`;
  return h+'<p style="font-size:11px;color:#888;margin:8px 0 0">“Linha” = número da linha na planilha. Correções devem ser feitas na própria planilha: o sistema se atualiza sozinho.</p></div>';
}

  L.push('*Drogas*: cocaína '+f('coc')+' porções'+(s.cb?' + '+prodNum(s.cb,'kg'):'')+' · crack '+f('crp')+' pedras'+(s.crb?' + '+prodNum(s.crb,'kg'):'')+' · maconha '+f('mb')+' buchas/'+f('mt')+' tabletes'+(s.mbk?' + '+prodNum(s.mbk,'kg'):''));
  if(s.din) L.push('*Dinheiro*: '+f('din'));
  if(s.ar||s.mu||s.au) L.push('*Armas*: '+f('ar')+' armas · '+f('mu')+' munições · '+f('au')+' autores');
  if(s.cv||s.apv) L.push('*Crimes violentos*: '+f('cv')+' · '+f('apv')+' autores presos');

  if(s.fg) L.push('*Foragidos*: '+f('fg'));
  L.push('*Total de autores presos (soma)*: '+f('pre'));
  const gp={}; C.rows.forEach(r=>{const p=r.pel||'(sem pelotão)';(gp[p]=gp[p]||[]).push(r);});
  const ps=Object.keys(gp).sort(); if(ps.length>1){ L.push(''); L.push('*Por pelotão* (tráfico · autores · porções · dinheiro)'); ps.forEach(p=>{const x=prodSoma(gp[p]); L.push('• '+p+': '+x.t+' · '+x.at+' · '+prodNum(x.dro,'n')+' · '+prodNum(x.din,'r'));}); }

// ================= FONTES HISTORICAS =================
const PROD_BASE_KEYS=['t','at','mi','cpg','cpp','cb','cpap','crp','crb','mb','mt','mbk','fg','ar','mu','au','cv','apv','vap','vr','avr','din'];
const PROD_COMPS={coc:['cpg','cpp','cpap'],dro:['cpg','cpp','cpap','crp','mb','mt'],kgt:['cb','crb','mbk'],pre:['at','au','apv','avr']};
function prodNomeFonte(id){ if(!id||id==='atual') return 'Planilha atual'; const f=PROD.fontes.find(x=>x.id===id); return f?f.nome:'Fonte '+id; }
function prodNomesFontes(){ return (PROD.F.fontes||['atual']).map(prodNomeFonte); }
// uma linha "tem" a metrica quando a planilha de origem possui a coluna
function prodTem(r,k){ if(k==='reg') return true; if(PROD_COMPS[k]) return PROD_COMPS[k].some(c=>prodTem(r,c)); return !r._tem || r._tem.has(k); }
function prodTemAlg(rows,k){ if(!rows.length) return true; return rows.some(r=>prodTem(r,k)); }
async function prodCarregarFontes(){
  const d=await apiProd({op:'fontesLista'}); PROD.fontes=d.fontes||[]; PROD.podeEditarFontes=!!d.podeEditar;
  const F=PROD.F; F.fontes=(F.fontes||['atual']).filter(x=>x==='atual'||PROD.fontes.some(f=>f.id===x)); if(!F.fontes.length) F.fontes=['atual'];
  await prodGarantirLinhas();
}
async function prodGarantirLinhas(){ for(const id of PROD.F.fontes){ if(id!=='atual' && !PROD.fr[id]){ const d=await apiProd({op:'fonteLinhas',id}); PROD.fr[id]=d.linhas||[]; } } }
function prodIguais(a,b){
  if(a.data!==b.data || (a.pel||'')!==(b.pel||'')) return false;
  let n=0; for(const k of PROD_BASE_KEYS){ if(a._tem.has(k)&&b._tem.has(k)){ if(Math.abs((a[k]||0)-(b[k]||0))>0.0005) return false; if(a[k]) n++; } }
  return n>0;
}
function prodRecompor(){
  const F=PROD.F; const sel=(F.fontes&&F.fontes.length)?F.fontes:['atual'];
  const ordem=['atual',...PROD.fontes.map(f=>f.id)].filter(x=>sel.includes(x));
  const out=[]; const idx=new Map(); let dups=0;
  ordem.forEach(fid=>{
    const f=fid==='atual'?null:PROD.fontes.find(x=>x.id===fid); const tem=new Set(f?(f.tem||[]):PROD_BASE_KEYS);
    const rows=fid==='atual'?PROD.atualRows:(PROD.fr[fid]||[]);
    rows.forEach(r0=>{
      let r=r0;
      if(fid==='atual'){ r._f='atual'; r._tem=tem; }
      else { r=Object.assign({},r0); PROD_BASE_KEYS.forEach(k=>{ if(r[k]===undefined) r[k]=0; }); r._f=fid; r._tem=tem; r.flags=r.flags||[]; }
      if(r.data && !r.vazio){
        const ch=(r.pel||'')+'|'+r.data; const cands=idx.get(ch)||[];
        if(cands.some(c=>c._f!==r._f && prodIguais(c,r))){ dups++; return; }
        cands.push(r); idx.set(ch,cands);
      }
      out.push(r);
    });
  });
  PROD.linhas=out; PROD.dupX=dups;
}
async function prodTogFonte(id){
  const F=PROD.F; const a=F.fontes.slice(); const i=a.indexOf(id);
  if(i>=0){ if(a.length===1){ prodStatus('Mantenha ao menos uma fonte selecionada.'); return; } a.splice(i,1); } else a.push(id);
  const ant=F.fontes; F.fontes=a;
  try{ prodStatus('⏳ Carregando fonte…'); await prodGarantirLinhas(); }catch(e){ F.fontes=ant; prodStatus('⚠️ '+e.message); return; }
  prodRecompor(); PROD.pag=0; prodMontar(true);
}

function prodBoxComparativo(rows){
  const F=PROD.F; const nF=new Set(rows.map(r=>r._f)).size; const anos=new Set(rows.filter(r=>r.data).map(r=>r.data.slice(0,4))).size;
  if(nF<2 && anos<2) return '';
  const g=F.cmpGrupo || (nF>1?'fonte':'ano');
  return `<div class="pd-box" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h3 style="margin:0">↔️ Comparativo</h3>
    <div style="display:flex;gap:8px;align-items:center;font-size:12px"><label style="margin:0">Comparar por</label><select id="pc-grupo" style="width:auto"><option value="fonte" ${g==='fonte'?'selected':''}>Fonte (planilha)</option><option value="ano" ${g==='ano'?'selected':''}>Ano</option><option value="mes" ${g==='mes'?'selected':''}>Mês</option></select></div></div>
    <p style="font-size:12px;color:#666;margin:6px 0 8px">Indicadores que existem nos dois lados são comparados; onde a planilha não tem a coluna aparece “—” (não é zero, é “sem lançamento”). Respeita os filtros acima.</p>
    <div class="pd-tb" style="max-height:420px">${prodTabelaComparativa(rows,g)}</div></div>`;
}
function prodTabelaComparativa(rows,g){
  const chave=r=>g==='fonte'?String(r._f):g==='ano'?(r.data||'').slice(0,4):(r.data||'').slice(0,7);
  const rot=c=>g==='fonte'?prodNomeFonte(c==='atual'?'atual':+c):g==='mes'?prodMesNome(c):c;
  const grp={}; rows.forEach(r=>{ if(!r.data) return; (grp[chave(r)]=grp[chave(r)]||[]).push(r); });
  let cols=Object.keys(grp); if(g==='fonte'){ const ord=['atual',...PROD.fontes.map(f=>String(f.id))]; cols.sort((a,b)=>ord.indexOf(a)-ord.indexOf(b)); } else cols.sort();
  if(cols.length<2) return '<p style="color:#888">Selecione mais de um '+(g==='fonte'?'fonte':g==='ano'?'ano':'mês')+' no período para comparar.</p>';
  const ks=['reg','t','at','mi','dro','coc','crp','mb','kgt','din','fg','ar','mu','au','cv','apv','vap','vr','avr','pre'];
  let parcial=false;
  const cel=(c,k)=>{ const rs=grp[c]; if(!prodTemAlg(rs,k)) return null; const v=rs.reduce((a,r)=>a+prodVal(r,k),0);
    let p=false; if(PROD_COMPS[k]) p=PROD_COMPS[k].some(x=>!prodTemAlg(rs,x)); if(p) parcial=true; return {v,p}; };
  const linhas=ks.map(k=>{ const m=PROD_MK[k]; const vs=cols.map(c=>cel(c,k)); if(vs.every(x=>x===null)) return '';
    const ult=vs[vs.length-1], pen=vs[vs.length-2]; let var_='—';
    if(ult&&pen&&!ult.p&&!pen.p){ if(pen.v===0) var_=ult.v===0?'=':'novo'; else { const pc=(ult.v-pen.v)/pen.v*100; var_=`<span class="${pc>0.5?'pd-up':pc<-0.5?'pd-dn':'pd-eq'}">${pc>0.5?'▲':pc<-0.5?'▼':'='} ${Math.abs(pc).toLocaleString('pt-BR',{maximumFractionDigits:0})}%</span>`; } }
    return `<tr><td>${esc(m.l)}</td>${vs.map(x=>x===null?'<td class="n" style="color:#bbb" title="Sem coluna/lançamento nesta fonte">—</td>':`<td class="n">${prodNum(x.v,m.f)}${x.p?' *':''}</td>`).join('')}<td class="n">${var_}</td></tr>`; }).join('');
  return `<table><thead><tr><th>Indicador</th>${cols.map(c=>`<th class="n">${esc(rot(c))}</th>`).join('')}<th class="n">Var. (último × anterior)</th></tr></thead><tbody>${linhas}</tbody></table>${parcial?'<p style="font-size:11px;color:#888;margin:6px 0 0">* parcial: a fonte não tem todas as colunas que compõem este total.</p>':''}`;
}

function prodLibXlsx(){
  return new Promise(res=>{ if(window.XLSX) return res(true); const u=['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js']; let i=0;
    const t=()=>{ if(i>=u.length) return res(false); const s=document.createElement('script'); s.src=u[i++]; s.onload=()=>res(!!window.XLSX); s.onerror=t; document.head.appendChild(s); }; t(); });
}
function prodXlsxParaCsv(wb,aba){
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[aba],{header:1,raw:true,defval:''}); const pad=n=>String(n).padStart(2,'0');
  const cel=v=>{ let t; if(v instanceof Date){ const d=new Date(Math.round(v.getTime()/60000)*60000); t=pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes()); } else t=String(v==null?'':v); return /[",\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
  return rows.map(r=>r.map(cel).join(',')).join('\n');
}

// ================= COMPARATIVO DE PERIODOS (botao) =================
function prodCmpPer(p){
  if(p.t==='ano') return {de:p.v+'-01-01',ate:p.v+'-12-31',rot:p.v};
  if(p.t==='mes'){ const [y,m]=p.v.split('-'); return {de:p.v+'-01',ate:prodIso(new Date(+y,+m,0,12)),rot:prodMesNome(p.v)}; }
  return {de:p.de||'',ate:p.ate||'',rot:(p.de?prodDataBR(p.de):'início')+' a '+(p.ate?prodDataBR(p.ate):'hoje')};
}
function prodBase(pels){ return {de:'',ate:'',mes:'',ano:'',pels:pels||[],tipoPel:'',dow:[],cats:[],droga:'',busca:'',dup:'incluir',alerta:'todos',minDin:''}; }
function prodCmpCalc(){
  return PROD.CMP.per.map(p=>{ const d=prodCmpPer(p); const rows=prodFiltrar(Object.assign(prodBase(PROD.CMP.pels),{de:d.de,ate:d.ate})); return Object.assign(d,{rows,s:prodSoma(rows)}); });
}
function prodCmpCel(p,k){
  if(!p.rows.length || !prodTemAlg(p.rows,k)) return null;
  const pa = PROD_COMPS[k] ? PROD_COMPS[k].some(x=>!prodTemAlg(p.rows,x)) : false;
  return {v:p.s[k],p:pa};
}
function prodCmpVar(a,b){
  if(!a||!b||a.p||b.p) return '';
  if(b.v===0) return a.v===0?'<small class="pd-eq">=</small>':'<small class="pd-up">novo</small>';
  const pc=(a.v-b.v)/b.v*100; const c=pc>0.5?'pd-up':pc<-0.5?'pd-dn':'pd-eq';
  return `<small class="${c}">${pc>0.5?'▲':pc<-0.5?'▼':'='} ${Math.abs(pc).toLocaleString('pt-BR',{maximumFractionDigits:0})}%</small>`;
}
function prodCmpTabela(per){
  const itens=PROD_MET.filter(m=>PROD.CMP.itens.includes(m.k)); let parcial=false;
  const lin=itens.map(m=>{ const cs=per.map(p=>prodCmpCel(p,m.k)); if(cs.some(c=>c&&c.p)) parcial=true;
    return `<tr><td>${esc(m.l)}</td>${cs.map((c,i)=>c===null?'<td class="n" style="color:#bbb" title="Sem lançamento neste período/fonte">—</td>':`<td class="n">${prodNum(c.v,m.f)}${c.p?' *':''}${i>0?'<br>'+prodCmpVar(c,cs[i-1]):''}</td>`).join('')}</tr>`; }).join('');
  return `<table><thead><tr><th>Indicador</th>${per.map(p=>`<th class="n">${esc(p.rot)}<br><small style="font-weight:normal">${p.rows.length} reg.</small></th>`).join('')}</tr></thead><tbody>${lin}</tbody></table><p style="font-size:11px;color:#777;margin:6px 0 0">▲▼ = variação em relação ao período à esquerda. “—” = sem lançamento (não é zero).${parcial?' * parcial: a fonte não tem todas as colunas que compõem este total.':''}</p>`;
}
function prodCmpAbrir(){
  const L=PROD.linhas.filter(r=>r.data);
  const anos=[...new Set(L.map(r=>r.data.slice(0,4)))].sort(), meses=[...new Set(L.map(r=>r.data.slice(0,7)))].sort();
  PROD.CMPOP={anos,meses,pels:[...new Set(L.map(r=>r.pel||'(sem pelotão)'))].sort()};
  if(!PROD.CMP) PROD.CMP={itens:['t','dro','din'],pels:[],per: anos.length>=2 ? [{t:'ano',v:anos[anos.length-2]},{t:'ano',v:anos[anos.length-1]}] : [{t:'mes',v:meses[Math.max(0,meses.length-2)]},{t:'mes',v:meses[meses.length-1]}]};
  prodCmpRender();
}

     <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:12px">${itens.map(m=>`<div class="pd-box" style="margin:0"><h3 style="font-size:12.5px;margin:0 0 4px">${esc(m.l)}</h3><div style="position:relative;height:190px"><canvas id="cc-${m.k}"></canvas></div></div>`).join('')}</div>`:'<p style="color:#888">Selecione ao menos um item.</p>'}</div>`);
  const ov=document.getElementById('prod-fontes');

    const ci=e.target.closest('[data-ci]'); if(ci){ const k=ci.dataset.ci, i=C.itens.indexOf(k); if(i>=0) C.itens.splice(i,1); else C.itens.push(k); prodCmpRender(); return; }

    const rm=e.target.closest('[data-rm]'); if(rm){ e.preventDefault(); C.per.splice(+rm.dataset.rm,1); prodCmpRender(); }
  };
  ov.onchange=e=>{
    const t=e.target;
    if(t.dataset.pi!==undefined){ const [tp,v]=t.value.split(':'); const p=C.per[+t.dataset.pi]; if(tp==='per'){ p.t='per'; p.de=p.de||''; p.ate=p.ate||''; } else { p.t=tp; p.v=v; } prodCmpRender(); }
    else if(t.dataset.pd!==undefined){ C.per[+t.dataset.pd][t.dataset.w]=t.value; prodCmpRender(); }
  };
  itens.forEach(m=>{
    const dados=per.map(p=>{ const c=prodCmpCel(p,m.k); return c?c.v:null; });
    PROD.cmpCharts[m.k]=desenharGrafico('cc-'+m.k,{type:'bar',data:{labels:per.map(p=>p.rot),datasets:[{data:dados,backgroundColor:per.map((_,i)=>PROD_CORES[i%PROD_CORES.length])}]},
      options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>prodNum(c.parsed.y,m.f)}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>prodNum(v,m.f)}}}}});
  });
}
function prodCmpPdf(){
  const per=prodCmpCalc(); const itens=PROD_MET.filter(m=>PROD.CMP.itens.includes(m.k)); if(!itens.length) return;
  let ov=document.getElementById('prod-overlay'); if(ov) ov.remove();
  const img=k=>{ const c=document.getElementById('cc-'+k); try{ return c&&c.toDataURL?`<img src="${c.toDataURL('image/png')}">`:''; }catch(e){ return ''; } };
  ov=document.createElement('div'); ov.id='prod-overlay'; ov.className='ov-print';
  ov.innerHTML=`<div class="nao-imprimir" style="position:sticky;top:0;z-index:2;background:#222;padding:10px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap">
    <button class="btn" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button><button class="btn secundario" onclick="prodFecharRel()">✖ Voltar</button>
    <span style="color:#ccc;font-size:12px">Na janela de impressão, escolha “Salvar como PDF”.</span></div>
   <div class="pd-folha"><h1>COMPARATIVO DE PERÍODOS – 4ª CIA PM IND GER</h1><div class="sub">${esc(per.map(p=>p.rot).join('  ×  '))}<br>Fontes: ${esc(prodNomesFontes().join(' + '))} · Pelotões: ${esc(PROD.CMP.pels.length?PROD.CMP.pels.join(', '):'todos')}<br>gerado em ${new Date().toLocaleString('pt-BR')}</div>
   <h2>Quadro comparativo</h2>${prodCmpTabela(per)}
   <h2>Gráficos</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8pt">${itens.map(m=>`<div style="break-inside:avoid"><b style="font-size:9pt">${esc(m.l)}</b>${img(m.k)}</div>`).join('')}</div></div>`;
  document.body.appendChild(ov); printPagina('size:A4 portrait;margin:8mm');
}

function gdoMesAdd(ym,n){ const [y,m]=ym.split('-').map(Number); const d=new Date(y,m-1+n,1,12); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function gdoRange(ini,fim){ return {de:ini+'-01', ate:prodIso(new Date(+fim.slice(0,4),+fim.slice(5,7),0,12))}; }
function gdoMesesLista(ini,fim){ const o=[]; let m=ini; while(m<=fim && o.length<24){ o.push(m); m=gdoMesAdd(m,1); } return o; }
function gdoFmt(v,f){ if(f==='r') return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}); return v.toLocaleString('pt-BR',{maximumFractionDigits:3}); }
function gdoRotPer(ini,fim){ const nm=m=>GDO_MESES[+m.slice(5,7)-1]; const y=m=>m.slice(2,4); return ini===fim ? nm(fim)+'/'+y(fim) : nm(ini).slice(0,3)+'/'+y(ini)+' a '+nm(fim).slice(0,3)+'/'+y(fim); }
function gdoCalc(ini,fim,pels){
  const rowsPer=(a,b)=>{ const r=gdoRange(a,b); return prodFiltrar(Object.assign(prodBase(pels),{de:r.de,ate:r.ate})); };
  const meses=gdoMesesLista(ini,fim);
  const porMes={}; meses.forEach(m=>{ const rs=rowsPer(m,m); porMes[m]={rows:rs,s:prodSoma(rs)}; });
  const rs=rowsPer(ini,fim); return {meses,porMes,rows:rs,s:prodSoma(rs)};

function gdoTabela(D,vars){

    return `<tr><td class="l">${esc(l)}</td>${cs.map(c=>`<td>${c===null?'<span class="nd">—</span>':gdoFmt(c,f)}</td>`).join('')}<td class="t">${tot===null?'—':gdoFmt(tot,f)}</td>${vc}</tr>`; }).join('');

// carrega bibliotecas externas sob demanda (Leaflet e vis-network) com alternativa de CDN
function infLib(nome){
  const L = { leaflet:{ test:()=>window.L&&window.L.map, css:['https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'], js:['https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'] },
              vis:{ test:()=>window.vis&&window.vis.Network, js:['https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js','https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js'] } }[nome];
  if(L.test()) return Promise.resolve(true);
  if(INF['_p'+nome]) return INF['_p'+nome];
  const carrega=(tag,url)=>new Promise(res=>{ const e=document.createElement(tag); if(tag==='script'){ e.src=url; } else { e.rel='stylesheet'; e.href=url; } e.onload=()=>res(true); e.onerror=()=>res(false); document.head.appendChild(e); });
  INF['_p'+nome] = (async()=>{
    if(L.css){ for(const u of L.css){ if(await carrega('link',u)) break; } }
    for(const u of L.js){ if(await carrega('script',u) && L.test()) return true; }
    INF['_p'+nome]=null; return false;
  })();
  return INF['_p'+nome];
}

let _infGeoUlt = 0;
async function infGeocodificar(q){
  q = String(q||'').trim(); if(!q) return [];
  let cache={}; try{ cache=JSON.parse(localStorage.getItem('bi4cia_inf_geo')||'{}'); }catch(e){}
  if(cache[q]) return cache[q];
  const esp = Math.max(0, 1100-(Date.now()-_infGeoUlt)); if(esp) await new Promise(r=>setTimeout(r,esp)); _infGeoUlt=Date.now();
  const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&countrycodes=br&viewbox=-43.75,-21.45,-43.0,-22.05&q='+encodeURIComponent(q);
  const r = await fetch(url, {headers:{'Accept-Language':'pt-BR'}});
  if(!r.ok) throw new Error('Serviço de mapas indisponível ('+r.status+')');
  const j = (await r.json()).map(x=>({lat:+x.lat, lng:+x.lon, nome:x.display_name, bairro:(x.address&&(x.address.suburb||x.address.neighbourhood||x.address.quarter||x.address.city_district))||''}));
  try{ cache[q]=j; const ks=Object.keys(cache); if(ks.length>200) delete cache[ks[0]]; localStorage.setItem('bi4cia_inf_geo', JSON.stringify(cache)); }catch(e){}
  return j;
}

// ---------- calculo (derivados, filtros, escore) ----------
function infRecalc(){
  const P=INF.pessoas, byId=new Map(P.map(p=>[p.id,p]));
  const adj=new Map(P.map(p=>[p.id,[]])); const sup=new Map(), sub=new Map();
  INF.vinculos.forEach(v=>{ if(!byId.has(v.a_id)||!byId.has(v.b_id)) return; adj.get(v.a_id).push(v); adj.get(v.b_id).push(v);
    if(infEhSub(v.tipo) && v.a_superior){ sub.set(v.a_id,(sub.get(v.a_id)||0)+1); sup.set(v.b_id,(sup.get(v.b_id)||0)+1); } });
  const regs=new Map(), locs=new Map(); INF.registros.forEach(r=>{ (regs.get(r.pessoa_id)||regs.set(r.pessoa_id,[]).get(r.pessoa_id)).push(r); });
  INF.locais.forEach(l=>{ (locs.get(l.pessoa_id)||locs.set(l.pessoa_id,[]).get(l.pessoa_id)).push(l); });
  const dduById=new Map(INF.ddus.map(x=>[x.id,x])); const ddusDe=new Map();
  INF.ddupes.forEach(l=>{ const dd=dduById.get(l.ddu_id); if(!dd||!byId.has(l.pessoa_id)) return; (ddusDe.get(l.pessoa_id)||ddusDe.set(l.pessoa_id,[]).get(l.pessoa_id)).push({...dd,_link:l}); });
  ddusDe.forEach(a=>a.sort((x,y)=>String(x.data_criacao||'').localeCompare(String(y.data_criacao||''))));
  INF.cache={byId,adj,sub,sup,regs,locs,ddusDe,dduById,score:new Map()};
  P.forEach(p=>INF.cache.score.set(p.id, infScoreCalc(p)));
}
// crimes de uma pessoa: tipo -> quantidade (registros; etiquetas do perfil contam 1 se nao houver registro daquele tipo)
function infCrimesDe(p, de, ate){
  const m={}; (INF.cache.regs.get(p.id)||[]).forEach(r=>{ if(de && r.data && r.data<de) return; if(ate && r.data && r.data>ate) return; if((de||ate)&&!r.data) return; m[r.crime]=(m[r.crime]||0)+1; });
  if(!de && !ate) (p.crimes||[]).forEach(c=>{ if(!m[c]) m[c]=1; });
  return m;
}
function infScoreCalc(p){
  const w=INF.pesos, cr=infCrimesDe(p); let g=0, n=0; Object.keys(cr).forEach(c=>{ g+=infPesoCrime(c)*(1+Math.log2(cr[c])); n+=cr[c]; });
  const grau=(INF.cache.adj.get(p.id)||[]).length, ns=INF.cache.sub.get(p.id)||0;
  const comp={ gravidade:Math.min(1,g/30), reincidencia:Math.min(1,n/6),
    hierarquia: p.faccao ? (p.nivel ? (6-Math.min(5,p.nivel))/5 : .3) : (p.nivel ? (6-Math.min(5,p.nivel))/8 : 0),
    rede:Math.min(1,(grau+2*ns)/10), denuncias:Math.min(1,((INF.cache.ddusDe.get(p.id)||[]).length)/4), risco:((p.risco||1)-1)/4, situacao:{solto:1,foragido:1,monitorado:.7,preso:.2,morto:0}[p.status||'solto'] };
  const tw=Object.values(w).reduce((a,b)=>a+(+b||0),0)||1; let tot=0; Object.keys(comp).forEach(k=>{ tot+=(+w[k]||0)*comp[k]; });
  if(p.status==='morto') tot=0;
  return {total:Math.round(tot/tw*1000)/10, comp, n, grau, ns};
}
const infScore = p => INF.cache.score.get(p.id) || {total:0,comp:{},n:0,grau:0,ns:0};

function infBFS(foco, prof){
  const vis=new Set([foco]); let front=[foco];
  for(let d=0; d<prof && front.length; d++){ const nx=[]; front.forEach(id=>{ (INF.cache.adj.get(id)||[]).forEach(v=>{ const o=v.a_id===id?v.b_id:v.a_id; if(!vis.has(o)){ vis.add(o); nx.push(o); } }); }); front=nx; }
  return vis;
}
function infPassa(p, F, foco){
  const c=INF.cache;
  if(foco && !foco.has(p.id)) return false;
  if(F.busca){ const q=infNorm(F.busca); if(!infNorm([p.nome,p.alcunha,p.documento,p.mae,p.endereco,p.obs,(p.tags||[]).join(' '),(c.ddusDe.get(p.id)||[]).map(d=>d.protocolo).join(' ')].join(' ')).includes(q)) return false; }
  if(F.ddu){ const q=F.ddu.replace(/\s+/g,''); if(!(c.ddusDe.get(p.id)||[]).some(d=>String(d.protocolo).includes(q))) return false; }
  if(F.dduq){ const n=(c.ddusDe.get(p.id)||[]).length; if(F.dduq==='com'&&n<1) return false; if(F.dduq==='sem'&&n>0) return false; if(F.dduq==='2'&&n<2) return false; if(F.dduq==='3'&&n<3) return false; }
  if(F.area && p.area!==F.area) return false;
  if(F.bairro && p.bairro!==F.bairro) return false;
  if(F.faccao==='__sim' && !p.faccao) return false; if(F.faccao==='__nao' && p.faccao) return false; if(F.faccao && !F.faccao.startsWith('__') && p.faccao!==F.faccao) return false;
  if(F.status && p.status!==F.status) return false;
  if(F.nivel && String(p.nivel||'')!==String(F.nivel)) return false;
  if(F.risco && (p.risco||1)<+F.risco) return false;
  const g=(c.adj.get(p.id)||[]).length; if(F.vinc==='com' && !g) return false; if(F.vinc==='sem' && g) return false;
  if(F.crime || F.de || F.ate){ const cr=infCrimesDe(p,F.de,F.ate); if(F.crime ? !cr[F.crime] : !Object.keys(cr).length) return false; }
  if(F.atua){ const b=new Set(); (c.locs.get(p.id)||[]).forEach(l=>{ if(l.bairro) b.add(l.bairro); }); (c.regs.get(p.id)||[]).forEach(r=>{ if(r.bairro) b.add(r.bairro); }); if(!b.has(F.atua)) return false; }
  return true;
}
// conjunto filtrado: pessoas que passam + (opcional) vizinhos diretos para exibir a rede
function infConjunto(){
  const F=INF.F; const foco = F.foco ? infBFS(+F.foco, +F.prof||1) : null;
  const lista = INF.pessoas.filter(p=>infPassa(p,F,foco)); const ids=new Set(lista.map(p=>p.id)); const vis=new Set(ids);
  if(F.vizinhos) lista.forEach(p=>(INF.cache.adj.get(p.id)||[]).forEach(v=>{ vis.add(v.a_id); vis.add(v.b_id); }));
  return {lista, ids, vis};
}

  const {lista}=infConjunto(); const o=INF.ord; const F=INF.F;
  const val=(p)=> o.k==='score'?infScore(p).total : o.k==='nome'?infNorm(p.nome) : o.k==='risco'?(p.risco||1) : o.k==='nivel'?(p.nivel||99) : o.k==='grau'?infScore(p).grau : o.k==='ddu'?(INF.cache.ddusDe.get(p.id)||[]).length : o.k==='crimes'?infScore(p).n : infNorm(p[o.k]||'');
  const L=lista.slice().sort((a,b)=>{ const x=val(a),y=val(b); return (x>y?1:x<y?-1:0)*o.d || a.id-b.id; });
  const PP=40, np=Math.max(1,Math.ceil(L.length/PP)); if(INF.pag>=np) INF.pag=np-1; const pg=L.slice(INF.pag*PP, INF.pag*PP+PP);
  const th=(k,l)=>`<th data-o="${k}">${l}${o.k===k?(o.d>0?' ▲':' ▼'):''}</th>`;
  c.innerHTML=`<div class="if-box"><div style="font-size:12px;color:#666;margin-bottom:6px"><b>${L.length}</b> de ${INF.pessoas.length} cadastrados</div>
   <div class="if-tb"><table><thead><tr>${th('nome','Nome / alcunha')}${th('faccao','Facção')}${th('nivel','Nível')}${th('status','Situação')}${th('risco','Risco')}${th('bairro','Bairro')}${th('area','Área')}<th>Crimes</th>${th('ddu','DDU')}${th('grau','Vínculos')}${th('score','Prioridade')}</tr></thead><tbody>
   ${pg.map(p=>{ const s=infScore(p); const cr=Object.keys(infCrimesDe(p,F.de,F.ate)); const nv=INF.cat.niveis.find(n=>n[0]===p.nivel);
     return `<tr class="cl" data-id="${p.id}"><td><b>${esc(p.nome)}</b>${p.alcunha?`<div style="color:#777">“${esc(p.alcunha)}”</div>`:''}</td>
      <td>${p.faccao?`<span class="if-b" style="background:${infCorFaccao(p.faccao)}">${esc(p.faccao)}</span>${p.faccao_funcao?`<div style="color:#777;font-size:11px">${esc(p.faccao_funcao)}</div>`:''}`:'<span style="color:#aaa">—</span>'}</td>
      <td title="${esc(nv?nv[1]:'')}">${p.nivel||'—'}${p.cargo?`<div style="color:#777;font-size:11px">${esc(p.cargo)}</div>`:''}</td><td>${infBadge(p.status)}</td><td>${infRiscoHtml(p.risco)}</td>
      <td>${esc(p.bairro||'')}${p.lat?' 📍':''}</td><td>${esc(p.area||'')}</td><td style="max-width:240px">${cr.slice(0,4).map(x=>`<span class="if-chip">${esc(x)}</span>`).join('')}${cr.length>4?`<span class="if-chip">+${cr.length-4}</span>`:''}</td>
      <td style="text-align:center" title="${esc((INF.cache.ddusDe.get(p.id)||[]).map(d=>d.protocolo).join(', '))}">${(INF.cache.ddusDe.get(p.id)||[]).length||'—'}</td><td style="text-align:center">${s.grau||'—'}</td><td><b>${s.total.toLocaleString('pt-BR',{maximumFractionDigits:1})}</b></td></tr>`; }).join('')||'<tr><td colspan="11" style="color:#888">Nenhum infrator para os filtros escolhidos.</td></tr>'}
   </tbody></table></div>
   <div style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px"><button class="btn secundario if-sm" id="if-ant" ${INF.pag<=0?'disabled':''}>‹</button> Página ${INF.pag+1} de ${np} <button class="btn secundario if-sm" id="if-prox" ${INF.pag>=np-1?'disabled':''}>›</button></div></div>`;
  c.querySelectorAll('th[data-o]').forEach(t=>t.onclick=()=>{ const k=t.dataset.o; INF.ord=INF.ord.k===k?{k,d:-o.d}:{k,d:(k==='score'||k==='risco'||k==='grau'||k==='ddu'?-1:1)}; infCorpo(); });
  c.querySelectorAll('tr.cl').forEach(t=>t.onclick=()=>infFicha(+t.dataset.id));
  document.getElementById('if-ant').onclick=()=>{INF.pag--;infCorpo();}; document.getElementById('if-prox').onclick=()=>{INF.pag++;infCorpo();};
}
function infCsv(){
  const {lista}=infConjunto(); const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const head=['ID','Nome','Alcunha','Nascimento','Documento','Mãe','Telefone','Endereço','Bairro','Cidade','Área','Latitude','Longitude','Facção','Função na facção','Nível','Cargo','Situação','Risco','Crimes','Vínculos','Prioridade','Etiquetas','Observações'];
  const lin=lista.map(p=>{ const s=infScore(p); return [p.id,p.nome,p.alcunha,infDataBR(p.nascimento),p.documento,p.mae,p.telefone,p.endereco,p.bairro,p.cidade,p.area,p.lat,p.lng,p.faccao,p.faccao_funcao,p.nivel,p.cargo,INF_STATUS[p.status]||p.status,p.risco,Object.keys(infCrimesDe(p)).join(' | '),s.grau,String(s.total).replace('.',','),(p.tags||[]).join(' | '),p.obs].map(q).join(';'); });
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+head.map(q).join(';')+'\n'+lin.join('\n')],{type:'text/csv;charset=utf-8'})); a.download='infratores-'+new Date().toISOString().slice(0,10)+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}

// ---------- ficha (cadastro/edicao de um individuo) ----------
let INF_FICHA = {id:null, aba:'dados', sel:{crimes:[]}};
function infFicha(id, aba){
  INF_FICHA.id=id; INF_FICHA.aba=aba||'dados';
  let ov=document.getElementById('inf-ficha'); if(!ov){ ov=document.createElement('div'); ov.id='inf-ficha'; ov.className='if-ov'; document.body.appendChild(ov); }
  const p = id ? INF.cache.byId.get(id) : null;
  if(id && !p){ ov.remove(); return; }
  INF_FICHA.sel.crimes = p ? (p.crimes||[]).slice() : [];
  const ed=INF.podeEditar; const tabs=[['dados','Dados'],['vinc','Vínculos'+(p?` (${(INF.cache.adj.get(p.id)||[]).length})`:'')],['loc','Locais de atuação'+(p?` (${(INF.cache.locs.get(p.id)||[]).length})`:'')],['reg','Registros de crimes'+(p?` (${(INF.cache.regs.get(p.id)||[]).length})`:'')],['ddu','DDU / Denúncias'+(p?` (${(INF.cache.ddusDe.get(p.id)||[]).length})`:'')]];
  ov.innerHTML=`<div class="if-ovbox"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
     <h3 style="margin:0">${p?esc(infNomeExib(p)):'Novo infrator'} ${p?infBadge(p.status):''}</h3>
     <div style="display:flex;gap:6px;flex-wrap:wrap">${p?`<button class="btn secundario if-sm" id="iff-teia">🕸️ Ver rede</button><button class="btn secundario if-sm" id="iff-mapa">🗺️ Ver no mapa</button><button class="btn secundario if-sm" id="iff-print">🖨️ Ficha</button>`:''}${p&&ed?'<button class="btn perigo if-sm" id="iff-del">Excluir</button>':''}<button class="btn secundario if-sm" id="iff-x">✖ Fechar</button></div></div>
     <div class="if-tabs">${tabs.map(([k,l])=>`<span class="if-tab ${INF_FICHA.aba===k?'on':''}" data-ab="${k}" ${!p&&k!=='dados'?'style="opacity:.4;pointer-events:none"':''}>${l}</span>`).join('')}</div>
     <div id="iff-corpo"></div></div>`;
  ov.querySelectorAll('[data-ab]').forEach(e=>e.onclick=()=>{ INF_FICHA.aba=e.dataset.ab; infFicha(id,e.dataset.ab); });
  document.getElementById('iff-x').onclick=infFecharFicha;
  if(p){
    document.getElementById('iff-teia').onclick=()=>{ infFecharFicha(); INF.F.foco=String(p.id); INF.sub='teia'; infRender(); };
    document.getElementById('iff-mapa').onclick=()=>{ infFecharFicha(); INF.F.foco=String(p.id); INF.sub='mapa'; infRender(); };
    document.getElementById('iff-print').onclick=()=>infImprimirFicha(p.id);
    const d=document.getElementById('iff-del'); if(d) d.onclick=async()=>{ if(!confirm(`Excluir ${p.nome} e todos os vínculos, locais e registros dele? Isso não pode ser desfeito.`)) return; try{ await apiInf('infExcluir',{entidade:'pessoa',id:p.id}); infFecharFicha(); await infCarregar(); infRender(); infToast('Excluído.'); }catch(e){ infToast(e.message,true); } };
  }
  ({dados:infFichaDados,vinc:infFichaVinc,loc:infFichaLoc,reg:infFichaReg,ddu:infFichaDdu})[INF_FICHA.aba](document.getElementById('iff-corpo'), p);
}
function infFecharFicha(){ const o=document.getElementById('inf-ficha'); if(o) o.remove(); }
async function infAposSalvar(id,aba){ await infCarregar(); infRender(); if(document.getElementById('inf-ficha')) infFicha(id,aba); }
