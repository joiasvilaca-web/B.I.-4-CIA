<style>
:root{
  --preto:#161513; --khaki:#b8a76a; --khaki-esc:#8f7f45; --bege:#f0ede2;
  --vermelho:#a4202a; --dourado:#e0b84a; --verde:#33502f;
  --ok:#3a7d44; --erro:#a4202a; --texto:#2c2a24;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bege);color:var(--texto)}
img.logo{display:block}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid #ccc4a8;border-radius:6px;width:100%;background:#fff}
label{font-size:12px;font-weight:600;color:#555;display:block;margin:10px 0 4px}
.btn{background:var(--verde);color:#fff;border:none;padding:9px 16px;border-radius:6px;font-weight:600;font-size:14px}
.btn:hover{background:#28401f}
.btn.secundario{background:#8a8368;color:#fff}
.btn.perigo{background:var(--erro);color:#fff}
.btn.dourado{background:var(--dourado);color:#3a2c00}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* LOGIN */
#tela-login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#161513,#2b2820 60%,#3a3222)}
.card-login{background:#fff;border-radius:14px;padding:36px 34px;width:360px;box-shadow:0 20px 50px rgba(0,0,0,.4);text-align:center}
.card-login img{width:110px;margin:0 auto 14px}
.card-login h1{font-size:17px;margin:0 0 2px;color:var(--preto)}
.card-login p{font-size:12px;color:#777;margin:0 0 20px}
#erro-login{color:var(--erro);font-size:13px;margin-top:10px;min-height:16px}

/* SHELL */
#app{display:none;min-height:100vh}
#shell{display:flex;min-height:100vh}
#sidebar{width:230px;background:var(--preto);color:var(--bege);flex-shrink:0;display:flex;flex-direction:column}
#sidebar .cab{padding:20px 16px;text-align:center;border-bottom:1px solid #3a382f}
#sidebar .cab img{width:64px;margin:0 auto 8px}
#sidebar .cab div{font-size:11px;line-height:1.3;color:var(--khaki)}
#menu{flex:1;padding:10px 0;overflow-y:auto}
.item-menu{display:flex;align-items:center;gap:10px;padding:11px 18px;color:var(--bege);font-size:14px;cursor:pointer;border-left:3px solid transparent}
.item-menu:hover{background:#232019}
.item-menu.ativo{background:#232019;border-left-color:var(--dourado);color:var(--dourado);font-weight:600}
.grupo-menu{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#7d765f;padding:14px 18px 4px}
#rodape-sidebar{padding:14px 16px;border-top:1px solid #3a382f;font-size:12px}
#rodape-sidebar .nome{color:var(--khaki);font-weight:600;margin-bottom:2px}
#rodape-sidebar .nivel{color:#8a8368;font-size:11px;margin-bottom:8px}
#sair{background:none;border:1px solid #5a5540;color:var(--bege);padding:6px 10px;border-radius:6px;font-size:12px;width:100%}
#sair:hover{background:#2a271f}

#conteudo{flex:1;padding:26px 32px;overflow-y:auto;max-height:100vh}
.topo-view{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.topo-view h2{margin:0;font-size:21px;color:var(--preto)}
.topo-view .sub{font-size:12px;color:#888;margin-top:2px}

/* DASHBOARD */
.cards-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:22px}
.card-resumo{background:#fff;border-radius:10px;padding:16px 18px;border-left:4px solid var(--khaki);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-resumo .num{font-size:26px;font-weight:700;color:var(--preto)}
.card-resumo .lbl{font-size:12px;color:#888;margin-top:2px}
.graficos{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:22px}
@media(max-width:900px){.graficos{grid-template-columns:1fr}}
.painel-box{background:#fff;border-radius:10px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.painel-box h3{margin:0 0 12px;font-size:14px;color:var(--preto)}
.filtros{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:16px;background:#fff;padding:14px 16px;border-radius:10px}
.filtros div{min-width:140px}
.filtros label{margin:0 0 3px}

table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
table th{background:#f4f1e6;text-align:left;padding:10px 12px;font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.3px}
table td{padding:10px 12px;font-size:13px;border-top:1px solid #eee}
table tr:hover td{background:#faf9f4}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.tag.P1{background:#e8e1c8;color:#6b5d1f}
.tag.P2{background:#dbe6d6;color:#33502f}
.tag.P3{background:#dde3ec;color:#2c4870}
.tag.P4{background:#ecdcdc;color:#7d2c2c}
.tag.P5{background:#e6dbec;color:#5a2c7d}

/* AREA */
.acoes-lista{display:flex;gap:8px}
.acoes-lista button{padding:5px 10px;font-size:12px;border-radius:5px;border:1px solid #ccc;background:#fff}
.acoes-lista button:hover{background:#f2f2f2}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(20,18,12,.55);z-index:50;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.overlay.aberto{display:flex}
.modal{background:#fff;border-radius:12px;padding:26px 28px;width:520px;max-width:100%}
.modal h3{margin:0 0 4px}
.modal .fechar{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:#999}
.linha-campos{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.anexos-lista{margin-top:8px}
.anexo-item{display:flex;justify-content:space-between;align-items:center;background:#f6f4ec;padding:7px 10px;border-radius:6px;margin-bottom:6px;font-size:13px}
.msg-modal{font-size:13px;margin-top:10px;min-height:16px}
.msg-modal.ok{color:var(--ok)}
.msg-modal.erro{color:var(--erro)}

/* ADMIN */
.tabs-admin{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid #ddd}
.tab-admin{padding:9px 16px;font-size:13px;cursor:pointer;color:#777;border-bottom:2px solid transparent}
.tab-admin.ativo{color:var(--preto);font-weight:600;border-bottom-color:var(--dourado)}
.select-acesso{padding:5px 8px;font-size:12px;border-radius:5px}
.grade-acessos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.grade-acessos div span{display:block;font-size:11px;font-weight:600;margin-bottom:3px;color:#666}
.campo-custom-linha{display:flex;gap:8px;align-items:center;background:#f6f4ec;padding:8px 10px;border-radius:6px;margin-bottom:6px}
.campo-custom-linha span{flex:1;font-size:13px}
.badge-status{padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-status.ativo{background:#dbeedb;color:var(--ok)}
.badge-status.inativo{background:#eee;color:#888}
.badge-status.bloqueado{background:#f7dada;color:var(--erro)}
.carregando{text-align:center;color:#999;padding:30px;font-size:13px}
.tabs-area{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid #ddd}
.tab-area{padding:9px 16px;font-size:13px;cursor:pointer;color:#777;border-bottom:2px solid transparent}
.tab-area.ativo{color:var(--preto);font-weight:600;border-bottom-color:var(--dourado)}
.box-ia{background:linear-gradient(135deg,#2c2a24,#3a3222);color:#f0ede2;border-radius:10px;padding:18px 20px;margin-bottom:18px}
.box-ia h3{margin:0 0 10px;font-size:13px;color:var(--dourado);display:flex;align-items:center;gap:6px}

<script>
const EDGE_URL = "https://wxiokmqnjtgbejgoepch.supabase.co/functions/v1/bi4cia-api";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4aW9rbXFuanRnYmVqZ29lcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMTE2NDgsImV4cCI6MjA4Nzc4NzY0OH0.F38uxHayhbNHGQC9-W0R1IonfJ-VtbK2ZJfS8vZshTc";
const NIVEIS = ["MASTER","P1","P2","P3","P4","P5","TROPA","VISITANTE"];
const AREAS = ["P1","P2","P3","P4","P5"];
const TIPOS_CAMPO = [["texto","Texto curto"],["textarea","Texto longo"],["numero","Número"],["data","Data"],["selecao","Seleção (opções)"]];

let ST = { token:null, usuario:null, nivelConfig:null, areasConfig:[], view:null, areaAtual:null, charts:{} };

function salvarSessaoLocal(){ localStorage.setItem('bi4cia_sessao', JSON.stringify({token:ST.token, exp:Date.now()+8*3600*1000})); }
function carregarSessaoLocal(){ try{ const s=JSON.parse(localStorage.getItem('bi4cia_sessao')||'null'); if(s && s.exp>Date.now()) return s.token; }catch(e){} return null; }

async function api(op, params={}){
  const r = await fetch(EDGE_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':ANON_KEY,'Authorization':'Bearer '+ANON_KEY},
    body: JSON.stringify({op, token: ST.token, ...params})
  });
  const d = await r.json();
  if(!d.ok){ throw new Error(d.erro || 'Erro desconhecido'); }
  return d;
}

function esc(s){ return (s===null||s===undefined) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtData(iso){ if(!iso) return ''; const d=new Date(iso); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function desenharGrafico(elId, config){
  const el = document.getElementById(elId);
  if(!el){ return; }
  if(typeof Chart === 'undefined'){
    el.outerHTML = '<p style="color:#a4202a;font-size:12px;padding:12px;background:#f7dada;border-radius:6px">⚠️ A biblioteca de gráficos não carregou (Chart.js). Isso costuma acontecer quando a rede bloqueia o endereço cdnjs.cloudflare.com. Peça ao setor de TI/rede pra liberar esse domínio, ou tente acessar de outra rede/celular pra confirmar.</p>';
    return;
  }
  try{ return new Chart(el, config); }
  catch(e){ el.outerHTML = `<p style="color:#a4202a;font-size:12px;padding:12px;background:#f7dada;border-radius:6px">⚠️ Erro ao desenhar o gráfico: ${esc(e.message)}</p>`; }
}
function fecharModal(){ document.getElementById('overlay').classList.remove('aberto'); document.getElementById('modal-corpo').innerHTML=''; }
function abrirModal(html){ document.getElementById('modal-corpo').innerHTML = html; document.getElementById('overlay').classList.add('aberto'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') fecharModal(); });

// ---------- LOGIN ----------
document.getElementById('form-login').addEventListener('submit', async e=>{
  e.preventDefault();
  const usuario = document.getElementById('li-usuario').value.trim();
  const senha = document.getElementById('li-senha').value;
  const elErro = document.getElementById('erro-login');
  elErro.textContent = '';
  try{
    const d = await api('login', {usuario, senha});
    ST.token = d.token; ST.usuario = d.usuario; ST.nivelConfig = d.nivelConfig;
    salvarSessaoLocal();
    await iniciarApp();
  }catch(err){ elErro.textContent = err.message; }
});

document.getElementById('sair').addEventListener('click', async ()=>{
  try{ await api('logout'); }catch(e){}
  localStorage.removeItem('bi4cia_sessao');
  location.reload();
});

async function tentarSessaoExistente(){
  const t = carregarSessaoLocal();
  if(!t) return false;
  ST.token = t;
  try{
    const d = await api('me');
    ST.usuario = d.usuario; ST.nivelConfig = d.nivelConfig;
    await iniciarApp();
    return true;
  }catch(e){ localStorage.removeItem('bi4cia_sessao'); return false; }
}

// ---------- APP SHELL ----------
async function iniciarApp(){
  document.getElementById('tela-login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('rs-nome').textContent = ST.usuario.nome;
  document.getElementById('rs-nivel').textContent = ST.usuario.nivel_base;
  const areasCfg = await api('areasConfig');
  ST.areasConfig = areasCfg.areas;
  montarMenu();
  const primeiraView = ST.usuario.nivel_base==='MASTER' || ST.nivelConfig?.ve_painel_geral ? 'dashboard' : (AREAS.find(a=>acessoDe(a)!=='none') || null);
  if(primeiraView) irPara(primeiraView); else document.getElementById('conteudo').innerHTML = '<p style="padding:30px;color:#888">Você não tem acesso a nenhuma área ainda. Procure a Administração.</p>';
}

function acessoDe(areaId){
  if(ST.usuario.nivel_base==='MASTER') return 'edit';
  return (ST.usuario.acessos||{})[areaId] || 'none';
}
function podeVerPainelGeral(){ return ST.usuario.nivel_base==='MASTER' || !!ST.nivelConfig?.ve_painel_geral; }
function isMaster(){ return ST.usuario.nivel_base==='MASTER'; }

function montarMenu(){
  let html = '';
  if(podeVerPainelGeral()){
    html += `<div class="item-menu" data-view="dashboard">📊 Painel Central</div>`;
  }
  html += `<div class="grupo-menu">Áreas</div>`;
  AREAS.forEach(a=>{
    if(acessoDe(a)==='none') return;
    const cfg = ST.areasConfig.find(c=>c.area_id===a);
    html += `<div class="item-menu" data-view="area:${a}">${cfg?.icone||'📁'} ${esc(cfg?.nome||a)}</div>`;
  });
  if(isMaster()){
    html += `<div class="grupo-menu">Sistema</div><div class="item-menu" data-view="admin">⚙️ Administração</div>`;
  }
  document.getElementById('menu').innerHTML = html;
  document.querySelectorAll('.item-menu').forEach(el=>el.addEventListener('click', ()=>irPara(el.dataset.view)));
}

function marcarMenuAtivo(view){
  document.querySelectorAll('.item-menu').forEach(el=> el.classList.toggle('ativo', el.dataset.view===view));
}

async function irPara(view){
  ST.view = view; marcarMenuAtivo(view);
  const c = document.getElementById('conteudo');
  c.innerHTML = '<div class="carregando">Carregando…</div>';
  if(view==='dashboard') return renderDashboard();
  if(view.startsWith('area:')) return renderArea(view.split(':')[1]);
  if(view==='admin') return renderAdmin();
}

// ---------- DASHBOARD ----------
async function renderDashboard(filtros={}){
  const c = document.getElementById('conteudo');
  let d;
  try{ d = await api('dashboard', filtros); }
  catch(e){ c.innerHTML = `<p style="color:red">${esc(e.message)}</p>`; return; }

  if(d.semAcesso){ c.innerHTML = '<p style="padding:20px;color:#888">Sem áreas liberadas para visualização.</p>'; return; }

  const nomeArea = id => ST.areasConfig.find(a=>a.area_id===id)?.nome || id;
  const meses = Object.keys(d.porMes).sort();
  const areasOrdenadas = AREAS.filter(a=>d.areasIncluidas.includes(a));
  const semDados = d.total === 0;

  c.innerHTML = `
    <div class="topo-view"><div><h2>Painel Central</h2><div class="sub">Visão consolidada — ${d.areasIncluidas.join(', ')}</div></div></div>
    ${d.insight ? `<div class="box-ia"><h3>🤖 Análise da IA</h3><div class="txt">${esc(d.insight.texto)}</div><div class="quando">Gerado em ${fmtData(d.insight.gerado_em)}</div></div>` : ''}
    <div class="filtros">
      <div><label>Data início</label><input type="date" id="f-inicio"></div>
      <div><label>Data fim</label><input type="date" id="f-fim"></div>
      <div><button class="btn secundario" id="f-aplicar">Filtrar</button></div>
      <div><button class="btn dourado" id="f-limpar">Limpar</button></div>
    </div>
    <div class="cards-resumo">
      <div class="card-resumo"><div class="num">${d.total}</div><div class="lbl">Registros no período</div></div>
      ${areasOrdenadas.map(a=>`<div class="card-resumo"><div class="num">${d.porArea[a]||0}</div><div class="lbl">${esc(nomeArea(a))}</div></div>`).join('')}
    </div>
    <div class="graficos">
      <div class="painel-box"><h3>Lançamentos por mês</h3>${semDados ? '<p style="color:#999;font-size:13px;padding:20px 0">Nenhum lançamento ainda — o gráfico aparece assim que a primeira área lançar dados.</p>' : '<canvas id="graf-mes" height="140"></canvas>'}</div>
      <div class="painel-box"><h3>Distribuição por área</h3>${semDados ? '<p style="color:#999;font-size:13px;padding:20px 0">Sem lançamentos no período selecionado.</p>' : '<canvas id="graf-area" height="140"></canvas>'}</div>
    </div>
    <div class="painel-box">

const ESCALA_URL = "https://wxiokmqnjtgbejgoepch.supabase.co/functions/v1/bi4cia-escala";
async function apiEscala(op, params={}){
  const r = await fetch(ESCALA_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':ANON_KEY,'Authorization':'Bearer '+ANON_KEY},
    body: JSON.stringify({op, token: ST.token, ...params})
  });
  const d = await r.json();
  if(!d.ok){ throw new Error(d.erro || 'Erro desconhecido'); }
  return d;
}

// dias[i] = {data:'YYYY-MM-DD', blocos:[], texto, editando, editado}; p2['YYYY-MM'] = {horario, dias:{'3':[{nome,patente}]}}
let ESC = { dias:[], p2:{}, pendentes:[], avisos:[], acesso:'view' };

function escHoras(turno){
  const m = String(turno||'').match(/\d{1,2}:\d{2}(?::\d{2})?/g) || [];
  const t = m.map(x=>{ const p=x.split(':').map(Number); return {h:p[0], m:p[1], s:p[2]||0}; });
  if(!t.length) return null;
  const ini = (/^\s*\(/.test(String(turno)) && t.length>=3) ? t[1] : t[0];
  const fim = t[t.length-1];
  return {ini, fim};
}
function escFmt(t, arred){
  let h=t.h, m=t.m;
  if(arred && t.s>=59){ m+=1; if(m>=60){ m=0; h=(h+1)%24; } }
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function escTitulo(escala){
  const m = String(escala||'').match(/\(([^()]*)\)\s*$/);
  let t = m ? m[1] : String(escala||'').split(' - ')[0];
  t = t.replace(/^\s*4\s*[ªa]?\s*CIA PM IND (GER|PE)\s*-\s*/i, '').trim();
  return t.toUpperCase();
}
function escFuncao(f){
  const s = String(f||'').trim();
  if(!s) return '';
  if(/intendente/i.test(s)) return '';
  if(/cmt?e?\s*guarni/i.test(s)) return 'Cmt Guarn.';
  if(/cmt?e?\s*pelot/i.test(s)) return 'Cmt Pelotão';
  if(/condutor/i.test(s)) return 'Condutor';
  if(/patrulheiro/i.test(s)) return 'Patrulheiro';
  return s;
}
function escOrdemFuncao(f){
  const s = String(f||'');
  if(/cmt?e?\s*(pelot|guarni)/i.test(s)) return 0;
  if(/patrulheiro/i.test(s)) return 1;
  if(/condutor/i.test(s)) return 2;
  return 3;
}
function escBase(m){
  const ng = (m.nome_guerra||'').trim();
  if(ng) return ng.toUpperCase();
  const partes = String(m.nome_completo||'').trim().split(/\s+/).filter(Boolean);
  return (partes[partes.length-1]||'').toUpperCase();
}
// Equipes sem viatura que repetem exatamente os mesmos militares de uma equipe COM viatura (horário de apresentação) são descartadas
function escPrepararBlocos(blocos){
  const chave = eq => eq.militares.map(m=>m.matricula).filter(Boolean).sort().join(',');
  const comRec = new Set();
  blocos.forEach(b=>b.equipes.forEach(eq=>{ if(String(eq.recurso||'').trim()) comRec.add(chave(eq)); }));
  const out = [];
  blocos.forEach(b=>{
    const eqs = b.equipes.filter(eq=>{
      if(!eq.militares.length) return false;
      if(String(eq.recurso||'').trim()) return true;
      return !comRec.has(chave(eq));
    });
    if(eqs.length) out.push({...b, equipes:eqs});
  });
  return out;
}
function escP2Do(data){
  const m = String(data||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  const p2 = ESC.p2[m[1]+'-'+m[2]];
  if(!p2) return null;
  return { horario: p2.horario || '14:00 às 00:00', lista: (p2.dias && p2.dias[String(parseInt(m[3],10))]) || [] };
}
function escMontarTexto(dia){
  if(!dia || !dia.blocos || !dia.blocos.length) return '';
  let blocos = escPrepararBlocos(dia.blocos).map((b,i)=>({...b, idx:i, h:escHoras(b.turno), titulo:escTitulo(b.escala)}));
  const ini = b => b.h ? b.h.ini.h*60 + b.h.ini.m : 0;
  blocos.sort((a,b)=> ini(a)-ini(b) || a.idx-b.idx);

  // homônimos no mesmo dia: mostra primeiro nome + nome de guerra
  const uniq = {};
  blocos.forEach(b=>b.equipes.forEach(eq=>eq.militares.forEach(m=>{ uniq[m.matricula||m.nome_completo] = m; })));
  const porNome = {};
  Object.keys(uniq).forEach(k=>{ const n=escBase(uniq[k]); (porNome[n]=porNome[n]||new Set()).add(k); });
  const dups = new Set();
  Object.keys(uniq).forEach(k=>{ if(porNome[escBase(uniq[k])].size>1) dups.add(k); });
  const nomeExibir = m => {
    const base = escBase(m);
    if(dups.has(m.matricula||m.nome_completo)){
      const pn = String(m.nome_completo||'').trim().split(/\s+/)[0]||'';
      if(pn && !base.startsWith(pn.toUpperCase())) return pn.toUpperCase()+' '+base;
    }
    return base;
  };
  const linhaMil = m => {
    const f = escFuncao(m.funcao);
    return `${m.patente||''} ${nomeExibir(m)}${f ? ' ('+f+')' : ''}`.trim();
  };

  const L = [];
  if(dia.data){
    const [y,mo,d] = dia.data.split('-').map(Number);
    const dt = new Date(y, mo-1, d);
    const dd = String(d).padStart(2,'0')+'/'+String(mo).padStart(2,'0');
    const sem = dt.toLocaleDateString('pt-BR',{weekday:'long'}).toUpperCase();
    L.push('*4ªCIA PM IND GER*', `*ESCALA DIÁRIA ${dd}*`, `*${sem}*`, '');
  } else {
    L.push('*4ªCIA PM IND GER*', '*ESCALA DIÁRIA*', '');
  }

  const intend = blocos.filter(b=>/INTEND/.test(b.titulo));
  let intendFeito = false;
  blocos.forEach(b=>{
    if(/INTEND/.test(b.titulo)){
      if(intendFeito) return;
      intendFeito = true;
      const rec = (intend[0].equipes[0]||{}).recurso;
      L.push(`*INTENDÊNCIA${rec ? ' ('+rec+')' : ''}*`);
      L.push(intend.map(x=>{
        const dn = x.h ? (x.h.ini.h < 12 ? 'dia' : 'noite') : '';
        return x.h ? `${escFmt(x.h.ini)} às ${escFmt(x.h.fim,true)}${dn ? ' ('+dn+')' : ''}` : '';
      }).filter(Boolean).join(' / '));
      L.push('');
      intend.forEach(x=>{
        const rot = (x.h && x.h.ini.h >= 12) ? 'NOITE' : 'DIA';
        x.equipes.forEach(eq=>eq.militares.forEach(m=>L.push(`${rot} — ${linhaMil(m)}`)));
      });
      L.push('');
      return;
    }
    L.push(`*${b.titulo}*`);
    if(b.h) L.push(`${escFmt(b.h.ini)} às ${escFmt(b.h.fim,true)}`);
    L.push('');
    b.equipes.forEach(eq=>{
      L.push(String(eq.recurso||'').trim() || String(eq.equipe||'').trim());
      eq.militares.slice().sort((a,b)=>escOrdemFuncao(a.funcao)-escOrdemFuncao(b.funcao)).forEach(m=>L.push(linhaMil(m)));
      L.push('');
    });
  });

  // P2 (escala mensal da Seção de Inteligência) entra por último, abaixo da última equipe
  const p2 = escP2Do(dia.data);
  if(p2 && p2.lista.length){
    L.push('*EQUIPE P2*', p2.horario, '');
    p2.lista.forEach(m=>L.push(`${m.patente||'SGT'} ${m.nome}`));
    L.push('');
  }
  while(L.length && L[L.length-1]==='') L.pop();
  return L.join('\n');
}

function escLerArquivoBase64(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(String(r.result).split(',')[1]);
    r.onerror = ()=>reject(new Error('Não foi possível ler o arquivo'));
    r.readAsDataURL(file);
  });
}
function escCopiar(texto){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(texto);
  const ta = document.createElement('textarea'); ta.value = texto; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }finally{ ta.remove(); }
  return Promise.resolve();
}
function escRefazerNaoEditados(){
  ESC.dias.forEach(d=>{ if(!d.editado) d.texto = escMontarTexto(d); });
}
function escDiaTitulo(data){
  const m = String(data||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return 'Escala (sem data)';
  const dt = new Date(+m[1], +m[2]-1, +m[3]);
  return `${m[3]}/${m[2]} — ${dt.toLocaleDateString('pt-BR',{weekday:'long'})}`;
}

async function renderAreaEscala(areaId, acesso){
  ESC = { dias:[], p2:{}, pendentes:[], avisos:[], acesso };
  const box = document.getElementById('area-corpo');
  box.innerHTML = `
    <div class="filtros" style="align-items:flex-end">
      <div style="min-width:320px"><label>Anexe os PDFs da escala — pode escolher mais de um (relatório do SISP + escala mensal da P2)</label>
        <input type="file" id="esc-arq" accept="application/pdf,.pdf" multiple></div>
      <div><button class="btn" id="esc-gerar">Gerar resumo</button></div>
      <div><button class="btn secundario" id="esc-efetivo">👥 Efetivo / nomes de guerra</button></div>
    </div>
    <div id="esc-status" style="font-size:13px;color:#666;margin:8px 0;line-height:1.5"></div>
    <div id="esc-pend"></div>
    <div id="esc-saida"></div>`;
  document.getElementById('esc-efetivo').addEventListener('click', ()=>escAbrirEfetivo());
  document.getElementById('esc-gerar').addEventListener('click', escGerar);
}

async function escGerar(){
  const files = Array.from(document.getElementById('esc-arq').files || []);
  const st = document.getElementById('esc-status');
  if(!files.length){ st.style.color='#a4202a'; st.textContent='Escolha ao menos um PDF primeiro.'; return; }
  const btn = document.getElementById('esc-gerar'); btn.disabled = true;
  const linhas = [];
  const pintar = (extra)=>{ st.style.color='#555'; st.innerHTML = linhas.map(l=>`<div>${l}</div>`).join('') + (extra?`<div>${extra}</div>`:''); };
  for(let i=0;i<files.length;i++){
    const f = files[i];
    pintar(`⏳ Lendo ${i+1} de ${files.length}: ${esc(f.name)}… pode levar alguns segundos.`);
    try{
      const b64 = await escLerArquivoBase64(f);
      const d = await apiEscala('escalaProcessar', {base64:b64, content_type:'application/pdf'});
      if(d.tipo === 'p2_mensal'){
        const key = d.p2.ano+'-'+String(d.p2.mes).padStart(2,'0');
        ESC.p2[key] = d.p2;
        linhas.push(`✅ ${esc(f.name)} — escala mensal da P2 (${String(d.p2.mes).padStart(2,'0')}/${d.p2.ano})`);
        if((d.p2.nao_encontrados||[]).length) linhas.push(`⚠️ P2 sem cadastro no efetivo: ${esc(d.p2.nao_encontrados.join(', '))} (usei “SGT”). Cadastre em 👥 Efetivo.`);
      } else {
        const dia = { data: d.data || '', blocos: d.blocos, texto:'', editando:false, editado:false };
        const ja = ESC.dias.findIndex(x=>x.data===dia.data);
        if(ja>=0) ESC.dias[ja] = dia; else ESC.dias.push(dia);
        (d.pendentes||[]).forEach(p=>{ if(!ESC.pendentes.find(x=>x.matricula===p.matricula)) ESC.pendentes.push(p); });
        linhas.push(`✅ ${esc(f.name)} — escala diária ${esc(escDiaTitulo(dia.data))}`);
      }
    }catch(e){ linhas.push(`❌ ${esc(f.name)} — ${esc(e.message)}`); }
  }
  ESC.dias.sort((a,b)=>String(a.data).localeCompare(String(b.data)));
  escRefazerNaoEditados();
  ESC.pendentes = ESC.pendentes.filter(p=>ESC.dias.some(d=>d.blocos.some(b=>b.equipes.some(eq=>eq.militares.some(m=>m.matricula===p.matricula && !m.nome_guerra)))));
  pintar('');
  btn.disabled = false;
  escRenderSaida();
}

function escRenderSaida(){
  const pend = document.getElementById('esc-pend');
  const saida = document.getElementById('esc-saida');
  if(!pend || !saida) return;
  if(ESC.pendentes.length){
    pend.innerHTML = `<div style="background:#fff6d6;border:1px solid #e6cf72;border-radius:8px;padding:12px;margin:10px 0">
      <b>⚠️ ${ESC.pendentes.length} militar(es) sem nome de guerra cadastrado</b> — usei o último sobrenome no texto. Informe o nome de guerra para gravar e usar nas próximas escalas:
      ${ESC.pendentes.map((p,i)=>`<div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap">
        <span style="min-width:260px;font-size:13px">${esc(p.patente)} ${esc(p.nome_completo)}</span>
        <input type="text" id="esc-pg-${i}" value="${esc(escBase({nome_completo:p.nome_completo}))}" style="width:180px">
        <button class="btn secundario" onclick="escSalvarPendente(${i})" ${ESC.acesso==='edit'?'':'disabled title="Sem permissão de edição no P3"'}>Salvar</button>
      </div>`).join('')}
    </div>`;
  } else pend.innerHTML = '';
  if(!ESC.dias.length){ saida.innerHTML = ESC.p2 && Object.keys(ESC.p2).length ? '<p style="color:#666;font-size:13px">Escala da P2 carregada. Anexe também o relatório diário do SISP para gerar o resumo.</p>' : ''; return; }
  saida.innerHTML = ESC.dias.map((dia,i)=>{
    const linhas = dia.texto.split('\n').length;
    const p2 = escP2Do(dia.data);
    const mm = String(dia.data||'').match(/^(\d{4})-(\d{2})/);
    const dica = !p2 ? (mm ? `ℹ️ Para incluir os militares da P2, anexe também a escala mensal da P2 de ${mm[2]}/${mm[1]}.` : '')
      : (!p2.lista.length ? 'ℹ️ A escala mensal da P2 não tem ninguém escalado neste dia.' : '');
    return `<div style="margin:18px 0 28px">
      <h3 style="margin:0 0 6px">📅 ${esc(escDiaTitulo(dia.data))}</h3>
      ${dica ? `<div style="font-size:12px;color:#8a6d00;margin-bottom:6px">${esc(dica)}</div>` : ''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">
        <button class="btn secundario" onclick="escAcao(${i},'editar')">${dia.editando ? '✔️ Concluir edição' : '✏️ Editar'}</button>
        <button class="btn secundario" onclick="escAcao(${i},'refazer')">↻ Refazer texto</button>
        <button class="btn secundario" id="esc-b-copiar-${i}" onclick="escAcao(${i},'copiar')">📋 Copiar</button>
        <button class="btn" style="background:#25a244" onclick="escAcao(${i},'zap')">💬 Enviar por WhatsApp</button>
      </div>
      <textarea id="esc-texto-${i}" ${dia.editando?'':'readonly'} oninput="escDigitou(${i}, this.value)" rows="${Math.min(Math.max(linhas+1,8),40)}"
        style="width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.45;padding:12px;border:1px solid ${dia.editando?'#2c4870':'#ccc'};border-radius:8px;background:${dia.editando?'#fff':'#fafafa'}">${esc(dia.texto)}</textarea>
    </div>`;
  }).join('') + `<div style="font-size:12px;color:#888">Os trechos entre *asteriscos* ficam em negrito no WhatsApp. O botão verde abre o WhatsApp com o texto pronto — é só escolher a pessoa ou o grupo.</div>`;
}
function escDigitou(i, v){ const d = ESC.dias[i]; if(d){ d.texto = v; d.editado = true; } }
async function escAcao(i, acao){
  const dia = ESC.dias[i]; if(!dia) return;
  if(acao==='editar'){ dia.editando = !dia.editando; escRenderSaida(); if(dia.editando){ const t=document.getElementById('esc-texto-'+i); if(t) t.focus(); } }
  else if(acao==='refazer'){
    if(dia.editado && !confirm('Isso descarta as suas edições manuais deste dia e gera o texto de novo. Continuar?')) return;
    dia.texto = escMontarTexto(dia); dia.editado = false; dia.editando = false; escRenderSaida();
  }
  else if(acao==='copiar'){
    const b = document.getElementById('esc-b-copiar-'+i);
    try{ await escCopiar(dia.texto); if(b) b.textContent='✅ Copiado'; }catch(e){ if(b) b.textContent='Não consegui copiar'; }
    setTimeout(()=>{ const bb=document.getElementById('esc-b-copiar-'+i); if(bb) bb.textContent='📋 Copiar'; }, 1800);
  }
  else if(acao==='zap'){ window.open('https://wa.me/?text='+encodeURIComponent(dia.texto), '_blank'); }
}

function escAtualizarNomeGuerra(matricula, ng){
  ESC.dias.forEach(d=>d.blocos.forEach(b=>b.equipes.forEach(eq=>eq.militares.forEach(m=>{ if(m.matricula===matricula) m.nome_guerra = ng || null; }))));
}
async function escSalvarPendente(i){
  const p = ESC.pendentes[i]; if(!p) return;
  const ng = (document.getElementById('esc-pg-'+i).value||'').trim().toUpperCase();
  const st = document.getElementById('esc-status');
  if(!ng){ st.style.color='#a4202a'; st.textContent='Digite o nome de guerra.'; return; }
  try{
    await apiEscala('escalaEfetivoSalvar', {matricula:p.matricula, patente:p.patente, nome_completo:p.nome_completo, nome_guerra:ng});
    escAtualizarNomeGuerra(p.matricula, ng);
    ESC.pendentes.splice(i,1);
    const algumEditado = ESC.dias.some(d=>d.editado);
    escRefazerNaoEditados();
    st.style.color='#2a7a2a'; st.textContent = algumEditado ? 'Nome gravado. Nos dias que você editou, clique em ↻ Refazer texto para aplicar.' : 'Nome de guerra gravado.';
    escRenderSaida();
  }catch(e){ st.style.color='#a4202a'; st.textContent = e.message; }
}

async function escAbrirEfetivo(busca=''){
  abrirModal(`<h3 style="margin-top:0">👥 Efetivo — nomes de guerra</h3>
    <div style="display:flex;gap:8px;margin-bottom:10px"><input type="text" id="ef-busca" placeholder="Buscar por nome, nome de guerra ou matrícula" value="${esc(busca)}" style="flex:1"><button class="btn secundario" id="ef-buscar">Buscar</button></div>
    <div id="ef-lista" style="max-height:60vh;overflow:auto"><div class="carregando">Carregando…</div></div>
    <div style="text-align:right;margin-top:10px"><button class="btn secundario" onclick="fecharModal()">Fechar</button></div>`);
  document.getElementById('ef-buscar').addEventListener('click', ()=>escAbrirEfetivo(document.getElementById('ef-busca').value));
  try{
    const d = await apiEscala('escalaEfetivoListar', {busca});
    window.__EFETIVO = d.efetivo;
    const pode = ESC.acesso==='edit';
    document.getElementById('ef-lista').innerHTML = `<table><thead><tr><th>Patente</th><th>Nome completo</th><th>Nome de guerra</th><th></th></tr></thead><tbody>
      ${d.efetivo.map((p,i)=>`<tr><td>${esc(p.patente||'')}</td><td style="font-size:12px">${esc(p.nome_completo)}</td>
        <td><input type="text" id="ef-ng-${i}" value="${esc(p.nome_guerra||'')}" style="width:150px" ${pode?'':'disabled'}></td>
        <td>${pode?`<button class="btn secundario" onclick="escSalvarEfetivo(${i})">Salvar</button>`:''}</td></tr>`).join('') || '<tr><td colspan="4" style="color:#999">Nada encontrado</td></tr>'}
      </tbody></table>`;
  }catch(e){ document.getElementById('ef-lista').innerHTML = `<p style="color:#a4202a">${esc(e.message)}</p>`; }
}
async function escSalvarEfetivo(i){
  const p = (window.__EFETIVO||[])[i]; if(!p) return;
  const ng = (document.getElementById('ef-ng-'+i).value||'').trim();
  try{
    await apiEscala('escalaEfetivoSalvar', {matricula:p.matricula, patente:p.patente, nome_completo:p.nome_completo, nome_guerra:ng});
    escAtualizarNomeGuerra(p.matricula, ng ? ng.toUpperCase() : null);
    escRefazerNaoEditados();
    const b = document.getElementById('ef-ng-'+i); b.style.background = '#e4f5e4';
  }catch(e){ alert(e.message); }
}

async function renderAreaDashboard(areaId, cfg, filtros={}){
  const box = document.getElementById('area-corpo');
  let d;
  try{ d = await api('resumoArea', {area_id: areaId, dataInicio: filtros.dataInicio, dataFim: filtros.dataFim}); }
  catch(e){ box.innerHTML = `<p style="color:red">${esc(e.message)}</p>`; return; }
  const semDados = d.total === 0;
  const meses = Object.keys(d.porMes||{}).sort();
  box.innerHTML = `
    <div class="filtros">
      <div><label>De</label><input type="date" id="fd-inicio" value="${filtros.dataInicio||''}"></div>
      <div><label>Até</label><input type="date" id="fd-fim" value="${filtros.dataFim||''}"></div>
      <div><button class="btn secundario" id="fd-aplicar">Filtrar</button></div>
      <div><button class="btn dourado" id="fd-limpar">Limpar</button></div>
    </div>
    ${d.insight ? `<div class="box-ia"><h3>🤖 Análise da IA — ${esc(cfg?.nome||areaId)}</h3><div class="txt">${esc(d.insight.texto)}</div><div class="quando">Gerado em ${fmtData(d.insight.gerado_em)}</div></div>` : ''}
    <div class="cards-resumo"><div class="card-resumo"><div class="num">${d.total}</div><div class="lbl">Total de lançamentos</div></div>
    ${d.indicadoresNumericos.map(ind=>`<div class="card-resumo"><div class="num">${ind.soma.toLocaleString('pt-BR')}</div><div class="lbl">${esc(ind.label)} (soma) · méd. ${ind.media.toFixed(1)}</div></div>`).join('')}</div>
    <div class="graficos">
      <div class="painel-box"><h3>Lançamentos por mês</h3>${semDados ? '<p style="color:#999;font-size:13px;padding:20px 0">Nenhum lançamento no período — o gráfico aparece assim que houver dados.</p>' : '<canvas id="graf-area-mes" height="140"></canvas>'}</div>
      ${d.indicadoresCategoricos.map(ind=>`<div class="painel-box"><h3>${esc(ind.label)}</h3><canvas id="graf-cat-${ind.id}" height="140"></canvas></div>`).join('')}
    </div>
    ${d.indicadoresNumericos.length ? `<h3 style="margin:22px 0 12px;font-size:15px">Gráfico por indicador (evolução ao longo do tempo)</h3>
    <div class="graficos">
      ${d.indicadoresNumericos.map(ind=>`<div class="painel-box"><h3>${esc(ind.label)}</h3>${ind.serie.length ? `<canvas id="graf-serie-${ind.id}" height="140"></canvas>` : '<p style="color:#999;font-size:13px;padding:10px 0">Sem lançamentos com este campo preenchido ainda.</p>'}</div>`).join('')}
    </div>` : ''}
    ${!semDados && !d.indicadoresCategoricos.length && !d.indicadoresNumericos.length ? '<p style="color:#999;font-size:13px">Dica: cadastre campos do tipo "Número" ou "Seleção" em Administração → Configurar Áreas para ter um gráfico por indicador, além da contagem de lançamentos.</p>' : ''}
  `;
  document.getElementById('fd-aplicar').addEventListener('click', ()=>{
    filtroAreaDash = {dataInicio: document.getElementById('fd-inicio').value || undefined, dataFim: document.getElementById('fd-fim').value || undefined};
    renderAreaDashboard(areaId, cfg, filtroAreaDash);
  });
  document.getElementById('fd-limpar').addEventListener('click', ()=>{ filtroAreaDash = {}; renderAreaDashboard(areaId, cfg, {}); });

  const cores = ['#8f7f45','#33502f','#2c4870','#7d2c2c','#5a2c7d','#b8a76a','#3a7d44'];
  if(!semDados){
    desenharGrafico('graf-area-mes', {
      type:'line',
      data:{ labels: meses, datasets:[{label:'Lançamentos', data: meses.map(m=>d.porMes[m]), borderColor:'#b8a76a', backgroundColor:'rgba(184,167,106,.2)', fill:true, tension:.3}] },
      options:{ plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, ticks:{precision:0}}} }
    });
  }
  d.indicadoresCategoricos.forEach(ind=>{
    const labels = Object.keys(ind.contagem), valores = Object.values(ind.contagem);
    desenharGrafico('graf-cat-'+ind.id, { type:'doughnut', data:{ labels, datasets:[{data:valores, backgroundColor:cores}] }, options:{ plugins:{legend:{position:'bottom', labels:{boxWidth:12,font:{size:11}}}} } });
  });
  d.indicadoresNumericos.forEach((ind, i)=>{
    if(!ind.serie.length) return;
    desenharGrafico('graf-serie-'+ind.id, {
      type:'line',
      data:{ labels: ind.serie.map(p=>fmtData(p.x).split(' ')[0]), datasets:[{label: ind.label, data: ind.serie.map(p=>p.y), borderColor: cores[i%cores.length], backgroundColor: cores[i%cores.length]+'33', fill:true, tension:.3, pointRadius:4}] },
      options:{ plugins:{legend:{display:false}, tooltip:{callbacks:{title:(items)=>ind.serie[items[0].dataIndex].titulo}}}, scales:{y:{beginAtZero:true}} }
    });
  });
}

function campoInputHtml(campo, valor){
  const id = 'cc_'+campo.id;
  const v = valor===undefined||valor===null ? '' : valor;
  if(campo.tipo==='textarea') return `<textarea id="${id}" rows="3">${esc(v)}</textarea>`;
  if(campo.tipo==='numero') return `<input type="number" id="${id}" value="${esc(v)}">`;
  if(campo.tipo==='data') return `<input type="date" id="${id}" value="${esc(v)}">`;
  if(campo.tipo==='selecao') return `<select id="${id}">${(campo.opcoes||[]).map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  return `<input type="text" id="${id}" value="${esc(v)}">`;
}

let _anexoPendente = null; // {tipo, nome_original, base64, content_type} — só usado ao criar novo registro
function abrirFormRegistro(areaId, registro=null){
  _anexoPendente = null;
  const cfg = ST.areasConfig.find(a=>a.area_id===areaId);
  const campos = cfg?.campos || [];
  const dados = registro?.dados || {};
  abrirModal(`
    <button class="fechar" onclick="fecharModal()">×</button>
    <h3>${registro?'Editar':'Novo'} lançamento — ${esc(cfg?.nome||areaId)}</h3>
    ${!registro ? `
      <div class="zona-anexo-ia" id="zona-ia">
        <div id="zona-ia-texto">📎 Anexe foto, PDF ou planilha — foto e PDF a IA já lê e preenche o formulário automaticamente; planilha é só anexada</div>
        <input type="file" id="in-anexo-ia" accept="image/*,.pdf,.xls,.xlsx,.xlsm,.csv" style="margin-top:8px">
      </div>
      <div id="area-avisos-ia"></div>
    ` : ''}
    <label>Título</label><input type="text" id="rg-titulo" value="${esc(registro?.titulo||'')}">
    <label>Descrição</label><textarea id="rg-descricao" rows="3">${esc(registro?.descricao||'')}</textarea>
    ${campos.map(cp=>`<label>${esc(cp.label)}${cp.obrigatorio?' *':''}</label>${campoInputHtml(cp, dados[cp.id])}`).join('')}
    <div style="margin-top:18px;display:flex;gap:8px"><button class="btn" id="rg-salvar">Salvar</button><button class="btn secundario" onclick="fecharModal()">Cancelar</button></div>
    <div class="msg-modal" id="rg-msg"></div>
  `);

  const inAnexoIA = document.getElementById('in-anexo-ia');
  if(inAnexoIA) inAnexoIA.addEventListener('change', async ()=>{
    const f = inAnexoIA.files[0]; if(!f) return;
    const zona = document.getElementById('zona-ia'), txt = document.getElementById('zona-ia-texto');
    const nomeExt = (f.name.split('.').pop()||'').toLowerCase();
    const ehPlanilha = ['xls','xlsx','xlsm','csv'].includes(nomeExt) || f.type.includes('spreadsheet') || f.type.includes('ms-excel') || f.type==='text/csv';
    const tipo = ehPlanilha ? 'planilha' : (f.type.startsWith('image/') ? 'foto' : 'pdf');
    const reader = new FileReader();

    if(tipo === 'planilha'){
      reader.onload = ()=>{
        const base64 = reader.result.split(',')[1];
        _anexoPendente = { tipo, nome_original: f.name, base64, content_type: f.type };
        txt.textContent = '📎 ' + f.name + ' — planilha anexada (sem leitura automática por IA ainda)';
      };
      reader.readAsDataURL(f);
      return;
    }

    zona.classList.add('analisando'); txt.textContent = '🤖 Lendo o documento com IA…';
    reader.onload = async ()=>{
      const base64 = reader.result.split(',')[1];
      _anexoPendente = { tipo, nome_original: f.name, base64, content_type: f.type };
      try{
        const d = await api('analisarArquivo', {area_id: areaId, tipo, base64, content_type: f.type});
        const a = d.analise;
        if(a.titulo_sugerido) document.getElementById('rg-titulo').value = a.titulo_sugerido;
        if(a.resumo) document.getElementById('rg-descricao').value = a.resumo;
        for(const cp of campos){
          const val = a.campos?.[cp.id];
          const el = document.getElementById('cc_'+cp.id);
          if(val && el) el.value = val;
        }
        const avisos = document.getElementById('area-avisos-ia');
        avisos.innerHTML = a.possivel_duplicado
          ? `<div class="badge-dup">⚠️ <span>Possível duplicidade: ${esc(a.motivo_duplicado||'este documento parece semelhante a um lançamento já existente.')} Confira antes de salvar.</span></div>`
          : `<div class="badge-ok-ia">✅ Documento lido — campos preenchidos automaticamente. Confira e ajuste se precisar.</div>`;
        txt.textContent = '📎 ' + f.name + ' — analisado';
      }catch(e){
        txt.textContent = '⚠️ Não foi possível ler o documento agora (' + e.message + '). O arquivo ainda será anexado ao salvar.';
      }
      zona.classList.remove('analisando');
    };
    reader.readAsDataURL(f);
  });

  document.getElementById('rg-salvar').addEventListener('click', async ()=>{
    const titulo = document.getElementById('rg-titulo').value.trim();
    const msg = document.getElementById('rg-msg');
    if(!titulo){ msg.className='msg-modal erro'; msg.textContent='Título obrigatório'; return; }
    const dadosNovos = {};
    for(const cp of campos){
      const el = document.getElementById('cc_'+cp.id);
      const val = el ? el.value : '';
      if(cp.obrigatorio && !val){ msg.className='msg-modal erro'; msg.textContent=`Campo "${cp.label}" é obrigatório`; return; }
      dadosNovos[cp.id] = val;
    }
    try{
      if(registro){
        await api('atualizarRegistro', {id:registro.id, titulo, descricao:document.getElementById('rg-descricao').value, dados:dadosNovos});
      } else {
        const novo = await api('criarRegistro', {area_id:areaId, titulo, descricao:document.getElementById('rg-descricao').value, dados:dadosNovos});
        if(_anexoPendente){
          await api('uploadAnexo', {registro_id: novo.registro.id, ..._anexoPendente, pular_analise:true, dados_extraidos: dadosNovos});
        }
      }
      fecharModal(); renderArea(areaId);
    }catch(e){ msg.className='msg-modal erro'; msg.textContent=e.message; }
  });
}

async function abrirRegistro(id){
  let d;
  try{ d = await api('obterRegistro', {id}); }catch(e){ alert(e.message); return; }
  const reg = d.registro, areaId = reg.area_id, acesso = acessoDe(areaId);
  const cfg = ST.areasConfig.find(a=>a.area_id===areaId);
  const campos = cfg?.campos || [];
  abrirModal(`
    <button class="fechar" onclick="fecharModal()">×</button>
    <h3>${esc(reg.titulo)}</h3>
    <div class="sub" style="color:#888;font-size:12px;margin-bottom:12px">Lançado por ${esc(reg.criado_por_nome||'—')} em ${fmtData(reg.criado_em)}</div>
    <p style="white-space:pre-wrap">${esc(reg.descricao||'')}</p>
    ${campos.map(cp=>`<div style="margin-bottom:6px"><b style="font-size:12px;color:#666">${esc(cp.label)}:</b> ${esc(reg.dados?.[cp.id]||'—')}</div>`).join('')}
    <h4 style="margin:18px 0 6px;font-size:13px">Anexos</h4>
    <div class="anexos-lista" id="lista-anexos">${(d.anexos||[]).map(an=>`<div class="anexo-item"><span>📎 ${esc(an.nome_original)} (${an.tipo})</span><span>
      <button onclick="baixarAnexo(${an.id})" style="border:none;background:none;cursor:pointer">⬇️</button>
      ${acesso==='edit'?`<button onclick="excluirAnexo(${an.id}, ${id})" style="border:none;background:none;cursor:pointer;color:#a4202a">🗑️</button>`:''}
    </span></div>`).join('') || '<div style="color:#999;font-size:13px">Nenhum anexo</div>'}</div>
    ${acesso==='edit' ? `
      <div style="margin-top:12px"><label>Adicionar anexo (foto, PDF ou planilha)</label><input type="file" id="in-anexo" accept="image/*,.pdf,.xls,.xlsx,.xlsm,.csv"></div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn" onclick="abrirFormRegistro('${areaId}', ${JSON.stringify(reg).replace(/"/g,'&quot;')})">Editar</button>
        <button class="btn perigo" onclick="excluirRegistroConfirma(${id}, '${areaId}')">Excluir</button>
      </div>` : ''}
    <div class="msg-modal" id="anexo-msg"></div>
  `);
  const inAnexo = document.getElementById('in-anexo');
  if(inAnexo) inAnexo.addEventListener('change', async ()=>{
    const f = inAnexo.files[0]; if(!f) return;
    const msg = document.getElementById('anexo-msg');
    msg.className='msg-modal'; msg.textContent='Enviando...';
    const tipo = f.type.startsWith('image/') ? 'foto' : (f.type==='application/pdf' ? 'pdf' : 'planilha');
    const reader = new FileReader();
    reader.onload = async ()=>{
      const base64 = reader.result.split(',')[1];
      try{
        await api('uploadAnexo', {registro_id:id, tipo, nome_original:f.name, base64, content_type:f.type});
        msg.className='msg-modal ok'; msg.textContent='Anexo enviado!';
        abrirRegistro(id);
      }catch(e){ msg.className='msg-modal erro'; msg.textContent=e.message; }
    };
    reader.readAsDataURL(f);
  });
}

async function baixarAnexo(anexoId){
  try{ const d = await api('urlAnexo', {anexo_id:anexoId}); window.open(d.url, '_blank'); }
  catch(e){ alert(e.message); }
}
async function excluirAnexo(anexoId, registroId){
  if(!confirm('Excluir este anexo?')) return;
  try{ await api('excluirAnexo', {anexo_id:anexoId}); abrirRegistro(registroId); }catch(e){ alert(e.message); }
}
async function excluirRegistroConfirma(id, areaId){
  if(!confirm('Excluir este registro? Esta ação não pode ser desfeita.')) return;
  try{ await api('excluirRegistro', {id}); fecharModal(); renderArea(areaId); }catch(e){ alert(e.message); }
}

function abrirEdicaoUsuario(u){
  abrirModal(`
    <button class="fechar" onclick="fecharModal()">×</button>
    <h3>${u?'Editar':'Novo'} usuário</h3>
    <label>Nome completo</label><input type="text" id="us-nome" value="${u?esc(u.nome):''}">
    <label>Usuário (login)</label><input type="text" id="us-login" value="${u?esc(u.usuario):''}" ${u?'disabled':''}>
    ${!u?`<label>Senha inicial</label><input type="password" id="us-senha" placeholder="mínimo 6 caracteres">`:''}
    <label>Nível base</label>
    <select id="us-nivel">${NIVEIS.map(n=>`<option value="${n}" ${u&&u.nivel_base===n?'selected':''}>${n}</option>`).join('')}</select>
    <label>Acesso detalhado por área</label>
    ${gradeAcessosHtml(u?u.acessos:{})}
    ${u?`<label style="margin-top:14px"><input type="checkbox" id="us-ativo" ${u.ativo?'checked':''} style="width:auto;margin-right:6px">Usuário ativo</label>`:''}
    <div style="margin-top:18px;display:flex;gap:8px"><button class="btn" id="us-salvar">Salvar</button><button class="btn secundario" onclick="fecharModal()">Cancelar</button></div>
    <div class="msg-modal" id="us-msg"></div>
  `);
  document.getElementById('us-nivel').addEventListener('change', async (e)=>{
    // ao trocar nível, sugere os acessos padrão daquele nível
    const d = await api('listarNiveis');
    const nc = d.niveis.find(n=>n.nivel===e.target.value);
    if(nc){
      AREAS.forEach(a=>{ document.querySelector('.ga-'+a).value = (nc.acessos_default||{})[a] || 'none'; });
    }
  });
  document.getElementById('us-salvar').addEventListener('click', async ()=>{
    const msg = document.getElementById('us-msg');
    const nome = document.getElementById('us-nome').value.trim();
    const nivel_base = document.getElementById('us-nivel').value;
    const acessos = lerGradeAcessos(document);
    try{
      if(u){
        await api('atualizarUsuario', {id:u.id, nome, nivel_base, acessos, ativo: document.getElementById('us-ativo').checked});
      } else {
        const login = document.getElementById('us-login').value.trim();
        const senha = document.getElementById('us-senha').value;
        await api('criarUsuario', {nome, usuario:login, senha, nivel_base, acessos});
      }
      fecharModal(); renderAdminUsuarios();
    }catch(e){ msg.className='msg-modal erro'; msg.textContent=e.message; }
  });
}

function resetarSenhaUsuario(id, nome){
  abrirModal(`
    <button class="fechar" onclick="fecharModal()">×</button>
    <h3>Redefinir senha — ${esc(nome)}</h3>
    <label>Nova senha</label><input type="password" id="rs-senha" placeholder="mínimo 6 caracteres">
    <div style="margin-top:18px"><button class="btn" id="rs-salvar">Salvar nova senha</button></div>
    <div class="msg-modal" id="rs-msg"></div>
  `);
  document.getElementById('rs-salvar').addEventListener('click', async ()=>{
    const msg = document.getElementById('rs-msg');
    try{ await api('resetarSenha', {id, novaSenha:document.getElementById('rs-senha').value}); msg.className='msg-modal ok'; msg.textContent='Senha atualizada!'; }
    catch(e){ msg.className='msg-modal erro'; msg.textContent=e.message; }
  });
}
async function desbloquearUsuario(id){
  try{ await api('desbloquearUsuario', {id}); renderAdminUsuarios(); }catch(e){ alert(e.message); }
}

async function renderAdminNiveis(){
  const box = document.getElementById('admin-corpo');
  box.innerHTML = '<div class="carregando">Carregando…</div>';
  const d = await api('listarNiveis');
  box.innerHTML = d.niveis.map(n=>`
    <div class="painel-box" style="margin-bottom:12px">
      <h3>${n.nivel}${n.nivel==='MASTER'?' 🔑':''}</h3>
      <label>Descrição</label><input type="text" class="nv-desc" value="${esc(n.descricao||'')}" ${n.nivel==='MASTER'?'disabled':''}>
      <label>Acesso padrão por área (aplicado a novos usuários deste nível)</label>
      ${gradeAcessosHtml(n.acessos_default||{})}
      <label style="margin-top:10px"><input type="checkbox" class="nv-painel" ${n.ve_painel_geral?'checked':''} style="width:auto;margin-right:6px" ${n.nivel==='MASTER'?'disabled':''}>Vê o Painel Central consolidado (todas as áreas)</label>
      <div style="margin-top:10px"><button class="btn secundario" onclick="salvarNivel(this, '${n.nivel}')">Salvar ${n.nivel}</button></div>
      <div class="msg-modal" id="nv-msg-${n.nivel}"></div>
    </div>
  `).join('');
}
async function salvarNivel(btn, nivel){
  const box = btn.closest('.painel-box');
  const descricao = box.querySelector('.nv-desc').value;
  const acessos_default = lerGradeAcessos(box);
  const ve_painel_geral = box.querySelector('.nv-painel').checked;
  const msg = document.getElementById('nv-msg-'+nivel);
  try{ await api('salvarNivel', {nivel, descricao, acessos_default, ve_admin: nivel==='MASTER', ve_painel_geral}); msg.className='msg-modal ok'; msg.textContent='Salvo!'; }
  catch(e){ msg.className='msg-modal erro'; msg.textContent=e.message; }
}

async function renderAdminAreas(){
  const box = document.getElementById('admin-corpo');
  box.innerHTML = '<div class="carregando">Carregando…</div>';
  const d = await api('areasConfig');
  box.innerHTML = d.areas.map(a=>`
    <div class="painel-box" style="margin-bottom:12px">
      <div class="linha-campos">
        <div><label>Nome de exibição</label><input type="text" class="ar-nome-${a.area_id}" value="${esc(a.nome)}"></div>
        <div><label>Ícone (emoji)</label><input type="text" class="ar-icone-${a.area_id}" value="${esc(a.icone||'📁')}"></div>
      </div>
      <label>Descrição</label><input type="text" class="ar-desc-${a.area_id}" value="${esc(a.descricao||'')}">
      <label style="margin-top:10px">Campos personalizados do formulário de lançamento</label>
      <div id="campos-${a.area_id}">${(a.campos||[]).map((cp,i)=>`
        <div class="campo-custom-linha"><span>${esc(cp.label)} — ${TIPOS_CAMPO.find(t=>t[0]===cp.tipo)?.[1]||cp.tipo}${cp.obrigatorio?' (obrigatório)':''}</span>
        <button onclick="removerCampo('${a.area_id}', ${i})" style="border:none;background:none;color:#a4202a;cursor:pointer">🗑️</button></div>
      `).join('') || '<div style="color:#999;font-size:13px;margin-bottom:8px">Nenhum campo personalizado ainda</div>'}</div>
      <div class="linha-campos" style="margin-top:10px">
        <div><label>Novo campo — nome</label><input type="text" id="novo-lbl-${a.area_id}"></div>
        <div><label>Tipo</label><select id="novo-tipo-${a.area_id}">${TIPOS_CAMPO.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join('')}</select></div>
      </div>
      <label style="margin-top:6px"><input type="checkbox" id="novo-obr-${a.area_id}" style="width:auto;margin-right:6px">Obrigatório</label>
      <div style="margin-top:8px"><button class="btn secundario" onclick="adicionarCampo('${a.area_id}')">+ Adicionar campo</button></div>
      <div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="salvarAreaConfig('${a.area_id}')">Salvar ${a.area_id}</button></div>
      <div class="msg-modal" id="ar-msg-${a.area_id}"></div>
    </div>
  `).join('');
  window._areasEmEdicao = {}; d.areas.forEach(a=> window._areasEmEdicao[a.area_id] = JSON.parse(JSON.stringify(a.campos||[])));
}
function adicionarCampo(areaId){
  const label = document.getElementById('novo-lbl-'+areaId).value.trim();
  if(!label) return;
  const tipo = document.getElementById('novo-tipo-'+areaId).value;
  const obrigatorio = document.getElementById('novo-obr-'+areaId).checked;
  window._areasEmEdicao[areaId].push({id: 'c'+Date.now(), label, tipo, obrigatorio});
  renderAdminAreas();
}
function removerCampo(areaId, idx){
  window._areasEmEdicao[areaId].splice(idx,1);
  renderAdminAreas();
}
async function salvarAreaConfig(areaId){
  const nome = document.querySelector('.ar-nome-'+areaId).value.trim();
  const icone = document.querySelector('.ar-icone-'+areaId).value.trim() || '📁';
  const descricao = document.querySelector('.ar-desc-'+areaId).value;
  const campos = window._areasEmEdicao[areaId];
  const msg = document.getElementById('ar-msg-'+areaId);
  try{
    await api('salvarAreaConfig', {area_id:areaId, nome, descricao, icone, campos});
    const areasCfg = await api('areasConfig'); ST.areasConfig = areasCfg.areas; montarMenu();
    msg.className='msg-modal ok'; msg.textContent='Salvo!';
  }catch(e){ msg.className='msg-modal erro'; msg.textContent=e.message; }
}

// ---------- BOOT ----------
(async ()=>{
  const ok = await tentarSessaoExistente();
  if(!ok){ document.getElementById('tela-login').style.display='flex'; }
})();
</script>
</body>
</html>
