// ---------- modelo ----------
function osFrasePadrao(resp){ const f=(OS.listas.frase||[]).find(x=>x.extra===resp); return f ? f.valor : ''; }
function osItemT(v){ return {t:'texto', v:v||''}; }
function osNovoDoc(){
  const resp = r => ({resp:r, itens:[osItemT(osFrasePadrao(r))]});
  return { distribuicao:['Chefe da P3','Subcomandante','Sargenteação','Militares'],
    evento:[osItemT('')], objetivo:[osItemT('')],
    atribuicoes:['Chefe da P3','Subcomandante','Sargenteante','Militares'].map(resp),
    usaItinerario:false, itinerarios:[],
    recursos:['Armamentos de porte e munições compatíveis para os militares de serviço','Armamentos e equipamentos (individuais e coletivos)','Rádios transceptores'],
    usaPrescricoes:false, prescricoes:[] };
}
function osNormalizar(d){
  const v = osNovoDoc(); const o = Object.assign({}, v, d||{});
  ['distribuicao','evento','objetivo','atribuicoes','itinerarios','recursos','prescricoes'].forEach(k=>{ if(!Array.isArray(o[k])) o[k] = v[k]; });
  o.atribuicoes.forEach(a=>{ if(!Array.isArray(a.itens)) a.itens=[]; });
  return JSON.parse(JSON.stringify(o));
}
function osArr(path){
  if(path==='evento'||path==='objetivo'||path==='prescricoes') return OS.d[path];
  const m = String(path).match(/^atrib\.(\d+)$/); return m ? (OS.d.atribuicoes[+m[1]]||{}).itens : null;
}
function osSujo(){ OS.salva = false; const s=document.getElementById('os-sujo'); if(s) s.style.display='block'; }

// ---------- abertura ----------
async function renderAreaOS(areaId, acesso){
  osInjetarCss();
  OS = Object.assign(OS, { modo:'lista', podeEditar:acesso==='edit', listas:{}, lista:[], busca:'', id:null, d:null, salva:true, aviso:'', filtroTipo:'', modoModelo:null, tipo:'', importLog:null, chat:null });
  const box = document.getElementById('area-corpo');
  box.innerHTML = '<div class="carregando">Carregando…</div>';
  try{
    const l = await apiOS('osListas'); OS.listas = l.listas; OS.modelos = l.modelos||[]; OS.tipos = l.tipos||[]; OS.temasUsados = l.temasUsados||[]; OS.podeEditar = !!l.podeEditar;
    await osCarregarLista('');
  }catch(e){ box.innerHTML = `<p style="color:#a4202a">${esc(e.message)}</p>`; }
}
async function osCarregarLista(busca){
  OS.busca = busca||''; OS.modo = 'lista';
  const r = await apiOS('osListar', {busca:OS.busca, tipo:OS.filtroTipo}); OS.lista = r.os;
  osRenderLista();
}
function osRenderLista(){
  const box = document.getElementById('area-corpo'); if(!box) return;
  const linhas = OS.lista.map(o=>`<tr>
    <td style="white-space:nowrap"><b>${osNum(o.numero)}/${o.ano}</b></td>
    <td>${esc(o.titulo)}${o.sigilo==='com' ? ' <span style="background:#c00;color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:bold">SIGILOSO</span>' : ''}${o.tipo ? '<div style="font-size:11px;color:#777">'+esc(o.tipo)+'</div>' : ''}</td>
    <td style="white-space:nowrap">${esc(osDataBR(o.data_evento))}</td>
    <td>${(o.temas||[]).map(t=>`<span class="os-tema" style="padding:2px 9px">${esc(t)}</span>`).join('')}</td>
    <td style="white-space:nowrap"><button class="btn secundario" style="padding:3px 10px" onclick="osAbrir(${o.id})">Abrir</button>
      <button class="btn" style="padding:3px 10px;background:#2c4870" onclick="osAbrir(${o.id},true)">Gerar</button></td></tr>`).join('');
  box.innerHTML = `
    <div class="filtros" style="align-items:flex-end;gap:10px;flex-wrap:wrap">
      <div style="min-width:380px;flex:1"><label>Buscar O.S. (número, título, tema ou qualquer texto)</label>
        <input type="text" id="os-busca" value="${esc(OS.busca)}" placeholder="ex.: motociata, explosivo, 3.041, aeroporto…" onkeydown="if(event.key==='Enter') osBuscar()"></div>
      <div><label>Tipo</label><select onchange="osFiltrarTipo(this.value)"><option value="">Todos</option>${(OS.tipos||[]).map(t=>`<option value="${esc(t)}" ${t===OS.filtroTipo?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
      <div><button class="btn secundario" onclick="osBuscar()">🔍 Buscar</button></div>
      <div><button class="btn" onclick="osEscolherModelo()" ${OS.podeEditar?'':'disabled title="Seu usuário só visualiza o P3"'}>＋ Nova O.S.</button></div>
      <div><button class="btn" style="background:#6a3fb5" onclick="osAbrirAssistente('novo')" ${OS.podeEditar?'':'disabled title="Seu usuário só visualiza o P3"'} title="Converse com o assistente: ele lê as O.S. antigas, pergunta o que faltar e monta a O.S.">🤖 Assistente de O.S.</button></div>
      <div><button class="btn secundario" onclick="document.getElementById('os-imp').click()" ${OS.podeEditar?'':'disabled'} title="Envie O.S. em Word (.docx) ou PDF: o app lê e cadastra para você editar">📥 Importar O.S. (Word/PDF)</button>
        <input type="file" id="os-imp" accept=".docx,.pdf" multiple style="display:none" onchange="osImportar(this)"></div>
      <div><button class="btn secundario" onclick="osAbrirModelos()">📋 Tipos (modelos)</button></div>
      <div><button class="btn secundario" onclick="osAbrirListas()">⚙️ Listas</button></div>
    </div>
    <div id="os-imp-status" style="${OS.importLog ? '' : 'display:none;'}background:#f4f7fb;border:1px solid #c9d6ea;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px;line-height:1.7">${osHtmlImportLog()}</div>
    <div style="font-size:12px;color:#777;margin:6px 0">${OS.lista.length} O.S. ${OS.busca ? 'encontrada(s) para “'+esc(OS.busca)+'”' : 'salva(s)'}.</div>
    <table class="os-lista"><thead><tr><th>Nº</th><th>Título / tipo</th><th>Evento</th><th>Temas (só para busca)</th><th></th></tr></thead>
      <tbody>${linhas || '<tr><td colspan="5" style="color:#999">Nenhuma O.S. encontrada.</td></tr>'}</tbody></table>`;
}
function osBuscar(){ osCarregarLista((document.getElementById('os-busca')||{}).value||'').catch(e=>alert(e.message)); }

function osFiltrarTipo(v){ OS.filtroTipo = v; osCarregarLista(OS.busca).catch(e=>alert(e.message)); }
function osEscolherModelo(){
  const cartoes = (OS.modelos||[]).map(m=>`<div class="os-card" style="margin:8px 0;display:flex;gap:10px;align-items:center;justify-content:space-between">
      <div><b>${esc(m.nome)}</b> ${m.sigilo==='com' ? '<span style="background:#c00;color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:bold">SIGILOSO</span>' : ''}<div style="font-size:12px;color:#666">${esc(m.descricao||'')}</div></div>
      <button class="btn" style="padding:4px 14px" onclick="osNovaCom(${m.id})">Usar</button></div>`).join('');
  abrirModal(`<h3 style="margin-top:0">Nova O.S. — escolha o tipo</h3>
    <div style="max-height:56vh;overflow:auto">
      <div class="os-card" style="margin:8px 0;display:flex;gap:10px;align-items:center;justify-content:space-between"><div><b>📄 Em branco</b><div style="font-size:12px;color:#666">Estrutura padrão (Evento, Objetivo, Atribuições, Recursos), sem tipo definido.</div></div><button class="btn secundario" style="padding:4px 14px" onclick="osNovaCom(0)">Usar</button></div>
      ${cartoes || '<div style="color:#999;font-size:13px">Nenhum tipo cadastrado ainda.</div>'}
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:12px"><button class="btn secundario" onclick="osAbrirModelos()">📋 Gerenciar tipos</button><button class="btn secundario" onclick="fecharModal()">Cancelar</button></div>`);
}
async function osNovaCom(id){
  const m = id ? (OS.modelos||[]).find(x=>x.id===id) : null; fecharModal();
  await osNovaDe(m ? {titulo:'', tipo:m.nome, sigilo:m.sigilo, temas:[], d:m.dados, aviso:'Criada a partir do tipo “'+m.nome+'”. Preencha o título, a data e os campos entre [colchetes].'} : {titulo:'', tipo:'', sigilo:'sem', temas:[], d:null});
}
async function osNovaDe(base){
  try{
    const ano = new Date().getFullYear();
    const p = await apiOS('osProximo', {ano});
    OS.id = null; OS.modoModelo = null; OS.ano = ano; OS.numero = p.numero;
    OS.titulo = base.titulo||''; OS.tipo = base.tipo||''; OS.sigilo = base.sigilo||'sem'; OS.data_evento = base.data_evento||'';
    OS.temas = (base.temas||[]).slice(); OS.d = base.d ? osNormalizar(base.d) : osNovoDoc(); OS.aviso = base.aviso||'';
    OS.salva = false; OS.modo = 'form'; osRenderForm();
  }catch(e){ alert(e.message); }
}
async function osAbrir(id, gerar){
  try{
    const r = await apiOS('osObter', {id}); const o = r.os;
    OS.id = o.id; OS.modoModelo = null; OS.numero = o.numero; OS.ano = o.ano; OS.titulo = o.titulo; OS.tipo = o.tipo||''; OS.sigilo = o.sigilo; OS.data_evento = o.data_evento||'';
    OS.temas = Array.isArray(o.temas) ? o.temas.slice() : []; OS.d = osNormalizar(o.dados); OS.salva = true; OS.aviso = ''; OS.modo = 'form';
    osRenderForm();
    if(gerar) osGerar();
  }catch(e){ alert(e.message); }
}
async function osVoltar(){
  if(!OS.salva && OS.podeEditar && !confirm('Há alterações não salvas. Voltar para a lista mesmo assim?')) return;
  OS.modoModelo = null; OS.salva = true;
  try{ await osCarregarLista(OS.busca); }catch(e){ alert(e.message); }
}

// ---------- formulário ----------
function osNumSecao(){ // numeração automática das seções
  let n = 3; const r = {evento:1, objetivo:2, atrib:3};
  r.itin = OS.d.usaItinerario ? ++n : 0; r.recursos = ++n; r.presc = OS.d.usaPrescricoes ? ++n : 0; return r;
}
function osItemHtml(path, i, it){
  if(it.t==='img') return `<div class="os-row" style="align-items:flex-start"><img src="${it.v}" style="max-height:110px;border:1px solid #ccc;border-radius:4px">
    <input type="text" placeholder="Legenda (opcional)" value="${esc(it.legenda||'')}" style="width:260px" oninput="osLegenda('${path}',${i},this.value)">
    <button class="os-x" title="Remover" onclick="osRemItem('${path}',${i})">🗑</button></div>`;
  return `<div style="margin:6px 0"><textarea id="os-ta-${path}-${i}" class="os-ta" ${OS.podeEditar?'':'readonly'} oninput="osTexto('${path}',${i},this.value)">${esc(it.v)}</textarea>
    <div class="os-row" style="font-size:12px;color:#666">📅 <input type="date" title="Escolha a data: entra no texto no formato padrão" onchange="osInsData('${path}',${i},this)">
      <label style="display:inline-flex;align-items:center;gap:3px"><input type="checkbox" ${OS.semana?'checked':''} onchange="OS.semana=this.checked"> com dia da semana</label>
      🕐 <input type="time" title="Escolha a hora: entra no texto no formato padrão" onchange="osInsHora('${path}',${i},this)">
      <button class="os-x" title="Remover" onclick="osRemItem('${path}',${i})">🗑</button></div></div>`;
}
function osCardItens(titulo, path, itens, num, extra){
  return `<div class="os-card"><h4>${num ? num+'. ' : ''}${titulo} <button class="os-add" onclick="osAddItem('${path}')">＋ Incluir</button><button class="os-add" onclick="osAddImg('${path}')">🖼 Imagem</button>${extra||''}</h4>
    ${itens.map((it,i)=>osItemHtml(path,i,it)).join('') || '<div style="font-size:12px;color:#999">Nada incluído.</div>'}</div>`;
}
function osFrasesSelect(path, resp){
  const fr = (OS.listas.frase||[]); const sel = fr.filter(f=>f.extra===resp); const lista = sel.length ? sel : fr;
  if(!lista.length) return '';
  return `<select onchange="osAddFrase('${path}',this)"><option value="">＋ frase padrão…</option>${lista.map(f=>`<option value="${esc(f.valor)}">${esc(f.valor.slice(0,70))}</option>`).join('')}</select>`;
}

      <div><button class="btn" onclick="osSalvarModelo()" ${pode?'':'disabled title="Seu usuário só visualiza o P3"'}>💾 Salvar modelo</button></div>
      <div id="os-msg" style="font-size:13px;color:#2a7a2a"></div></div>

  return `<div class="filtros" style="align-items:flex-end;gap:10px;flex-wrap:wrap">

      <div><button class="btn" style="background:#2c4870" onclick="osGerar()">📄 Gerar O.S.</button></div>
      <div><button class="btn secundario" onclick="osDuplicar()" ${OS.podeEditar?'':'disabled'}>⧉ Duplicar</button></div>
      <div><button class="btn" style="background:#6a3fb5" onclick="osAbrirAssistente('form')" ${OS.podeEditar?'':'disabled'} title="Peça alterações a esta O.S. por conversa">🤖 Assistente</button></div>
      <div><button class="btn secundario" style="color:#a4202a" onclick="osExcluir()" ${OS.podeEditar && OS.id?'':'disabled'}>🗑 Excluir</button></div>
      <div id="os-msg" style="font-size:13px;color:#2a7a2a"></div>
    </div>`;
}
function osHtmlInicio(distChips){
  const d = OS.d, M = OS.modoModelo;
  const tipos = (OS.modelos||[]).map(m=>m.nome); if(OS.tipo && !tipos.includes(OS.tipo)) tipos.push(OS.tipo);
  return `<div class="os-card"><h4>${M ? 'Modelo (tipo de O.S.)' : 'Início'}</h4>
    ${M ? `<div class="os-row"><input type="text" style="width:420px;max-width:100%" placeholder="Nome do tipo (ex.: Operação conjunta)" value="${esc(M.nome)}" oninput="OS.modoModelo.nome=this.value;osSujo()">
        <input type="text" style="width:520px;max-width:100%" placeholder="Descrição curta (opcional)" value="${esc(M.descricao)}" oninput="OS.modoModelo.descricao=this.value;osSujo()"></div>` : ''}

        <button class="os-x" title="Remover itinerário" onclick="osRemItin(${i})">🗑</button></div>

      ${(it.passos||[]).map((p,j)=>`<div class="os-row"><span class="os-num">●</span><input type="text" style="width:640px;max-width:100%" value="${esc(p)}" oninput="osPasso(${i},${j},this.value)"><button class="os-x" onclick="osRemPasso(${i},${j})">🗑</button></div>`).join('')}
      <button class="os-add" onclick="osAddPasso(${i})">＋ Incluir passo</button></div>`).join('');
  box.innerHTML = `

    ${OS.aviso ? `<div style="background:#fff6d6;border:1px solid #e6cf72;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px">ℹ️ ${esc(OS.aviso)}</div>` : ''}
    <div id="os-sujo" style="font-size:12px;color:#a4202a;margin:4px 0;display:${OS.salva?'none':'block'}">● Alterações ainda não salvas</div>

    ${osHtmlInicio(distChips)}

    ${osCardItens('EVENTO','evento',d.evento,S.evento)}
    ${osCardItens('OBJETIVO','objetivo',d.objetivo,S.objetivo)}
    <div class="os-card"><h4>${S.atrib}. ATRIBUIÇÕES ESPECÍFICAS <button class="os-add" onclick="osAddResp()">＋ Incluir responsável</button></h4>${atrib || '<div style="font-size:12px;color:#999">Nenhum responsável.</div>'}</div>

    <div class="os-card"><h4><label style="display:inline-flex;gap:6px;align-items:center"><input type="checkbox" ${d.usaItinerario?'checked':''} onchange="osTogItin(this.checked)"> ${S.itin ? S.itin+'. ' : ''}ITINERÁRIO (Previsão Inicial) — seção opcional</label>
      ${d.usaItinerario ? '<button class="os-add" onclick="osAddItin()">＋ Incluir itinerário</button>' : ''}</h4>
      <datalist id="os-rotulos"><option value="Ponto de origem"><option value="Ponto de concentração"><option value="Ponto final"><option value="Local"></datalist>
      ${d.usaItinerario ? (itin || '<div style="font-size:12px;color:#999">Nenhum itinerário.</div>') : '<div style="font-size:12px;color:#999">Marque a caixa para incluir esta seção.</div>'}</div>

function osSetCab(c,v){
  if(c==='numero') OS.numero = parseInt(v,10)||1; else if(c==='ano') OS.ano = parseInt(v,10)||new Date().getFullYear();
  else OS[c] = v;
  osSujo(); if(c==='sigilo') osRenderForm();
}
function osToggleDist(v){ const a=OS.d.distribuicao, i=a.indexOf(v); if(i>=0) a.splice(i,1); else a.push(v); osSujo(); osRenderForm(); }
function osAddDist(){ const v=(prompt('Distribuição — digite o destinatário:')||'').trim(); if(v){ OS.d.distribuicao.push(v); osSujo(); osRenderForm(); } }
function osTexto(path,i,v){ const a=osArr(path); if(a&&a[i]) a[i].v = v; osSujo(); }
function osLegenda(path,i,v){ const a=osArr(path); if(a&&a[i]) a[i].legenda = v; osSujo(); }
function osAddItem(path){ osArr(path).push(osItemT('')); osSujo(); osRenderForm(); }
function osRemItem(path,i){ osArr(path).splice(i,1); osSujo(); osRenderForm(); }
function osAddFrase(path,sel){ const v=sel.value; if(!v) return; osArr(path).push(osItemT(v)); osSujo(); osRenderForm(); }
function osInserirTexto(path,i,txt){
  const ta = document.getElementById(`os-ta-${path}-${i}`), a = osArr(path); if(!ta||!a||!a[i]) return;
  const ini = ta.selectionStart ?? ta.value.length, fim = ta.selectionEnd ?? ta.value.length;
  const antes = ta.value.charAt(ini-1), depois = ta.value.charAt(fim);
  if(antes && !/[\s(\[]/.test(antes)) txt = ' '+txt;          // espaço antes, se colar em cima de uma palavra
  if(depois && /[\p{L}\d]/u.test(depois)) txt = txt+' ';        // espaço depois, se vier palavra em seguida
  ta.value = ta.value.slice(0,ini)+txt+ta.value.slice(fim); a[i].v = ta.value;
  ta.focus(); ta.selectionStart = ta.selectionEnd = ini+txt.length; osSujo();
}
function osInsData(path,i,el){ if(!el.value) return; osInserirTexto(path,i,osFmtData(el.value, OS.semana)); el.value=''; }
function osInsHora(path,i,el){ if(!el.value) return; osInserirTexto(path,i,osFmtHora(el.value)); el.value=''; }
function osRedimensionar(file, max){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>{ const im = new Image();
      im.onload = ()=>{ const k = Math.min(1, (max||1000)/im.width); const c = document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
        const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',0.8)); };
      im.onerror = ()=>rej(new Error('Imagem inválida')); im.src = fr.result; };
    fr.onerror = ()=>rej(new Error('Não foi possível ler a imagem')); fr.readAsDataURL(file);
  });
}
function osAddImg(path){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange = async ()=>{ if(!inp.files[0]) return;
    try{ const url = await osRedimensionar(inp.files[0], 1000); osArr(path).push({t:'img', v:url, legenda:''}); osSujo(); osRenderForm(); }catch(e){ alert(e.message); } };
  inp.click();
}

function osRemResp(i){ if(!confirm('Remover este responsável e os itens dele?')) return; OS.d.atribuicoes.splice(i,1); osSujo(); osRenderForm(); }

function osAddItin(){ OS.d.itinerarios.push({titulo:'',hi:'',hf:'',rotulo:'Ponto de origem',local:'',passos:['']}); osSujo(); osRenderForm(); }

function osRemItin(i){ OS.d.itinerarios.splice(i,1); osSujo(); osRenderForm(); }
function osPasso(i,j,v){ OS.d.itinerarios[i].passos[j] = v; osSujo(); }
